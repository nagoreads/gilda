<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gilda | club de lectura & mailclub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
      .font-serif { font-family: 'Lora', serif; }
      .fade-in { animation: fadeIn 0.4s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      function App() {
        const [rutaElegida, setRutaElegida] = useState(null);
        const [modalidadSeleccionada, setModalidadSeleccionada] = useState(null);
        const [opcionAmiga, setOpcionAmiga] = useState('De momento no');
        const [enviando, setEnviando] = useState(false);
        const [yaSoyGilda, setYaSoyGilda] = useState(false);
        const [codigoSecreto, setCodigoSecreto] = useState('');

        const modalidades = [
          { nombre: 'gilda cotilla', precio: 'Gratis', icono: '🪟', esGratis: true, soloEmail: true, pideDireccion: false, incluyeAmiga: false, enlaceStripe: 'https://buy.stripe.com/bJe4gt3IdakFdfqaxv6Ri09', descripcion: 'Solo lectura de comentarios en la app.' },
          { nombre: 'gilda satélite', precio: '1 €/mes', icono: '🪐', esGratis: false, soloEmail: true, pideDireccion: true, incluyeAmiga: false, enlaceStripe: 'https://buy.stripe.com/cNi4gtfqV8cxeju0WV6Ri01', descripcion: 'Leer comentarios y añadir apuntes en la app (Sin chat ni cafecitos).' },
          { nombre: 'gilda de café', precio: '5 €/mes', icono: '☕', esGratis: false, soloEmail: false, pideDireccion: true, incluyeAmiga: true, enlaceStripe: 'https://buy.stripe.com/3cI5kx0w1gJ3fny4976Ri02', descripcion: 'Acceso a la app (Chat, cafecitos, leer comentarios y añadir apuntes).' },
          { nombre: 'gilda de nube', precio: '5 €/mes', icono: '☁️', esGratis: false, soloEmail: false, pideDireccion: true, incluyeAmiga: true, enlaceStripe: 'https://buy.stripe.com/cNi5kx92xcsNb7i3536Ri03', descripcion: 'Recibes por email la carta, plantilla, anti-guía de la autora, pegatinas y marcapáginas digital.' },
          { nombre: 'gilda de papel', precio: '10 €/mes', icono: '💌', esGratis: false, soloEmail: false, pideDireccion: true, incluyeAmiga: true, enlaceStripe: 'https://buy.stripe.com/bJe8wJ7Yt50l1wIbBz6Ri04', descripcion: 'Envío físico a tu buzón con carta, plantilla, anti-guía, pegatinas, marcapáginas y sorpresas.' },
          { nombre: 'gilda virtual', precio: '8 €/mes', icono: '💫', esGratis: false, soloEmail: false, pideDireccion: true, incluyeAmiga: true, enlaceStripe: 'https://buy.stripe.com/bJe9ANguZ9gB6R27lj6Ri05', destacado: true, descripcion: 'Envío digital por email + Acceso total a la app (Chat, cafecitos, comentarios y apuntes).' },
          { nombre: 'gilda absoluta', precio: '12 €/mes', icono: '🗝️', esGratis: false, soloEmail: false, pideDireccion: true, incluyeAmiga: true, enlaceStripe: 'https://buy.stripe.com/14A5kxemReAV2AMcFD6Ri08', descripcion: 'Envío físico a tu buzón + Acceso total a la app y club de lectura (Chat, cafecitos, comentarios).' }
        ];

        const modalidadGratis = modalidades.find((m) => m.esGratis);
        const modalidadesPago = modalidades.filter((m) => !m.esGratis);

        const volverAlInicio = () => { setRutaElegida(null); setModalidadSeleccionada(null); setYaSoyGilda(false); setCodigoSecreto(''); };
        const volverAModalidades = () => { if (rutaElegida === 'gratis') volverAlInicio(); else { setModalidadSeleccionada(null); setYaSoyGilda(false); setCodigoSecreto(''); } };

        const enviarFormulario = async (e) => {
          e.preventDefault();
          if (yaSoyGilda && codigoSecreto.trim().toUpperCase() !== 'GILDA-VET-4X9P') {
            alert('❌ El código de veterana no es correcto. Por favor, revísalo o desmarca la casilla si eres nueva.');
            return;
          }
          setEnviando(true);
          const form = e.target;
          const data = new FormData(form);
          const enlaceDestino = yaSoyGilda || modalidadSeleccionada.esGratis ? 'https://gildamailclub.glideos.app' : modalidadSeleccionada.enlaceStripe;
          try { await fetch(form.action, { method: form.method, body: data }); } catch (error) { console.error('Error enviando a Make:', error); }
          window.location.href = enlaceDestino;
        };

        return (
          <div className="min-h-screen flex flex-col items-center pt-16 pb-24 px-4 sm:px-6 text-gray-900">
            <header className="max-w-2xl w-full text-center space-y-4 mb-10">
              <h1 className="text-5xl md:text-6xl font-serif font-bold tracking-tight text-gray-900">bienvenida a gilda.</h1>
              <p className="text-lg md:text-xl text-gray-600 leading-relaxed font-serif italic px-4">mucho más que un club de lectura y un mailclub. un espacio íntimo y seguro para leer y compartir a nuestro propio ritmo.</p>
            </header>
            {!rutaElegida && !modalidadSeleccionada && (
              <main className="max-w-4xl w-full fade-in">
                <h2 className="text-2xl font-serif font-semibold text-center mb-8 text-gray-800">me hace muchísima ilusión tenerte por aquí.<br />¿cómo quieres vivir esta experiencia?</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <button onClick={() => setRutaElegida('pago')} className="group flex flex-col items-center justify-center p-10 bg-white border border-gray-200 rounded-2xl hover:border-gray-900 hover:shadow-lg transition-all">
                    <span className="text-5xl mb-6 group-hover:scale-110 transition-transform">✨</span>
                    <h3 className="text-2xl font-bold font-serif mb-3 text-gray-900">desde dentro</h3>
                    <p className="text-gray-500">accede al club de lectura, los cafecitos con autoras, recibe tu mail o carta y participa en el sorteo de varios libros.</p>
                  </button>
                  <button onClick={() => { setRutaElegida('gratis'); setModalidadSeleccionada(modalidadGratis); }} className="group flex flex-col items-center justify-center p-10 bg-white border border-gray-200 rounded-2xl hover:border-gray-900 hover:shadow-lg transition-all">
                    <span className="text-5xl mb-6 group-hover:scale-110 transition-transform">🪟</span>
                    <h3 className="text-2xl font-bold font-serif mb-3 text-gray-900">asomarme un ratito</h3>
                    <p className="text-gray-500">únete gratis como gilda cotilla para ver si esto te encaja.</p>
                  </button>
                </div>
              </main>
            )}
            {rutaElegida === 'pago' && !modalidadSeleccionada && (
              <div className="w-full max-w-6xl fade-in">
                <button onClick={volverAlInicio} className="text-sm text-gray-500 hover:text-gray-900 mb-6 flex items-center group"><span className="mr-2 group-hover:-translate-x-1 transition-transform">←</span> volver atrás</button>
                <div className="text-center mb-10"><h2 className="text-3xl font-serif font-bold text-gray-900 mb-2">elige tu experiencia</h2></div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {modalidadesPago.map((mod, index) => (
                    <div key={index} className={`relative flex flex-col bg-white rounded-2xl p-6 text-left border ${mod.destacado ? 'border-gray-900 shadow-md lg:scale-105 z-10' : 'border-gray-100 shadow-sm'} hover:shadow-md transition-all`}>
                      {mod.destacado && <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">más popular</span>}
                      <div className="text-3xl mb-4">{mod.icono}</div>
                      <h3 className="text-xl font-bold font-serif text-gray-900">{mod.nombre}</h3>
                      <div className="mt-2 mb-4"><span className="text-2xl font-bold">{mod.precio}</span></div>
                      <p className="text-sm text-gray-600 mb-6 flex-grow leading-relaxed">{mod.descripcion}</p>
                      <button onClick={() => { setModalidadSeleccionada(mod); setOpcionAmiga('De momento no'); }} className={`w-full py-3 rounded-full font-medium transition-colors mt-auto ${mod.destacado ? 'bg-gray-900 text-white hover:bg-gray-800' : 'bg-gray-100 text-gray-900 hover:bg-gray-200'}`}>quiero esta modalidad</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {modalidadSeleccionada && (
              <div className="w-full max-w-3xl fade-in text-left">
                <button onClick={volverAModalidades} className="text-sm text-gray-500 hover:text-gray-900 mb-6 flex items-center group"><span className="mr-2 group-hover:-translate-x-1 transition-transform">←</span> {rutaElegida === 'gratis' ? 'volver al inicio' : 'volver a las modalidades'}</button>
                <div className="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-gray-100">
                  <div className="mb-8 pb-6 border-b border-gray-100"><h2 className="text-3xl font-serif font-bold text-gray-900 mb-2">ya casi lo tenemos</h2><p className="text-gray-600">estás a punto de unirte a <strong className="text-gray-900">{modalidadSeleccionada.nombre}</strong> ({modalidadSeleccionada.precio}). déjame tus datos para que pueda preparar tu llegada.</p></div>
                  <form action="https://hook.eu1.make.com/jqyyj744ed5u2mxpf7uawxzaleraqs4f" method="POST" onSubmit={enviarFormulario} className="space-y-6">
                    <input type="hidden" name="Modalidad_Elegida" value={`${modalidadSeleccionada.nombre} (${modalidadSeleccionada.precio})`} />
                    <input type="hidden" name="_subject" value={`¡Nueva ${modalidadSeleccionada.nombre}!`} />
                    <div><label className="block text-sm text-gray-700 mb-1">Nombre completo *</label><input type="text" name="Nombre" required className="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 outline-none focus:border-gray-900" /></div>
                    <div><label className="block text-sm text-gray-700 mb-1">Correo electrónico *</label><input type="email" name="Email" required placeholder="hola@ejemplo.com" className="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 outline-none focus:border-gray-900" /></div>
                    <button type="submit" disabled={enviando} className="w-full bg-black text-white py-4 rounded-full font-bold text-lg shadow-lg hover:bg-gray-800">{enviando ? 'Procesando...' : 'apúntate aquí :)'}</button>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
