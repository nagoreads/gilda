    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #adae1d;
        color: #1a1a1a;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .font-editorial-title {
        font-family: 'Georgia', serif;
        letter-spacing: -0.5px;
      }

      .font-modern-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: -1.2px;
      }

      .editorial-card {
        background: #ffffee;
        color: #1a1a1a;
        border: 1px solid #e2e2da;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      .editorial-input {
        background: #ffffff;
        border: 1px solid #e2e2da;
        border-radius: 8px;
        color: #1a1a1a;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .editorial-input:focus {
        outline: none;
        background: #ffffff;
        border-color: #adae1d;
        box-shadow: 0 0 0 3px rgba(173, 174, 29, 0.2);
      }

      .editorial-btn {
        background: #1a1a1a;
        color: #ffffff;
        border-radius: 20px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .editorial-btn:hover { background: #adae1d; color: #1a1a1a; }

      .editorial-nav {
        background: rgba(26, 26, 26, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }

      .fade-in { animation: fadeIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes windowGlow {
        0%, 100% { box-shadow: 0 0 4px #fffa8d; transform: scale(1); }
        50% { box-shadow: 0 0 10px #ffffaa; transform: scale(1.03); }
      }
      .ventana-novedad {
        animation: windowGlow 2s infinite ease-in-out;
      }

      @keyframes floatBannerQueue {
        0% { opacity: 0; transform: translateY(-4px); }
        12% { opacity: 1; transform: translateY(0); }
        88% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }
      .notificacion-secuencial {
        animation: floatBannerQueue 4.5s ease-in-out forwards;
      }

      #mapa-gilda { height: 280px; width: 100%; border-radius: 8px; border: 1px solid #e2e2da; z-index: 1; }

      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 2px; }

  <body>
    <div id="root" class="w-full flex flex-col items-center"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbwjmfQLMDx1k6Tk0D1KDF1S3JCwI88x1w1HZhyyRkTbS2gsbPqMqSv9yus2CRDYbQ_S/exec';
      const URL_CSV_USUARIAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=0&single=true&output=csv';
      const URL_CSV_CAPITULOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1060479353&single=true&output=csv';
      const URL_CSV_COMENTARIOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1626426174&single=true&output=csv';
      const URL_CSV_CAFECITOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1040100079&single=true&output=csv';
      const URL_CSV_LECTURAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1676533026&single=true&output=csv';
      const URL_CSV_CHAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=456334295&single=true&output=csv';
      const URL_CSV_PROPUESTAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1701531859&single=true&output=csv';
      const URL_CSV_VOTACION_CAFE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=933058441&single=true&output=csv';
      const URL_CSV_LECTURAS_PERSONALES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1089788162&single=true&output=csv';

      const ENLACES_STRIPE = {
        satelite: 'https://buy.stripe.com/cNi4gtfqV8cxeju0WV6Ri01',
        cafe: 'https://buy.stripe.com/3cI5kx0w1gJ3fny4976Ri02',
        nube: 'https://buy.stripe.com/cNi5kx92xcsNb7i3536Ri03',
        virtual: 'https://buy.stripe.com/bJe9ANguZ9gB6R27lj6Ri05',
        papel: 'https://buy.stripe.com/bJe8wJ7Yt50l1wIbBz6Ri04',
        absoluta: 'https://buy.stripe.com/14A5kxemReAV2AMcFD6Ri08'
      };

      const FRASES_INICIALES = [
        "Un lector vive mil vidas antes de morir. El que no lee vive solo una.",
        "La depresión... como la manifestación de algo que no se puede reducir a lo anecdótico porque es estructural y colectivo.",
        "No hay barrera, cerradura ni cerrojo que puedas imponer a la libertad de mi mente."
      ];

      function normalizarComunidad(nombre, ciudad = '') {
        if (!nombre && !ciudad) return 'Sin especificar';
        const textoCompleto = `${nombre || ''} ${ciudad || ''}`.toLowerCase().trim();

        if (
          textoCompleto.includes('gipuzkoa') || 
          textoCompleto.includes('guipúzcoa') || 
          textoCompleto.includes('bizkaia') || 
          textoCompleto.includes('vizcaya') || 
          textoCompleto.includes('araba') || 
          textoCompleto.includes('álava') || 
          textoCompleto.includes('alava') || 
          textoCompleto.includes('país vasco') || 
          textoCompleto.includes('euskadi') ||
          textoCompleto.includes('tolosa') ||
          textoCompleto.includes('eibar') ||
          textoCompleto.includes('donostia') ||
          textoCompleto.includes('san sebastián') ||
          textoCompleto.includes('bilbao') ||
          textoCompleto.includes('vitoria') ||
          textoCompleto.includes('gasteiz')
        ) {
          return 'País Vasco';
        }

        if (textoCompleto.includes('barcelona') || textoCompleto.includes('girona') || textoCompleto.includes('gerona') || textoCompleto.includes('lleida') || textoCompleto.includes('lérida') || textoCompleto.includes('tarragona') || textoCompleto.includes('catalunya') || textoCompleto.includes('cataluña')) return 'Cataluña';
        if (textoCompleto.includes('madrid')) return 'Comunidad de Madrid';
        if (textoCompleto.includes('sevilla') || textoCompleto.includes('málaga') || textoCompleto.includes('malaga') || textoCompleto.includes('cadiz') || textoCompleto.includes('cádiz') || textoCompleto.includes('granada') || textoCompleto.includes('cordoba') || textoCompleto.includes('córdoba') || textoCompleto.includes('almería') || textoCompleto.includes('almeria') || textoCompleto.includes('huelva') || textoCompleto.includes('jaén') || textoCompleto.includes('jaen') || textoCompleto.includes('andalucía') || textoCompleto.includes('andalucia')) return 'Andalucía';
        if (textoCompleto.includes('coruña') || textoCompleto.includes('lugo') || textoCompleto.includes('ourense') || textoCompleto.includes('orense') || textoCompleto.includes('pontevedra') || textoCompleto.includes('galicia')) return 'Galicia';
        if (textoCompleto.includes('valència') || textoCompleto.includes('valencia') || textoCompleto.includes('alacant') || textoCompleto.includes('alicante') || textoCompleto.includes('castelló') || textoCompleto.includes('castellón') || textoCompleto.includes('comunitat valenciana')) return 'Comunidad Valenciana';

        return nombre || 'Sin especificar';
      }

      function BuscadorLibros({ placeholder, valor, setValor, onSelectLibro }) {
        const [sugerencias, setSugerencias] = useState([]);
        const [buscando, setBuscando] = useState(false);
        const [mostrarDropdown, setMostrarDropdown] = useState(false);

        useEffect(() => {
          if (!valor || valor.trim().length < 3) {
            setSugerencias([]);
            setMostrarDropdown(false);
            return;
          }

          const timer = setTimeout(async () => {
            setBuscando(true);
            try {
              const query = encodeURIComponent(valor.trim());
              
              const [resGoogle, resOpenLib] = await Promise.allSettled([
                fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=5&langRestrict=es`),
                fetch(`https://openlibrary.org/search.json?q=${query}&limit=5`)
              ]);

              let listaCombinada = [];

              if (resGoogle.status === 'fulfilled' && resGoogle.value.ok) {
                const dataG = await resGoogle.value.json();
                if (dataG.items) {
                  dataG.items.forEach(item => {
                    const info = item.volumeInfo || {};
                    listaCombinada.push({
                      titulo: info.title || '',
                      autora: info.authors ? info.authors.join(', ') : 'Autora desconocida',
                      portada: info.imageLinks?.thumbnail?.replace('http:', 'https:') || ''
                    });
                  });
                }
              }

              if (resOpenLib.status === 'fulfilled' && resOpenLib.value.ok) {
                const dataOL = await resOpenLib.value.json();
                if (dataOL.docs) {
                  dataOL.docs.forEach(doc => {
                    listaCombinada.push({
                      titulo: doc.title || '',
                      autora: doc.author_name ? doc.author_name.join(', ') : 'Autora desconocida',
                      portada: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : ''
                    });
                  });
                }
              }

              const unicos = [];
              const titulosVistos = new Set();
              listaCombinada.forEach(item => {
                const tLimpio = item.titulo.toLowerCase().trim();
                if (tLimpio && !titulosVistos.has(tLimpio)) {
                  titulosVistos.add(tLimpio);
                  unicos.push(item);
                }
              });

              setSugerencias(unicos.slice(0, 6));
              setMostrarDropdown(unicos.length > 0);
            } catch (err) {
              console.error("Error al consultar APIs de libros:", err);
            } finally {
              setBuscando(false);
            }
          }, 350);

          return () => clearTimeout(timer);
        }, [valor]);

        return (
          <div className="relative w-full">
            <div className="relative flex items-center">
              <input
                type="text"
                placeholder={placeholder}
                value={valor}
                onChange={(e) => {
                  setValor(e.target.value);
                  setMostrarDropdown(true);
                }}
                className="w-full editorial-input p-2.5 text-xs italic pr-8"
              />
              {buscando && (
                <i className="fa-solid fa-spinner animate-spin absolute right-2.5 text-xs text-[#adae1d]"></i>
              )}
            </div>

            {mostrarDropdown && sugerencias.length > 0 && (
              <div className="absolute top-full left-0 right-0 z-50 bg-[#ffffee] border border-[#e2e2da] rounded-b-lg shadow-xl max-h-56 overflow-y-auto mt-1">
                {sugerencias.map((item, idx) => (
                  <div
                    key={idx}
                    onClick={() => {
                      onSelectLibro(item);
                      setMostrarDropdown(false);
                    }}
                    className="flex items-center gap-2.5 p-2 hover:bg-white cursor-pointer border-b border-[#e2e2da] last:border-0 text-left"
                  >
                    {item.portada ? (
                      <img src={item.portada} alt="" className="w-7 h-10 object-cover rounded shrink-0 shadow-xs" />
                    ) : (
                      <div className="w-7 h-10 bg-white rounded shrink-0 flex items-center justify-center text-[7px] text-gray-400 border border-[#e2e2da]">Sin foto</div>
                    )}
                    <div className="overflow-hidden">
                      <p className="text-xs font-bold text-[#1a1a1a] truncate leading-tight">{item.titulo}</p>
                      <p className="text-[10px] text-gray-500 italic truncate">{item.autora}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PortadaLibro({ titulo, autora, portada, size = 'normal' }) {
        const [imgUrl, setImgUrl] = useState(portada || '');
        const [errorImg, setErrorImg] = useState(false);

        useEffect(() => {
          setImgUrl(portada || '');
          setErrorImg(false);

          if ((!portada || portada.trim() === '') && titulo && titulo.trim().length > 1) {
            let cancelado = false;
            const query = encodeURIComponent(titulo.trim());
            
            fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1&langRestrict=es`)
              .then(res => res.json())
              .then(data => {
                if (!cancelado && data.items && data.items[0]?.volumeInfo?.imageLinks?.thumbnail) {
                  setImgUrl(data.items[0].volumeInfo.imageLinks.thumbnail.replace('http:', 'https:'));
                } else if (!cancelado) {
                  return fetch(`https://openlibrary.org/search.json?q=${query}&limit=1`)
                    .then(r => r.json())
                    .then(dataOL => {
                      if (!cancelado && dataOL.docs && dataOL.docs[0]?.cover_i) {
                        setImgUrl(`https://covers.openlibrary.org/b/id/${dataOL.docs[0].cover_i}-M.jpg`);
                      }
                    });
                }
              })
              .catch(() => {});

            return () => { cancelado = true; };
          }
        }, [titulo, portada]);

        const sizeClasses = size === 'large' ? 'w-24 h-36 text-xs' : size === 'grid' ? 'w-16 h-24 text-[9px]' : size === 'thumb' ? 'w-10 h-14 text-[8px]' : 'w-12 h-16 text-[8px]';

        if (imgUrl && !errorImg) {
          return <img src={imgUrl} alt={titulo} onError={() => setErrorImg(true)} className={`${sizeClasses} object-cover rounded shadow-xs shrink-0`} />;
        }
        return (
          <div className={`${sizeClasses} bg-[#1a1a1a] text-[#ffffee] p-1.5 rounded shadow-xs border border-[#e2e2da] shrink-0 flex flex-col justify-between overflow-hidden text-left relative`}>
            <div className="absolute top-0 right-0 w-1.5 h-full bg-[#adae1d]"></div>
            <span className="font-medium tracking-tight line-clamp-3 leading-tight">{titulo || 'Sin título'}</span>
            <span className="text-[8px] text-[#adae1d] uppercase tracking-wider truncate">{autora || 'gilda'}</span>
          </div>
        );
      }

      function AvatarUsuaria({ foto, nombre, sizeClass = "w-9 h-9", textClass = "text-lg" }) {
        const [errorImg, setErrorImg] = useState(false);

        if (foto && foto.trim() !== '' && !errorImg) {
          return (
            <img 
              src={foto} 
              alt={nombre || 'Socia'} 
              onError={() => setErrorImg(true)} 
              className={`${sizeClass} rounded-full object-cover border border-[#e2e2da] shrink-0`} 
            />
          );
        }

        return (
          <div className={`${sizeClass} rounded-full bg-white border border-[#e2e2da] flex items-center justify-center font-editorial-title ${textClass} text-[#adae1d] shrink-0`}>
            {(nombre || 'Socia').charAt(0).toUpperCase()}
          </div>
        );
      }

      function EdificioClub({ usuarias, libroActual, onAddWantToRead }) {
        const [usuariaActivaIndice, setUsuariaActivaIndice] = useState(0);
        const [notificacionActual, setNotificacionActual] = useState(null);
        const colaNotificaciones = useRef([]);
        const estaProcesando = useRef(false);

        const listaUsuarias = usuarias.length > 0 ? usuarias : [];
        const usuariaActiva = listaUsuarias[usuariaActivaIndice] || listaUsuarias[0] || {};

        const tieneProgresoClub = Number(usuariaActiva.pagina || 0) > 0;
        const misLibrosPersonales = usuariaActiva.misLecturasPersonales || [];

        const procesarSiguienteNotificacion = () => {
          if (colaNotificaciones.current.length === 0) {
            estaProcesando.current = false;
            setNotificacionActual(null);
            return;
          }
          estaProcesando.current = true;
          const siguiente = colaNotificaciones.current.shift();
          setNotificacionActual(siguiente);

          setTimeout(() => {
            setNotificacionActual(null);
            setTimeout(() => {
              procesarSiguienteNotificacion();
            }, 400);
          }, 4500);
        };

        useEffect(() => {
          const nuevas = [];
          listaUsuarias.forEach((u, i) => {
            if (u.tieneNovedad) {
              const tituloLibro = (Number(u.pagina || 0) > 0) 
                ? libroActual.titulo 
                : (u.misLecturasPersonales && u.misLecturasPersonales.length > 0 ? u.misLecturasPersonales[0].libro : '');
              
              const pagLibro = (Number(u.pagina || 0) > 0)
                ? u.pagina
                : (u.misLecturasPersonales && u.misLecturasPersonales.length > 0 ? (u.misLecturasPersonales[0].pagina || u.misLecturasPersonales[0].paginas) : 0);

              const texto = `${(u.nombre || '').toLowerCase()} - ${tituloLibro || 'lectura'} - pag. ${pagLibro || 0}`;

              if (!colaNotificaciones.current.some(n => n.id === u.email) && (!notificacionActual || notificacionActual.id !== u.email)) {
                nuevas.push({ id: u.email, texto, indice: i });
              }
            }
          });

          if (nuevas.length > 0) {
            colaNotificaciones.current = [...colaNotificaciones.current, ...nuevas];
            if (!estaProcesando.current) {
              procesarSiguienteNotificacion();
            }
          }
        }, [listaUsuarias, libroActual]);

        return (
          <div className="flex flex-col items-center w-full max-w-[450px] mx-auto py-2 relative">
            <h2 className="text-[28px] font-editorial-title font-medium text-center mb-1 text-white">gilda</h2>
            <p className="text-[13px] text-white/80 text-center mb-4 leading-relaxed">
              Selecciona una ventana para ver sus lecturas actuales.
            </p>

            <div className="h-8 mb-4 flex items-center justify-center">
              {notificacionActual && (
                <div 
                  key={notificacionActual.id + notificacionActual.texto}
                  onClick={() => setUsuariaActivaIndice(notificacionActual.indice)}
                  className="bg-[#1a1a1a] text-[#ffffee] border border-[#adae1d] px-3 py-1 rounded-full shadow-lg text-[10px] font-medium tracking-wide notificacion-secuencial cursor-pointer flex items-center gap-2"
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-[#adae1d] animate-pulse"></span>
                  <span>{notificacionActual.texto}</span>
                </div>
              )}
            </div>

            <div className="grid grid-cols-3 gap-x-6 gap-y-8 w-full max-w-[220px] mx-auto mb-10">
              {listaUsuarias.map((usuaria, indice) => {
                const estaLeyendo = usuaria.estaLeyendo;
                const tieneNovedad = usuaria.tieneNovedad;
                const seleccionada = usuariaActivaIndice === indice;
                const esNotificacionActiva = notificacionActual && notificacionActual.id === usuaria.email;
                const nombreMostrar = (usuaria.nombre || 'Socia').split(' ')[0].toLowerCase();

                return (
                  <div key={indice} className="relative flex flex-col items-center">
                    <div
                      onClick={() => setUsuariaActivaIndice(indice)}
                      className={`w-[32px] h-[44px] rounded-[1px] cursor-pointer transition-all duration-200 hover:scale-105 relative ${
                        estaLeyendo ? 'bg-[#ffffee] shadow-[0_4px_12px_rgba(255,255,238,0.2)]' : 'bg-[#8e9014]'
                      } ${tieneNovedad ? 'ventana-novedad' : ''} ${
                        esNotificacionActiva ? 'ring-2 ring-[#fffa8d] scale-110 z-20' : ''

      function MapaGilda({ usuarias }) {
        const mapRef = useRef(null);
        const markersGroupRef = useRef(null);
        const [regionSeleccionada, setRegionSeleccionada] = useState(null);
        const [regionAbierta, setRegionAbierta] = useState(null);

        // Coordenadas predefinidas de respaldo para pintado inmediato sin depender de APIs
        const COORDENADAS_PREDEFINIDAS = {
          'país vasco': [42.9896, -2.6189],
          'cataluña': [41.5912, 1.5209],
          'comunidad de madrid': [40.4168, -3.7038],
          'andalucía': [37.3891, -5.9845],
          'galicia': [42.5751, -8.1339],
          'comunidad valenciana': [39.4840, -0.3526],
          'alava': [42.8467, -2.6716],
          'álava': [42.8467, -2.6716],
          'gipuzkoa': [43.1500, -2.3000],
          'guipúzcoa': [43.1500, -2.3000],
          'bizkaia': [43.2630, -2.9350],
          'vizcaya': [43.2630, -2.9350],
          'tolosa': [43.1362, -2.0735],
          'donostia': [43.3183, -1.9812],
          'san sebastián': [43.3183, -1.9812],
          'bilbao': [43.2630, -2.9350],
          'vitoria': [42.8467, -2.6716],
          'gasteiz': [42.8467, -2.6716],
          'madrid': [40.4168, -3.7038],
          'barcelona': [41.3851, 2.1734],
          'sevilla': [37.3891, -5.9845],
          'valencia': [39.4699, -0.3763]
        };

        const estructuraRegiones = useMemo(() => {
          const mapa = {};
          usuarias.forEach(u => {
            const reg = normalizarComunidad(u.provincia_region, u.ciudad);
            const ciu = u.ciudad || 'Sin localidad';

            if (!mapa[reg]) mapa[reg] = { total: 0, ciudades: {} };
            if (!mapa[reg].ciudades[ciu]) mapa[reg].ciudades[ciu] = [];

            mapa[reg].ciudades[ciu].push(u);
            mapa[reg].total += 1;
          });

          return Object.entries(mapa)
            .filter(([reg]) => reg !== 'Sin especificar' && reg !== 'Global')
            .map(([region, data]) => ({
              region,
              total: data.total,
              ciudades: Object.entries(data.ciudades).map(([ciudad, list]) => ({
                ciudad,
                count: list.length,
                usuarias: list
              })).sort((a, b) => b.count - a.count)
            }))
            .sort((a, b) => b.total - a.total);
        }, [usuarias]);

        const ciudadesMap = useMemo(() => {
          const map = {};
          usuarias.forEach(u => {
            const loc = u.ciudad || u.provincia_region;
            const cp = u.codigo_postal || '';
            if (loc) {
              const key = cp ? `${loc}, ${cp}` : loc;
              if (!map[key]) map[key] = { query: key, nombreLocalidad: loc, usuarias: [] };
              map[key].usuarias.push(u);
            }
          });
          return Object.values(map);
        }, [usuarias]);

        useEffect(() => {
          if (!mapRef.current) {
            const map = L.map('mapa-gilda', { 
              zoomControl: false, 
              attributionControl: false 
            }).setView([40.4167, -3.7037], 5);

            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 18
            }).addTo(map);

            markersGroupRef.current = L.layerGroup().addTo(map);
            mapRef.current = map;
          }

          const pintarMarcador = (lat, lon, item) => {
            const cant = item.usuarias.length;
            const circleMarker = L.circleMarker([lat, lon], {
              radius: Math.max(8, 7 + Math.min(cant * 2, 16)),
              fillColor: "#1a1a1a",
              color: "#ffffff",
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            });

            circleMarker.bindTooltip(`<b>${item.nombreLocalidad}</b>: ${cant} lectora${cant > 1 ? 's' : ''}`, { 
              direction: 'top', 
              permanent: false 
            });

            circleMarker.on('click', () => setRegionSeleccionada({ region: item.nombreLocalidad, usuarias: item.usuarias }));
            markersGroupRef.current.addLayer(circleMarker);
          };

          const renderMarkers = async () => {
            if (!markersGroupRef.current) return;
            markersGroupRef.current.clearLayers();

            for (const item of ciudadesMap) {
              const claveLimpia = item.nombreLocalidad.toLowerCase().trim();
              
              // 1. Si está en el diccionario local, se pinta al instante
              if (COORDENADAS_PREDEFINIDAS[claveLimpia]) {
                const [lat, lon] = COORDENADAS_PREDEFINIDAS[claveLimpia];
                pintarMarcador(lat, lon, item);
                continue;
              }

              // 2. Si no, intenta buscar en la API con fallback
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(item.query)}&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) {
                  pintarMarcador(parseFloat(data[0].lat), parseFloat(data[0].lon), item);
                }
              } catch (e) {
                console.error("No se pudieron obtener coordenadas para:", item.query);
              }
            }
          };

          renderMarkers();
        }, [ciudadesMap]);

        return (
          <div className="space-y-4">
            <div className="relative">
              <div id="mapa-gilda"></div>
              {regionSeleccionada && (
                <div className="absolute inset-0 z-[1000] bg-[#ffffee]/95 backdrop-blur-sm p-4 flex flex-col rounded-lg fade-in text-[#1a1a1a]">
                  <div className="flex justify-between items-center border-b border-[#e2e2da] pb-2 mb-3">
                    <h3 className="font-editorial-title font-medium text-base">{regionSeleccionada.region} ({regionSeleccionada.usuarias.length})</h3>
                    <button onClick={() => setRegionSeleccionada(null)} className="text-xs text-gray-500 bg-white border border-[#e2e2da] px-2 py-1 rounded">cerrar</button>
                  </div>
                  <div className="overflow-y-auto flex-grow space-y-2">
                    {regionSeleccionada.usuarias.map((u, i) => (
                      <div key={i} className="flex justify-between items-center text-xs p-2 bg-white rounded border border-[#e2e2da] gap-2">
                        <div className="flex items-center gap-2 overflow-hidden">
                          <AvatarUsuaria foto={u.foto_perfil} nombre={u.nombre} sizeClass="w-6 h-6" textClass="text-[10px]" />
                          <span className="font-medium truncate">{u.nombre}</span>
                        </div>
                        <span className="text-gray-500 shrink-0">{u.ciudad || 'Sin localidad'}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="bg-white p-3.5 rounded-xl border border-[#e2e2da] space-y-2">
              <div className="flex justify-between items-center pb-2 border-b border-[#e2e2da]">
                <h4 className="font-editorial-title text-xs font-bold text-[#1a1a1a]">Comunidades Autónomas y Municipios</h4>
                <span className="text-[10px] text-gray-500 uppercase font-semibold">Usuarias</span>
              </div>
              <div className="max-h-56 overflow-y-auto space-y-1.5 pr-1">
                {estructuraRegiones.length === 0 ? (
                  <p className="text-[11px] text-gray-400 italic text-center py-2">No hay ubicaciones registradas.</p>
                ) : (
                  estructuraRegiones.map((item, idx) => {
                    const estaAbierta = regionAbierta === item.region;
                    return (
                      <div key={idx} className="rounded-lg border border-[#e2e2da] overflow-hidden">
                        <div 
                          onClick={() => setRegionAbierta(estaAbierta ? null : item.region)}
                          className="flex justify-between items-center text-xs p-2.5 bg-[#ffffee] hover:bg-[#f2f2e4] cursor-pointer transition-colors"
                        >
                          <div className="flex items-center gap-2">
                            <i className={`fa-solid fa-chevron-${estaAbierta ? 'down' : 'right'} text-[9px] text-gray-500`}></i>
                            <span className="font-medium text-[#1a1a1a] capitalize">{item.region}</span>
                          </div>
                          <span className="bg-[#adae1d] text-white px-2 py-0.5 rounded-full text-[10px] font-bold">
                            {item.total} {item.total === 1 ? 'usuaria' : 'usuarias'}
                          </span>
                        </div>

                        {estaAbierta && (
                          <div className="bg-white p-2 border-t border-[#e2e2da] space-y-1">
                            {item.ciudades.map((sub, cIdx) => (
                              <div 
                                key={cIdx} 
                                onClick={() => setRegionSeleccionada({ region: sub.ciudad, usuarias: sub.usuarias })}
                                className="flex justify-between items-center text-[11px] p-1.5 pl-5 rounded hover:bg-gray-50 cursor-pointer"
                              >
                                <span className="text-gray-700 capitalize">{sub.ciudad}</span>
                                <span className="text-gray-400 font-semibold">{sub.count}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [sesion, setSesion] = useState(() => { try { return JSON.parse(localStorage.getItem('gilda_sesion')); } catch { return null; } });
        const [inputEmail, setInputEmail] = useState('');
        const [inputPassword, setInputPassword] = useState('');
        const [errorLogin, setErrorLogin] = useState('');
        
        const [modoRegistro, setModoRegistro] = useState(false);
        const [regNombre, setRegNombre] = useState('');
        const [regEmail, setRegEmail] = useState('');
        const [regCiudad, setRegCiudad] = useState('');
        const [regCodigoPostal, setRegCodigoPostal] = useState('');
        const [regModalidad, setRegModalidad] = useState('cotilla');
        
        const [seccionApp, setSeccionApp] = useState('inicio');
        const [subTabComunidad, setSubTabComunidad] = useState('chat');
        const [tabEstanteria, setTabEstanteria] = useState('leyendo');
        const [cargandoDatos, setCargandoDatos] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        
        const [usuariasClub, setUsuariasClub] = useState([]);
        const [capitulos, setCapitulos] = useState([]);
        const [comentarios, setComentarios] = useState([]);
        const [cafecitos, setCafecitos] = useState([]);
        const [lecturas, setLecturas] = useState([]);
        const [chatMsgs, setChatMsgs] = useState([]);
        const [propuestas, setPropuestas] = useState([]);
        const [fechasCafe, setFechasCafe] = useState([]);
        const [lecturasPersonales, setLecturasPersonales] = useState([]);

        const [miPagina, setMiPagina] = useState(0);
        const [isReadingNow, setIsReadingNow] = useState(() => { try { return JSON.parse(localStorage.getItem('gilda_is_reading')) || false; } catch { return false; } });
        
        const [miCiudad, setMiCiudad] = useState(() => localStorage.getItem('gilda_mi_ciudad') || '');
        const [miCodigoPostal, setMiCodigoPostal] = useState(() => localStorage.getItem('gilda_mi_cp') || '');
        const [nombreUsuarioPersonalizado, setNombreUsuarioPersonalizado] = useState(() => localStorage.getItem('gilda_nombre_usuario') || '');
        const [fotoPerfilPersonalizada, setFotoPerfilPersonalizada] = useState(() => localStorage.getItem('gilda_foto_perfil') || '');
        const [editandoPerfil, setEditandoPerfil] = useState(false);
        const [inputNuevoNombre, setInputNuevoNombre] = useState('');
        const [inputNuevaFoto, setInputNuevaFoto] = useState('');

        const [libroPersonal, setLibroPersonal] = useState('');
        const [paginaPersonalInput, setPaginaPersonalInput] = useState('');

        const [nuevaPropuestaTitulo, setNuevaPropuestaTitulo] = useState('');
        const [nuevaPropuestaAutora, setNuevaPropuestaAutora] = useState('');
        const [nuevaPropuestaPortada, setNuevaPropuestaPortada] = useState('');
        const [mostrarModalConectadas, setMostrarModalConectadas] = useState(false);

        const [misCitas, setMisCitas] = useState(() => { try { return JSON.parse(localStorage.getItem('gilda_mis_citas')) || []; } catch { return []; }});
        const [nuevaFraseBotella, setNuevaFraseBotella] = useState('');
        const [botellaAbierta, setBotellaAbierta] = useState(false);
        const [fraseActualBotella, setFraseActualBotella] = useState(0);

        const [nuevoComentario, setNuevoComentario] = useState({});
        const [respuestaComentario, setRespuestaComentario] = useState({});
        const [nuevaCitaCapsula, setNuevaCitaCapsula] = useState({});
        const [nuevoChat, setNuevoChat] = useState('');
        const [mensajeFundadora, setMensajeFundadora] = useState('');

        const mostrarToast = (texto) => { setToastMsg(texto); setTimeout(() => setToastMsg(null), 3000); };
        
        const parsearHoja = (url) => new Promise(resolve => {
          Papa.parse(url, { 
            download: true, 
            header: true, 
            skipEmptyLines: true, 
            transformHeader: (h) => h.trim().toLowerCase(),
            complete: (res) => resolve(res.data || []), 
            error: () => resolve([]) 
          });
        });

        const cargarTodosLosDatos = () => {
          Promise.all([
            parsearHoja(URL_CSV_USUARIAS),
            parsearHoja(URL_CSV_CAPITULOS), 
            parsearHoja(URL_CSV_COMENTARIOS), 
            parsearHoja(URL_CSV_CAFECITOS),
            parsearHoja(URL_CSV_LECTURAS), 
            parsearHoja(URL_CSV_CHAT), 
            parsearHoja(URL_CSV_PROPUESTAS),
            parsearHoja(URL_CSV_VOTACION_CAFE), 
            parsearHoja(URL_CSV_LECTURAS_PERSONALES)
          ]).then(results => {
            const listU = results[0].filter(u => (u.email || '').trim() !== '');
            setUsuariasClub(listU);
            setCapitulos(results[1]); 
            setComentarios(results[2].reverse()); 
            setCafecitos(results[3]);
            setLecturas(results[4]); 
            setChatMsgs(results[5]); 
            setPropuestas(results[6]);
            setFechasCafe(results[7]); 
            setLecturasPersonales(results[8]);

            enriquecerUbicacionesAntiguas(listU);
          });
        };

        const enriquecerUbicacionesAntiguas = async (listaUsuarias) => {
          const paraActualizar = listaUsuarias.filter(u => {
            const tieneCiudad = u.ciudad && u.ciudad.trim() !== '';
            const sinProvincia = !u.provincia_region || u.provincia_region.trim() === '' || u.provincia_region.trim().toLowerCase() === u.ciudad.trim().toLowerCase();
            return tieneCiudad && sinProvincia;
          });

          if (paraActualizar.length === 0) return;

          let huboCambios = false;
          const clonUsuarias = [...listaUsuarias];

          for (const u of paraActualizar) {
            try {
              const queryGeo = u.codigo_postal ? `${u.ciudad}, ${u.codigo_postal}` : u.ciudad;
              const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryGeo)}&limit=1&addressdetails=1`);
              const data = await res.json();
              if (data && data.length > 0 && data[0].address) {
                const addr = data[0].address;
                let prov = addr.province || addr.state || addr.region || addr.county || addr.state_district || u.ciudad;
                prov = normalizarComunidad(prov, u.ciudad);
                
                if (prov && prov !== u.provincia_region) {
                  const target = clonUsuarias.find(x => x.email === u.email);
                  if (target) target.provincia_region = prov;
                  huboCambios = true;

                  enviarAccion('actualizar_ubicacion', { 
                    email: u.email,
                    usuario: u.nombre,
                    ciudad: u.ciudad, 
                    codigo_postal: u.codigo_postal || '',
                    provincia_region: prov 
                  });
                }
              }
            } catch (e) {}
          }

          if (huboCambios) {
            setUsuariasClub(clonUsuarias);
          }
        };

        useEffect(() => {
          parsearHoja(URL_CSV_USUARIAS).then(data => {
            const list = data.filter(u => (u.email || '').trim() !== '');
            setUsuariasClub(list);
            enriquecerUbicacionesAntiguas(list);
          });
        }, []);

        useEffect(() => {
          if (sesion) {
            setCargandoDatos(true);
            cargarTodosLosDatos();
            setCargandoDatos(false);

            const interval = setInterval(() => {
              parsearHoja(URL_CSV_CHAT).then(data => setChatMsgs(data));
              parsearHoja(URL_CSV_USUARIAS).then(data => setUsuariasClub(data.filter(u => (u.email || '').trim() !== '')));
              parsearHoja(URL_CSV_LECTURAS_PERSONALES).then(data => setLecturasPersonales(data));
            }, 10000);

            return () => clearInterval(interval);
          }
        }, [sesion]);

        useEffect(() => {
          if (sesion && usuariasClub.length > 0) {
            const socia = usuariasClub.find(u => (u.email || '').toLowerCase() === sesion.email.toLowerCase());
            if (socia) {
              setMiPagina(Number(socia.pagina || 0));
              if (!nombreUsuarioPersonalizado) {
                const nomDefault = socia.nombre || sesion.email.split('@')[0];
                setNombreUsuarioPersonalizado(nomDefault);
                localStorage.setItem('gilda_nombre_usuario', nomDefault);
              }
              if (!fotoPerfilPersonalizada && socia.foto_perfil) {
                setFotoPerfilPersonalizada(socia.foto_perfil);
                localStorage.setItem('gilda_foto_perfil', socia.foto_perfil);
              }
              if (socia.ciudad && !miCiudad) setMiCiudad(socia.ciudad);
              if (socia.codigo_postal && !miCodigoPostal) setMiCodigoPostal(socia.codigo_postal);
            }
          }
        }, [sesion, usuariasClub.length]);

        const enviarAccion = async (action, payload) => {
          try {
            const nombreActual = payload.usuario || nombreUsuarioPersonalizado || sesion?.nombre || 'Socia';
            const emailActual = payload.email || sesion?.email;
            await fetch(GOOGLE_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, usuario: nombreActual, usuaria: nombreActual, email: emailActual, ...payload }),
            });
          } catch (err) { console.error(err); }
        };

        const guardarMiUbicacion = async () => {
          if (!miCiudad.trim()) return;
          localStorage.setItem('gilda_mi_ciudad', miCiudad);
          localStorage.setItem('gilda_mi_cp', miCodigoPostal);
          
          let prov = miCiudad;
          try {
            const queryGeo = miCodigoPostal.trim() ? `${miCiudad}, ${miCodigoPostal}` : miCiudad;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryGeo)}&limit=1&addressdetails=1`);
            const data = await res.json();
            if (data && data.length > 0 && data[0].address) {
              const addr = data[0].address;
              prov = addr.province || addr.state || addr.region || addr.county || addr.state_district || miCiudad;
            }
          } catch (e) {}

          prov = normalizarComunidad(prov, miCiudad);

          enviarAccion('actualizar_ubicacion', {
            email: sesion.email,
            usuario: nombreUsuarioPersonalizado || sesion.nombre,
            ciudad: miCiudad,
            codigo_postal: miCodigoPostal,
            provincia_region: prov
          });

          mostrarToast('Ubicación actualizada.');
        };

        const iniciarSesion = (e) => {
          e.preventDefault();
          setErrorLogin('');
          const mail = inputEmail.trim().toLowerCase();
          const pwd = inputPassword.trim();
          if (!mail || !pwd) return;

          const socia = usuariasClub.find(u => (u.email || '').trim().toLowerCase() === mail);
          if (!socia) return setErrorLogin('Este correo no está registrado en gilda.');
          if ((socia.estado || '').toLowerCase() === 'pendiente') return setErrorLogin('Tu cuenta está pendiente de aprobación.');

          const pwdSheet = socia.password || '';
          if (pwdSheet === '') {
            if (pwd.length < 4) return setErrorLogin('Establece una contraseña de al menos 4 caracteres.');
            enviarAccion('set_password', { email: mail, password: pwd });
            mostrarToast('Contraseña registrada con éxito.');
          } else {
            if (pwdSheet !== pwd) return setErrorLogin('Contraseña incorrecta.');
          }

          const nombreDef = socia.nombre || mail.split('@')[0];
          const datosSesion = { nombre: nombreDef, email: mail, modalidad: (socia.modalidad || 'gilda').toLowerCase() };
          localStorage.setItem('gilda_sesion', JSON.stringify(datosSesion));
          localStorage.setItem('gilda_nombre_usuario', nombreDef);
          if (socia.foto_perfil) {
            localStorage.setItem('gilda_foto_perfil', socia.foto_perfil);
            setFotoPerfilPersonalizada(socia.foto_perfil);
          }
          setSesion(datosSesion);
        };

        const registrarse = async (e) => {
          e.preventDefault();
          setErrorLogin('');
          const mail = regEmail.trim().toLowerCase();
          const nom = regNombre.trim().toLowerCase();
          const ciu = regCiudad.trim();
          const cp = regCodigoPostal.trim();

          if (!mail || !nom) return setErrorLogin('Completa tu nombre y correo electrónico.');

          const nombreOcupado = usuariasClub.some(u => (u.nombre || '').trim().toLowerCase() === nom);
          if (nombreOcupado) {
            return setErrorLogin('Este nombre de usuario ya está en uso. Por favor, elige otro.');
          }

          if (regModalidad === 'cotilla') {
            const sociaExistente = usuariasClub.find(u => (u.email || '').trim().toLowerCase() === mail);
            if (sociaExistente) {
              return setErrorLogin('Este correo ya está registrado. Por favor, inicia sesión.');
            }

            let provinciaDetectada = ciu;
            if (ciu) {
              try {
                const queryGeo = cp ? `${ciu}, ${cp}` : ciu;
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryGeo)}&limit=1&addressdetails=1`);
                const data = await res.json();
                if (data && data.length > 0 && data[0].address) {
                  const addr = data[0].address;
                  provinciaDetectada = addr.province || addr.state || addr.region || addr.county || addr.state_district || ciu;
                }
              } catch (e) {
                console.error("Error al detectar provincia:", e);
              }
            }

            provinciaDetectada = normalizarComunidad(provinciaDetectada, ciu);

            enviarAccion('registro_cotilla', {
              nombre: nom,
              email: mail,
              ciudad: ciu,
              codigo_postal: cp,
              provincia_region: provinciaDetectada,
              modalidad: 'gilda cotilla'
            });

            const datosSesion = { nombre: nom, email: mail, modalidad: 'gilda cotilla' };
            localStorage.setItem('gilda_sesion', JSON.stringify(datosSesion));
            localStorage.setItem('gilda_nombre_usuario', nom);
            if (ciu) localStorage.setItem('gilda_mi_ciudad', ciu);
            if (cp) localStorage.setItem('gilda_mi_cp', cp);
            
            setSesion(datosSesion);
            mostrarToast('¡Bienvenida a gilda!');
          } else {
            const urlStripe = ENLACES_STRIPE[regModalidad];
            if (urlStripe) {
              window.location.href = urlStripe;
            } else {
              setErrorLogin('Modalidad de pago seleccionada no válida.');
            }
          }
        };

        const cerrarSesion = () => { localStorage.removeItem('gilda_sesion'); setSesion(null); setInputEmail(''); setInputPassword(''); };

        const manejarCambioArchivoFoto = (e) => {
          const archivo = e.target.files[0];
          if (!archivo) return;

          if (archivo.size > 2 * 1024 * 1024) {
            mostrarToast('⚠️ La imagen es muy pesada (máx 2MB).');
            return;
          }

          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            setInputNuevaFoto(uploadEvent.target.result);
          };
          reader.readAsDataURL(archivo);
        };

        const guardarPerfil = () => {
          const nuevoNom = inputNuevoNombre.trim().toLowerCase();
          const nuevaFoto = inputNuevaFoto;

          if (nuevoNom && nuevoNom !== (nombreUsuarioPersonalizado || '').toLowerCase()) {
            const ocupado = usuariasClub.some(u => (u.email || '').toLowerCase() !== sesion.email.toLowerCase() && (u.nombre || '').trim().toLowerCase() === nuevoNom);
            if (ocupado) {
              mostrarToast('⚠️ Ese nombre de usuario ya está ocupado.');
              return;
            }
            setNombreUsuarioPersonalizado(nuevoNom);
            localStorage.setItem('gilda_nombre_usuario', nuevoNom);
            enviarAccion('actualizar_nombre', { nombre: nuevoNom });
          }

          if (nuevaFoto !== undefined && nuevaFoto !== '') {
            setFotoPerfilPersonalizada(nuevaFoto);
            localStorage.setItem('gilda_foto_perfil', nuevaFoto);
            enviarAccion('actualizar_foto', { foto_perfil: nuevaFoto });
          }

          setEditandoPerfil(false);
          mostrarToast('Perfil actualizado con éxito.');
        };

        const guardarLibroPersonal = (tituloOpt, pagOpt, estadoOpt = 'leyendo', autoraOpt = '', portadaOpt = '') => {
          const tituloLibro = (tituloOpt !== undefined ? tituloOpt : libroPersonal).trim();
          if (!tituloLibro) return;
          const pag = Number(pagOpt !== undefined ? pagOpt : paginaPersonalInput) || 0;

          const clon = [...lecturasPersonales];
          const idx = clon.findIndex(l => (l.email || '').toLowerCase() === sesion.email.toLowerCase() && (l.libro || '').toLowerCase() === tituloLibro.toLowerCase());
          
          if (idx > -1) {
            clon[idx].pagina = pag;
            clon[idx].paginas = pag;
            clon[idx].estado = estadoOpt;
            if (autoraOpt) clon[idx].autora = autoraOpt;
            if (portadaOpt) clon[idx].portada = portadaOpt;
          } else {
            clon.push({ 
              email: sesion.email, 
              nombre: nombreUsuarioPersonalizado || sesion.nombre, 
              libro: tituloLibro, 
              pagina: pag,
              paginas: pag,
              estado: estadoOpt,
              autora: autoraOpt,
              portada: portadaOpt
            });
          }
          setLecturasPersonales(clon);
          setLibroPersonal('');
          setPaginaPersonalInput('');

          enviarAccion('actualizar_libro_personal', { 
            email: sesion.email, 
            nombre: nombreUsuarioPersonalizado || sesion.nombre, 
            libro: tituloLibro, 
            pagina: pag,
            estado: estadoOpt,
            autora: autoraOpt,
            portada: portadaOpt
          });
          mostrarToast(`Guardado en mi habitación: ${tituloLibro}`);
        };

        const agregarAWantToReadDirecto = (titulo, autora = '', portada = '') => {
          guardarLibroPersonal(titulo, 0, 'want_to_read', autora, portada);
        };

        const cambiarEstadoLibro = (libro, nuevoEstado) => {
          const item = lecturasPersonales.find(l => (l.email || '').toLowerCase() === sesion.email.toLowerCase() && (l.libro || '').toLowerCase() === libro.libro.toLowerCase());
          guardarLibroPersonal(libro.libro, item ? (item.pagina || item.paginas || 0) : 0, nuevoEstado, libro.autora || '', libro.portada || '');
        };

        const enviarRespuesta = (idPadre, capTitulo) => {
          const txt = respuestaComentario[idPadre];
          if(!txt || !txt.trim()) return;
          const nuevo = { id: Date.now().toString(), parent_id: idPadre, capitulo: capTitulo, autora: nombreUsuarioPersonalizado || sesion.nombre, texto: txt, fecha: 'Ahora' };
          setComentarios([nuevo, ...comentarios]);
          setRespuestaComentario({...respuestaComentario, [idPadre]: ''});
          enviarAccion('comentario', nuevo);
          mostrarToast('Respuesta publicada.');
        };

        const reaccionar = (idComentario, emoji) => {
          const clon = [...comentarios];
          const com = clon.find(c => c.id === idComentario);
          if(com) {
            com.reacciones = (com.reacciones || "") + emoji;
            setComentarios(clon);
            enviarAccion('reaccionar', { id: idComentario, reacciones: com.reacciones });
          }
        };

        const enviarChat = (e) => {
          e.preventDefault();
          const textoMsg = nuevoChat.trim();
          if (!textoMsg) return;
          const nombreActual = nombreUsuarioPersonalizado || sesion.nombre;
          setChatMsgs(prev => [...prev, { usuario: nombreActual, mensaje: textoMsg, fecha: 'Ahora' }]);
          enviarAccion('enviar_chat', { mensaje: textoMsg });
          setNuevoChat('');
          mostrarToast('Mensaje enviado.');
        };

        const toggleLecturaLamp = () => {
          const nuevo = !isReadingNow; 
          setIsReadingNow(nuevo);
          localStorage.setItem('gilda_is_reading', JSON.stringify(nuevo));
          enviarAccion('estado_lectura', { leyendo: nuevo });
        };

        const actualizarPagina = (nuevaPag) => {
          const pagValida = Math.max(0, nuevaPag); setMiPagina(pagValida);
          enviarAccion('actualizar_pagina', { pagina: pagValida });
          mostrarToast(`Progreso: pág. ${pagValida}`);
        };

        const libroActual = useMemo(() => lecturas[0] || { titulo: 'La campana de cristal', autora: 'Sylvia Plath', paginas_totales: 280, portada: '' }, [lecturas]);
        const porcentajeLibro = useMemo(() => Math.min(Math.round((miPagina / Number(libroActual.paginas_totales || 280)) * 100), 100), [miPagina, libroActual]);
        
        const usuariasConectadas = useMemo(() => {
          const ah = new Date().getTime();
          return usuariasClub.filter(u => {
            if ((u.email || '').toLowerCase() === (sesion?.email || '').toLowerCase()) return true;
            if (!u.ultima_actividad) return false;
            const t = new Date(u.ultima_actividad).getTime();
            return (ah - (isNaN(t) ? 0 : t)) < 15 * 60 * 1000;
          });
        }, [usuariasClub, sesion]);

        const misLibrosFiltrados = useMemo(() => {
          if (!sesion) return [];
          return lecturasPersonales.filter(l => 
            (l.email || '').toLowerCase() === sesion.email.toLowerCase() && 
            (l.estado || 'leyendo') === tabEstanteria
          );
        }, [lecturasPersonales, sesion, tabEstanteria]);

        const miembrosEdificio = useMemo(() => {
          const ah = new Date().getTime();
          return usuariasClub.map(u => {
            const emailU = (u.email || '').toLowerCase().trim();
            const esYo = emailU === (sesion?.email || '').toLowerCase().trim();
            const misPersonales = lecturasPersonales.filter(l => 
              (l.email || '').toLowerCase().trim() === emailU && 
              (l.estado || 'leyendo') === 'leyendo'
            );
            
            let tieneNovedad = false;
            if (u.ultima_actividad) {
              const t = new Date(u.ultima_actividad).getTime();
              if (!isNaN(t) && (ah - t) < 24 * 60 * 60 * 1000) {
                tieneNovedad = true;
              }
            }

            return {
              ...u,
              nombre: esYo ? (nombreUsuarioPersonalizado || u.nombre) : (u.nombre || 'Socia'),
              foto_perfil: esYo ? (fotoPerfilPersonalizada || u.foto_perfil) : u.foto_perfil,
              pagina: esYo ? miPagina : Number(u.pagina || 0),
              estaLeyendo: esYo ? isReadingNow : (Number(u.pagina || 0) > 0 || misPersonales.length > 0),
              misLecturasPersonales: misPersonales,
              tieneNovedad: tieneNovedad
            };
          });
        }, [usuariasClub, sesion, nombreUsuarioPersonalizado, fotoPerfilPersonalizada, miPagina, isReadingNow, lecturasPersonales]);

        if (!sesion) {
          return (
            <div className="min-h-screen flex items-center justify-center px-4 w-full py-8">
              <div className="editorial-card max-w-sm w-full p-8 space-y-6 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-24 h-24 bg-[#adae1d] rounded-bl-full opacity-10"></div>
                
                <div className="space-y-1 relative z-10 text-center">
                  <h1 className="font-modern-title text-4xl text-[#1a1a1a]">gilda</h1>
                </div>

                <div className="bg-white border border-[#e2e2da] p-3 rounded-lg text-center text-xs text-gray-600">
                  <span className="text-[#1a1a1a] font-bold">{usuariasClub.length}</span> lectoras
                </div>

                {!modoRegistro ? (
                  <form onSubmit={iniciarSesion} className="space-y-4 relative z-10">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Correo electrónico</label>
                      <input type="email" placeholder="tu@correo.com" value={inputEmail} onChange={(e) => setInputEmail(e.target.value)} required className="w-full editorial-input px-3.5 py-2.5 text-sm mt-1" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Contraseña</label>
                      <input type="password" placeholder="••••••••" value={inputPassword} onChange={(e) => setInputPassword(e.target.value)} required className="w-full editorial-input px-3.5 py-2.5 text-sm mt-1" />
                    </div>
                    {errorLogin && <p className="text-[11px] text-red-600 font-medium text-center">{errorLogin}</p>}
                    <button type="submit" className="w-full editorial-btn py-3 text-sm font-medium tracking-wide">
                      Iniciar sesión
                    </button>
                  </form>
                ) : (
                  <form onSubmit={registrarse} className="space-y-4 relative z-10 fade-in text-left">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Nombre de usuario (único)</label>
                      <input type="text" placeholder="tu nombre o apodo" value={regNombre} onChange={(e) => setRegNombre(e.target.value)} required className="w-full editorial-input px-3.5 py-2 text-xs mt-1" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Correo electrónico</label>
                      <input type="email" placeholder="tu@correo.com" value={regEmail} onChange={(e) => setRegEmail(e.target.value)} required className="w-full editorial-input px-3.5 py-2 text-xs mt-1" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Pueblo o Ciudad</label>
                        <input type="text" placeholder="ej. tolosa, alava..." value={regCiudad} onChange={(e) => setRegCiudad(e.target.value)} className="w-full editorial-input px-3 py-2 text-xs mt-1" />
                      </div>
                      <div>
                        <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Código Postal</label>
                        <input type="text" placeholder="ej. 20400" value={regCodigoPostal} onChange={(e) => setRegCodigoPostal(e.target.value)} className="w-full editorial-input px-3 py-2 text-xs mt-1" />
                      </div>
                    </div>

                    <div>
                      <label className="text-[10px] uppercase font-bold text-[#1a1a1a] block mb-1">modalidad de gilda</label>
                      <select 
                        value={regModalidad} 
                        onChange={(e) => setRegModalidad(e.target.value)}
                        className="w-full editorial-input p-2 text-xs bg-white font-medium text-[#1a1a1a]"
                      >
                        <optgroup label="asomarme un ratito">
                          <option value="cotilla">gilda cotilla (gratis)</option>
                        </optgroup>
                        <optgroup label="desde dentro">
                          <option value="satelite">gilda satélite (1 €/mes)</option>
                          <option value="cafe">gilda de café (5 €/mes)</option>
                          <option value="nube">gilda de nube (5 €/mes)</option>
                          <option value="virtual">gilda virtual (8 €/mes)</option>
                          <option value="papel">gilda de papel (10 €/mes)</option>
                          <option value="absoluta">gilda absoluta (12 €/mes)</option>
                        </optgroup>
                      </select>
                    </div>

                    <p className="text-[10px] text-gray-500 italic bg-white p-2.5 rounded-lg border border-[#e2e2da] leading-normal text-left">
                      puedes cancelar tu suscripción cuando quieras, o incluso pausarla durante algún mes si no vas a poder hacer uso de gilda por cualquier cosa que te surja.
                    </p>

                    {errorLogin && <p className="text-[11px] text-red-600 font-medium text-center">{errorLogin}</p>}

                    <button type="submit" className="w-full editorial-btn py-3 text-sm font-medium tracking-wide">
                      {regModalidad === 'cotilla' ? 'Crear cuenta gratuita' : 'Ir al pago en Stripe'}
                    </button>
                  </form>
                )}

                <div className="pt-4 border-t border-[#e2e2da] text-center space-y-2">
                  <p className="text-[11px] text-gray-500 leading-relaxed px-1">
                    {modoRegistro ? '¿Ya tienes una cuenta registrada?' : 'por si no lo sabes, hay distintas modalidades de gilda, así que seguro que encuentras la tuya en el siguiente botón:'}
                  </p>
                  <button 
                    type="button"
                    onClick={() => { setModoRegistro(!modoRegistro); setErrorLogin(''); }} 
                    className="inline-block text-[11px] text-[#adae1d] font-bold hover:underline bg-transparent border-0 cursor-pointer"
                  >
                    {modoRegistro ? 'iniciar sesión con mi correo' : 'quiero registrarme :)'}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col items-center pt-6 pb-28 px-4 sm:px-6 max-w-md w-full mx-auto relative">
            
            {toastMsg && (
              <div className="fixed top-6 z-50 bg-[#1a1a1a] text-[#ffffee] text-xs px-4 py-2.5 rounded-full shadow-lg fade-in flex items-center gap-2 border border-white/20">
                <span className="w-2 h-2 rounded-full bg-[#adae1d]"></span><span>{toastMsg}</span>
              </div>
            )}

            <header className="w-full mb-5 flex justify-between items-center bg-[#ffffee] text-[#1a1a1a] p-3.5 rounded-xl border border-[#e2e2da] shadow-xs">
              <div className="flex items-center gap-3 overflow-hidden">
                <AvatarUsuaria foto={fotoPerfilPersonalizada} nombre={nombreUsuarioPersonalizado || sesion.nombre} sizeClass="w-9 h-9" textClass="text-lg" />
                <div className="overflow-hidden">
                  <div className="flex items-center gap-2">
                    <h2 className="font-semibold text-sm leading-none truncate">{nombreUsuarioPersonalizado || sesion.nombre}</h2>
                    <button onClick={() => { setInputNuevoNombre(nombreUsuarioPersonalizado || sesion.nombre); setInputNuevaFoto(fotoPerfilPersonalizada); setEditandoPerfil(true); }} className="text-gray-400 hover:text-black text-[10px] shrink-0" title="Editar perfil">
                      <i className="fa-solid fa-pen"></i>
                    </button>
                  </div>
                  <span className="text-[9px] text-gray-500 uppercase block mt-0.5 truncate">{sesion.modalidad}</span>
                </div>
              </div>
              <button onClick={cerrarSesion} className="text-gray-400 hover:text-black shrink-0"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
            </header>

            {editandoPerfil && (
              <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="editorial-card max-w-sm w-full p-5 space-y-4 fade-in bg-[#ffffee]">
                  <div className="flex justify-between items-center border-b border-[#e2e2da] pb-2">
                    <h3 className="font-editorial-title text-base font-bold">Editar mi perfil</h3>
                    <button onClick={() => setEditandoPerfil(false)} className="text-xs text-gray-500">✕</button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 block mb-1">Nombre de usuario (único)</label>
                      <input type="text" value={inputNuevoNombre} onChange={e => setInputNuevoNombre(e.target.value)} className="w-full editorial-input p-2 text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-semibold text-gray-500 block mb-1">Subir foto de perfil (desde dispositivo)</label>
                      <div className="flex items-center gap-3 bg-white p-2 rounded-xl border border-[#e2e2da]">
                        <AvatarUsuaria foto={inputNuevaFoto || fotoPerfilPersonalizada} nombre={inputNuevoNombre || nombreUsuarioPersonalizado} sizeClass="w-10 h-10" textClass="text-sm" />
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={manejarCambioArchivoFoto} 
                          className="w-full text-[11px] file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#1a1a1a] file:text-[#ffffee] hover:file:bg-[#adae1d] hover:file:text-black cursor-pointer" 
                        />
                      </div>
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setEditandoPerfil(false)} className="w-1/2 bg-white border border-[#e2e2da] text-gray-600 py-2 rounded-xl text-xs font-medium">Cancelar</button>
                    <button onClick={guardarPerfil} className="w-1/2 editorial-btn py-2 text-xs">Guardar cambios</button>
                  </div>
                </div>
              </div>
            )}

            <main className="w-full flex-grow space-y-4 fade-in">
              {cargandoDatos ? (
                <div className="text-center py-20 text-xs text-white animate-pulse">Cargando volúmenes...</div>
              ) : (
                <>
                  {seccionApp === 'inicio' && (
                    <div className="space-y-4 fade-in">
                      <div className="editorial-card p-5 space-y-4">
                        <div className="flex gap-4 items-center">
                          <PortadaLibro titulo={libroActual.titulo} autora={libroActual.autora} portada={libroActual.portada} size="large" />
                          <div className="space-y-2 w-full">
                            <span className="text-[9px] uppercase tracking-wider text-[#adae1d] font-bold">Lectura del Club</span>
                            <h2 className="font-editorial-title text-base font-medium leading-snug">{libroActual.titulo}</h2>
                            <p className="text-xs text-gray-500 italic">{libroActual.autora}</p>
                            <div className="mt-2">
                              <div className="flex justify-between text-[10px] text-gray-500 mb-1">
                                <span>progreso general</span><span>{porcentajeLibro}%</span>
                              </div>
                              <div className="w-full bg-white rounded-full h-1 border border-[#e2e2da]"><div className="bg-[#adae1d] h-full rounded-full transition-all" style={{width: `${porcentajeLibro}%`}}></div></div>
                            </div>
                          </div>
                        </div>

                        <div className="pt-3 border-t border-[#e2e2da] flex items-center justify-between gap-2">
                          <span className="text-xs text-gray-500">página por la que vas:</span>
                          <div className="flex items-center gap-1">
                            <button onClick={() => actualizarPagina(miPagina - 5)} className="bg-white border border-[#e2e2da] px-2 py-1 rounded text-xs">-5</button>
                            <input type="number" value={miPagina} onChange={(e) => setMiPagina(Number(e.target.value))} className="editorial-input w-12 text-center py-1 text-xs" />
                            <button onClick={() => actualizarPagina(miPagina + 5)} className="bg-white border border-[#e2e2da] px-2 py-1 rounded text-xs">+5</button>

                                    item.votantes = arr.join(',');
                                    setPropuestas(clon);
                                    enviarAccion('votar', { tipo: 'propuesta', id: p.titulo, email: sesion.email });
                                    mostrarToast('Voto actualizado.');
                                  }} className={`self-start mt-2 px-3 py-1 text-[10px] rounded-full font-bold transition-all ${votado ? 'bg-[#adae1d] text-black' : 'bg-[#ffffee] text-[#1a1a1a] border border-[#e2e2da]'}`}>
                                    {votado ? `Votado (${p.votos||0})` : `Votar (${p.votos||0})`}
                                  </button>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'buzon' && (
                    <div className="editorial-card p-5 space-y-3 fade-in">
                      <h2 className="font-editorial-title text-base">Buzón privado</h2>
                      <p className="text-xs text-gray-500">Sugerencias y comunicación directa con la administración.</p>
                      <textarea placeholder="Escribe tu mensaje..." value={mensajeFundadora} onChange={e=>setMensajeFundadora(e.target.value)} className="w-full editorial-input p-3 text-xs h-24 resize-none"></textarea>
                      <button onClick={()=>{ enviarAccion('buzon',{mensaje:mensajeFundadora}); setMensajeFundadora(''); mostrarToast('Mensaje enviado.');}} className="w-full editorial-btn py-2 text-xs">Enviar mensaje</button>
                    </div>
                  )}
                </>
              )}
            </main>

            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-2.5 px-2 flex justify-around items-center max-w-md mx-auto z-40 rounded-t-xl">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'inicio' },
                { id: 'edificio', icon: 'fa-building', label: 'casa' },
                { id: 'habitacion', icon: 'fa-bookmark', label: 'mi habitación' },
                { id: 'capitulos', icon: 'fa-book-open', label: 'capítulos' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' },
                { id: 'archivo', icon: 'fa-box-archive', label: 'archivo' },
                { id: 'buzon', icon: 'fa-envelope', label: 'buzón' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setSeccionApp(tab.id)} className={`flex flex-col items-center gap-1 transition-all p-1 ${seccionApp === tab.id ? 'text-[#1a1a1a] font-bold bg-[#ffffee] px-2 py-1 rounded shadow-xs' : 'text-white/60 hover:text-white'}`}>
                  <i className={`fa-solid ${tab.icon} text-sm`}></i>
                  <span className="text-[7.5px] font-medium uppercase">{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const containerRoot = ReactDOM.createRoot(document.getElementById('root'));
      containerRoot.render(<App />);
    </script>
  </body>
</html>
