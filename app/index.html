      function ComponenteMapa({ usuarias }) {
        const mapRef = useRef(null);
        const markersGroupRef = useRef(null);
        const extraCoordsRef = useRef({});

        const limpiarTexto = (str) => {
          if (!str) return '';
          return str
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
        };

        useEffect(() => {
          if (!mapRef.current) {
            const map = L.map('mapa-gilda', { zoomControl: false }).setView([20, 0], 2);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors',
              maxZoom: 18,
            }).addTo(map);

            const markersGroup = L.layerGroup().addTo(map);
            markersGroupRef.current = markersGroup;
            mapRef.current = map;
          }
        }, []);

        useEffect(() => {
          if (!markersGroupRef.current) return;

          const cargarMarcadores = async () => {
            markersGroupRef.current.clearLayers();

            for (const u of usuarias) {
              const ciudadRaw = u.ciudad || u.Ciudad || u.ubicacion || u.Ubicación || '';
              const ciudadClean = limpiarTexto(ciudadRaw);
              if (!ciudadClean) continue;

              let coords = COORDENADAS_CIUDADES[ciudadClean] || extraCoordsRef.current[ciudadClean];

              if (!coords) {
                try {
                  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ciudadRaw)}&limit=1`);
                  const data = await res.json();
                  if (data && data.length > 0) {
                    coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    extraCoordsRef.current[ciudadClean] = coords;
                  }
                } catch (err) {
                  console.error("Error geocodificando ciudad:", ciudadRaw);
                }
              }

              if (coords && markersGroupRef.current) {
                const marker = L.circleMarker(coords, {
                  radius: 6,
                  fillColor: '#adae1d',
                  color: '#ffffff',
                  weight: 1.5,
                  opacity: 1,
                  fillOpacity: 0.9,
                });
                marker.bindPopup(
                  `<div style="font-family:'Inter',sans-serif; background:#ffffff; color:#262624; padding:8px; border-radius:6px; font-size:11px;"><b>${
                    u.nombre || 'Socia'
                  }</b><br><span style="color:#666;">${
                    u.ciudad || u.Ciudad || u.ubicacion || u.Ubicación
                  }</span></div>`
                );
                markersGroupRef.current.addLayer(marker);
              }
            }
          };

          cargarMarcadores();
        }, [usuarias]);

        return <div id="mapa-gilda"></div>;
      }

                (u) =>
                  (u.email || '').trim().toLowerCase() ===
                  sesion.email.toLowerCase()
              );
              if (sociaActual) {
                if (sociaActual.pagina || sociaActual.pagina_actual)
                  setMiPagina(
                    Number(sociaActual.pagina || sociaActual.pagina_actual)
                  );
                
                const ciudadLocal = localStorage.getItem('gilda_mi_ciudad');
                if (ciudadLocal) {
                  setMiCiudad(ciudadLocal);
                } else if (sociaActual.ciudad || sociaActual.ubicacion) {
                  const c = sociaActual.ciudad || sociaActual.ubicacion;
                  setMiCiudad(c);
                  localStorage.setItem('gilda_mi_ciudad', c);
                }

                if (!nombreUsuarioPersonalizado) {
                  const nombreDef =
                    sociaActual.nombre || sesion.email.split('@')[0];
                  setNombreUsuarioPersonalizado(nombreDef);
                  localStorage.setItem('gilda_nombre_usuario', nombreDef);
                }
              }
            }
          });

          let completados = 0;
          const totalHojas = 5;
          const checkCargando = () => {
            completados++;
            if (completados >= totalHojas) setCargando(false);
          };

          parsearHoja(URL_CSV_CAPITULOS, (data) => {
            setCapitulos(data);
            checkCargando();
          });
          parsearHoja(URL_CSV_COMENTARIOS, (data) => {
            setComentarios(data.reverse());
            checkCargando();
          });
          parsearHoja(URL_CSV_CAFECITOS, (data) => {
            setCafecitos(data);
            checkCargando();
          });
          parsearHoja(URL_CSV_LECTURAS, (data) => {
            setLecturas(data);
            checkCargando();
          });
          parsearHoja(URL_CSV_CHAT, (data) => {
            setChatMsgs(data);
            checkCargando();
          });

          parsearHoja(URL_CSV_PROPUESTAS, (data) => {
            if (data && data.length > 0) {
              try {
                const locales = JSON.parse(localStorage.getItem('gilda_propuestas') || '[]');
                const titulosCsv = new Set(data.map(p => (p.titulo || '').trim().toLowerCase()));
                const extraLocales = locales.filter(p => !titulosCsv.has((p.titulo || '').trim().toLowerCase()));
                const finalPropuestas = [...data, ...extraLocales];
                setPropuestas(finalPropuestas);
                localStorage.setItem('gilda_propuestas', JSON.stringify(finalPropuestas));
              } catch {
                setPropuestas(data);
              }
            }
          });

          parsearHoja(URL_CSV_VOTACION_CAFE, (data) => {
            setOpcionesVotacionCafe(data);
          });
          parsearHoja(URL_CSV_FRASES, (data) => {
            setFrasesClub(data);
          });
        }, []);

        const iniciarSesion = (e) => {
          e.preventDefault();
          setErrorLogin('');
          const emailBuscado = inputEmail.trim().toLowerCase();
          if (!emailBuscado) return;

          const sociaEncontrada = usuariasClub.find(
            (u) => (u.email || '').trim().toLowerCase() === emailBuscado
          );

          if (!sociaEncontrada) {
            setErrorLogin(
              'Este correo no está registrado como socia de gilda.'
            );
            return;
          }

          const estadoSocia = (sociaEncontrada.estado || '').trim().toLowerCase();
          if (estadoSocia === 'pendiente') {
            setErrorLogin(
              'Tu cuenta está pendiente de aprobación por la administración.'
            );
            return;
          }

          const nombreDef =
            sociaEncontrada.nombre || emailBuscado.split('@')[0];
          setNombreUsuarioPersonalizado(nombreDef);
          localStorage.setItem('gilda_nombre_usuario', nombreDef);

          const datosSesion = {
            nombre: nombreDef,
            email: emailBuscado,
            modalidad: (sociaEncontrada.modalidad || 'gilda absoluta')
              .trim()
              .toLowerCase(),
          };

          localStorage.setItem('gilda_sesion', JSON.stringify(datosSesion));
          setSesion(datosSesion);
        };

        const cerrarSesion = () => {
          localStorage.removeItem('gilda_sesion');
          localStorage.removeItem('gilda_nombre_usuario');
          localStorage.removeItem('gilda_is_reading');
          localStorage.removeItem('gilda_mi_libro');
          setSesion(null);
          setInputEmail('');
          setErrorLogin('');
        };

        const guardarNombrePersonalizado = () => {
          const limpio = nombreUsuarioPersonalizado.trim();
          if (!limpio) return;
          localStorage.setItem('gilda_nombre_usuario', limpio);

          setSesion((prev) => ({ ...prev, nombre: limpio }));

          setUsuariasClub((prev) =>
            prev.map((u) =>
              u.email.toLowerCase() === sesion.email.toLowerCase()
                ? { ...u, nombre: limpio }
                : u
            )
          );

          enviarAccion('actualizar_nombre', { nuevoNombre: limpio });

          setEditandoNombre(false);
          mostrarToast('Nombre actualizado.');
        };

        const guardarMiLibroPersonal = () => {
          const limpio = miLibroActual.trim();
          localStorage.setItem('gilda_mi_libro', limpio);
          setEditandoMiLibro(false);
          enviarAccion('actualizar_libro', { libro: limpio });
          mostrarToast('Lectura actual actualizada.');
        };

        const toggleLecturaLamp = () => {
          const nuevoEstado = !isReadingNow;
          setIsReadingNow(nuevoEstado);
          localStorage.setItem('gilda_is_reading', JSON.stringify(nuevoEstado));
          enviarAccion('estado_lectura', { leyendo: nuevoEstado });
          mostrarToast(nuevoEstado ? 'Luz encendida en tu ventana (ON).' : 'Luz apagada (OFF).');
        };

        const actualizarPagina = (nuevaPag) => {
          const pagValida = Math.max(0, nuevaPag);
          setMiPagina(pagValida);

          if (sesion) {
            setUsuariasClub((prev) =>
              prev.map((u) =>
                u.email.toLowerCase() === sesion.email.toLowerCase()
                  ? { ...u, pagina: pagValida }
                  : u
              )
            );
          }

          enviarAccion('actualizar_pagina', { pagina: pagValida });
          mostrarToast(`Progreso guardado: pág. ${pagValida}`);
        };

        const guardarMiCiudad = () => {
          const ciudadLimpia = miCiudad.trim();
          if (!ciudadLimpia) return;
          setGuardandoCiudad(true);

          localStorage.setItem('gilda_mi_ciudad', ciudadLimpia);

          if (sesion) {
            setUsuariasClub((prev) =>
              prev.map((u) =>
                u.email.toLowerCase() === sesion.email.toLowerCase()
                  ? { ...u, ciudad: ciudadLimpia }
                  : u
              )
            );
          }

          enviarAccion('actualizar_ubicacion', { ciudad: ciudadLimpia });
          setTimeout(() => {
            setGuardandoCiudad(false);
            mostrarToast('Ubicación guardada.');
          }, 500);
        };

        const guardarFraseBotella = () => {
          const textoFrase = nuevaFraseBotella.trim();
          if (!textoFrase) return;

          const nuevaListaCitas = [textoFrase, ...misCitas];
          setMisCitas(nuevaListaCitas);
          localStorage.setItem(
            'gilda_mis_citas',
            JSON.stringify(nuevaListaCitas)
          );

          enviarAccion('mensaje_botella', { frase: textoFrase });
          setNuevaFraseBotella('');
          mostrarToast('Frase guardada en tus tesoros.');
        };

        const enviarValoracionLibro = () => {
          const textoResena = resenaLibro.trim();
          if (!textoResena) return;

          const nombreActual =
            localStorage.getItem('gilda_nombre_usuario') || sesion.nombre;
          const nuevaValoracion = {
            libro: libroActual.titulo,
            estrellas: estrellasLibro,
            resena: textoResena,
            autora: nombreActual,
            fecha: new Date().toLocaleDateString('es-ES'),
          };

          const nuevaListaResenas = [nuevaValoracion, ...resenasGuardadas];
          setResenasGuardadas(nuevaListaResenas);
          localStorage.setItem(
            'gilda_resenas',
            JSON.stringify(nuevaListaResenas)
          );

          enviarAccion('valoracion_libro', {
            libro: libroActual.titulo,
            estrellas: estrellasLibro,
            resena: textoResena,
          });

          setResenaLibro('');
          mostrarToast('Valoración enviada.');
        };

        const enviarChat = (e) => {
          e.preventDefault();
          const textoMsg = nuevoChat.trim();
          if (!textoMsg) return;

          const nombreActual =
            localStorage.getItem('gilda_nombre_usuario') || sesion.nombre;
          const mensajeObj = {
            usuario: nombreActual,
            mensaje: textoMsg,
            fecha: 'Ahora',
          };
          setChatMsgs((prev) => [...prev, mensajeObj]);

          enviarAccion('enviar_chat', { mensaje: textoMsg });
          setNuevoChat('');
        };

        const descargarStoryInstagram = async () => {
          if (!storyCardRef.current) return;
          mostrarToast('Generando story...');
          try {
            const canvas = await html2canvas(storyCardRef.current, {
              scale: 2,
              useCORS: true,
              backgroundColor: '#09090b'
            });
            const image = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = image;
            link.download = 'gilda-story-lofi.png';
            link.click();
            mostrarToast('Story descargada con éxito.');
          } catch (err) {
            console.error('Error generando story:', err);
            mostrarToast('No se pudo generar la imagen.');
          }
        };

        const frasesBotellaTotales = useMemo(() => {
          const frasesDeHoja = frasesClub
            .map((f) => f.frase || f.texto || Object.values(f)[0])
            .filter(Boolean);
          return [...misCitas, ...frasesDeHoja, ...FRASES_INICIALES_BOTELLA];
        }, [misCitas, frasesClub]);

        const enviarAccion = async (action, payload) => {
          setEnviandoForm(true);
          try {
            const nombreActual =
              localStorage.getItem('gilda_nombre_usuario') ||
              sesion?.nombre ||
              'Socia';
            const datosCompletos = {
              action,
              usuaria: nombreActual,
              email: sesion?.email || '',
              ...payload,
              fecha: new Date().toLocaleDateString('es-ES'),
            };

            await fetch(GOOGLE_API_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(datosCompletos),
            });
          } catch (err) {
            console.error('Error al enviar acción:', err);
          } finally {
            setTimeout(() => setEnviandoForm(false), 500);
          }
        };

        const modalidadUser = (sesion?.modalidad || '').toLowerCase();
        const esAbsoluta = modalidadUser.includes('absoluta');
        const esCotilla = modalidadUser.includes('cotilla');
        const esVirtual = modalidadUser.includes('virtual');
        const esCafe =
          modalidadUser.includes('café') || modalidadUser.includes('cafe');

        const tieneAccesoChat = esAbsoluta || esVirtual || esCafe;
        const tieneAccesoCafe = esAbsoluta || esVirtual || esCafe;
        const puedeComentarCapitulos = !esCotilla;
        const puedeProponerLibros = !esCotilla;

        const libroActual = useMemo(() => {
          return (
            lecturas[0] || {
              titulo: 'La campana de cristal',
              autora: 'Sylvia Plath',
              descripcion: 'Lectura actual del club.',
              portada: '',
              paginas_totales: 280,
            }
          );
        }, [lecturas]);

        const totalGildas = usuariasClub.length || 1;
        const nombresEnLinea = useMemo(() => {
          const activas = usuariasClub.filter(
            (u) => Number(u.pagina || u.pagina_actual || 0) > 0
          );
          const lista = activas.map((u) => u.nombre || 'Socia');
          if (lista.length === 0) {
            const nombreActual = localStorage.getItem('gilda_nombre_usuario') || sesion?.nombre;
            return nombreActual ? [nombreActual] : ['Socia'];
          }
          return lista;
        }, [usuariasClub, sesion]);

        const miembrosEdificio = useMemo(() => {
          const lista = [...usuariasClub];
          const emailActual = sesion?.email?.toLowerCase();
          const nombreActual = nombreUsuarioPersonalizado || sesion?.nombre;
          const libroActualUser = miLibroActual || libroActual.titulo;

          const existeActual = lista.find(u => (u.email || '').toLowerCase() === emailActual);
          if (!existeActual && sesion) {
            lista.unshift({
              nombre: nombreActual,
              email: sesion.email,
              pagina: isReadingNow ? 1 : 0,
              libro: libroActualUser,
              esYo: true
            });
          }

          return lista.map(u => {
            const esMio = (u.email || '').toLowerCase() === emailActual;
            return {
              ...u,
              nombre: esMio ? (nombreUsuarioPersonalizado || sesion.nombre) : (u.nombre || 'Socia'),
              estaLeyendo: esMio ? isReadingNow : (Number(u.pagina || u.pagina_actual || 0) > 0),
              libroReal: esMio ? (miLibroActual || libroActual.titulo) : (u.libro || u.libro_actual || libroActual.titulo || 'Lectura del club'),
              esYo: esMio
            };
          });
        }, [usuariasClub, sesion, nombreUsuarioPersonalizado, miLibroActual, isReadingNow, libroActual]);

        const porcentajeLibro = useMemo(() => {
          const pagTotales = Number(libroActual.paginas_totales || 280);
          return Math.min(Math.round((miPagina / pagTotales) * 100), 100);
        }, [miPagina, libroActual]);

        const paginaFinalLibro = useMemo(() => {
          if (capitulos.length === 0)
            return Number(libroActual.paginas_totales || 280);
          const ultimoCap = capitulos[capitulos.length - 1];
          const valFin =
            ultimoCap.pagina_fin ||
            ultimoCap.fin ||
            Object.values(ultimoCap)[3] ||
            Object.values(ultimoCap)[2];
          const numFin = parseFloat(
            String(valFin || '').replace(/[^0-9.]/g, '')
          );
          return !isNaN(numFin)
            ? numFin
            : Number(libroActual.paginas_totales || 280);
        }, [capitulos, libroActual]);

        const estaDesbloqueadaValoracion = miPagina >= paginaFinalLibro;

        if (!sesion) {
          return (
            <div className="min-h-screen flex items-center justify-center px-4 bg-[#f7f5ef]">
              <div className="editorial-card max-w-sm w-full p-8 space-y-6 fade-in">
                <div className="space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-[#adae1d]"></span>
                    <h1 className="text-lg font-medium tracking-tight text-[#262624]">
                      gilda
                    </h1>
                  </div>
                  <p className="text-xs text-[#73736e]">club de lectura</p>
                </div>
                <div className="bg-[#faf9f5] border border-[#dfded5] p-3 rounded-lg flex items-center justify-between text-xs text-[#73736e]">
                  <span>lectoras registradas</span>
                  <span className="text-[#262624] font-medium">
                    {totalGildas}
                  </span>
                </div>

                <form onSubmit={iniciarSesion} className="space-y-3.5">
                  <input
                    type="email"
                    placeholder="nombre@correo.com"
                    value={inputEmail}
                    onChange={(e) => setInputEmail(e.target.value)}
                    required
                    className="w-full editorial-input px-3.5 py-2 text-xs outline-none"
                  />
                  {errorLogin && (
                    <p className="text-[11px] text-red-600 font-medium">
                      {errorLogin}
                    </p>
                  )}
                  <button
                    type="submit"
                    className="w-full editorial-btn py-2 text-xs font-medium tracking-wide"
                  >
                    entrar al club
                  </button>
                </form>

                <div className="pt-2 border-t border-[#dfded5] text-center">
                  <a
                    href="https://gildaclub.netlify.app"
                    target="_blank"
                    rel="noreferrer"
                    className="text-xs text-[#adae1d] font-medium hover:underline"
                  >
                    solicitar registro
                  </a>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col items-center pt-6 pb-32 px-4 sm:px-6 max-w-md mx-auto relative bg-[#f7f5ef]">
            {toastMsg && (
              <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#262624] text-white text-xs px-4 py-2 rounded shadow-lg fade-in flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-[#adae1d]"></span>
                <span>{toastMsg}</span>
              </div>
            )}

            {modalStoryAbierto && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                <div className="editorial-card bg-white max-w-xs w-full p-4 space-y-4 relative shadow-2xl flex flex-col items-center">
                  <button
                    onClick={() => setModalStoryAbierto(false)}
                    className="absolute top-3 right-3 text-xs text-[#73736e] hover:text-[#262624] bg-[#faf9f5] px-2 py-1 rounded border border-[#dfded5]"
                  >
                    cerrar
                  </button>
                  <span className="text-xs font-medium uppercase tracking-wider text-[#adae1d] pt-1">
                    Vista previa Story (9:16)
                  </span>

                  {/* TARJETA STORY LOFI */}
                  <div
                    ref={storyCardRef}
                    className="w-[280px] h-[498px] rounded-3xl p-5 flex flex-col justify-between shadow-2xl relative overflow-hidden text-left"
                    style={{ background: 'linear-gradient(to bottom, #09090b, #111119, #1e1b4b)', color: '#ffffff' }}
                  >
                    <div className="absolute inset-0 pointer-events-none opacity-80">
                      <div className="absolute top-6 right-8 w-10 h-10 rounded-full bg-transparent shadow-[3px_-3px_0_0_#fef08a]"></div>
                      <div className="absolute top-12 left-1/4 w-1 h-1 bg-white rounded-full animate-pulse"></div>
                      <div className="absolute top-8 left-2/3 w-1 h-1 bg-amber-200 rounded-full"></div>
                    </div>

                    <div className="space-y-1 pt-1 z-10">
                      <div className="flex justify-between items-center">
                        <span className="text-[9px] font-mono-code uppercase tracking-widest text-[#e0e7ff] bg-[#1c2541]/90 px-2 py-0.5 rounded-full font-bold border border-[#3a506b]">
                          ✦ club de lectura
                        </span>
                        <span className="text-[9px] font-mono-code text-[#94a3b8]">@gilda.mailclub</span>
                      </div>
                      <h3 className="font-serif-title text-lg font-bold text-white leading-tight">
                        La Calle de las Gildas
                      </h3>
                      <p className="text-[10px] text-[#cbd5e1] italic truncate font-serif">
                        Leyendo: {libroActual.titulo}
                      </p>
                    </div>

                    <div className="my-auto py-2 px-3 bg-zinc-900/90 rounded-2xl border border-zinc-700 z-10 space-y-2">
                      <div className="flex justify-between items-center text-[9px] font-mono-code text-[#94a3b8] px-1">
                        <span>VENTANAS ACTIVAS</span>
                        <span className="text-[#fbbf24] font-bold">{miembrosEdificio.filter(m => m.estaLeyendo).length} ON</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        {miembrosEdificio.slice(0, 6).map((m, i) => (
                          <div
                            key={i}
                            className={`p-2 rounded-xl text-[9px] border flex flex-col justify-between ${
                              m.estaLeyendo ? 'window-card-active font-bold' : 'window-card-inactive'
                            }`}
                          >
                            <div className="flex justify-between font-mono-code text-[7px] opacity-80">
                              <span>{m.estaLeyendo ? 'ON' : 'OFF'}</span>
                              <span>0{i+1}</span>
                            </div>
                            <span className="font-semibold truncate pt-1">{m.nombre}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="pt-2 border-t border-zinc-700 flex flex-col gap-1 text-[9px] text-[#cbd5e1] z-10">
                      <div className="flex justify-between items-center font-medium">
                        <span className="bg-zinc-800 text-[#e0e7ff] px-2 py-0.5 rounded text-[8px] font-mono-code">
                          modo nocturno
                        </span>
                        <span className="font-bold text-[#fbbf24] tracking-wide">@nagoreads</span>
                      </div>
                      <div className="flex justify-between items-center text-[8px] text-[#94a3b8] font-mono-code">
                        <span>gildaclub.netlify.app</span>
                        <span>@gilda.mailclub</span>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={descargarStoryInstagram}
                    className="w-full editorial-btn py-2 text-xs"
                  >
                    Descargar imagen para Stories
                  </button>
                </div>
              </div>
            )}

            {libroSeleccionadoModal && (
              <div className="fixed inset-0 z-50 bg-black/30 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                <div className="editorial-card bg-white max-w-sm w-full p-6 space-y-4 relative shadow-xl">
                  <button
                    onClick={() => setLibroSeleccionadoModal(null)}
                    className="absolute top-4 right-4 text-xs text-[#73736e] hover:text-[#262624] bg-[#faf9f5] px-2 py-1 rounded border border-[#dfded5]"
                  >
                    cerrar
                  </button>
                  <div className="flex gap-4 items-start pt-2">
                    <PortadaLibro
                      titulo={libroSeleccionadoModal.titulo}
                      autora={libroSeleccionadoModal.autora || libroSeleccionadoModal.propuestoPor}
                      portada={libroSeleccionadoModal.portada}
                      size="large"
                    />
                    <div className="space-y-1 pt-1">
                      <span className="text-[11px] text-[#adae1d] font-medium block">
                        propuesto por {libroSeleccionadoModal.propuestoPor}
                      </span>
                      <h3 className="text-sm font-semibold text-[#262624] leading-tight">
                        {libroSeleccionadoModal.titulo}
                      </h3>
                      <p className="text-xs text-[#73736e]">
                        {libroSeleccionadoModal.autora || ''}
                      </p>
                      <span className="text-xs text-[#73736e] block pt-1">
                        votos: {libroSeleccionadoModal.votos || 1}
                      </span>
                    </div>
                  </div>
                  <div className="space-y-1 pt-2 border-t border-[#dfded5]">
                    <h4 className="text-[10px] uppercase tracking-wider text-[#73736e] font-semibold">
                      sinopsis
                    </h4>
                    <p className="text-xs text-[#444] leading-relaxed max-h-48 overflow-y-auto pr-1">
                      {libroSeleccionadoModal.sinopsis ||
                        'Sin sinopsis detallada disponible por el momento.'}
                    </p>
                  </div>
                </div>
              </div>
            )}

            <div className="w-full flex flex-col gap-2 mb-4 px-1 text-xs text-[#73736e]">
              <div className="flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#adae1d]"></span>
                  <span className="text-[#262624] font-medium">
                    {nombreUsuarioPersonalizado || sesion.nombre}
                  </span>
                  <span className="text-[10px] bg-[#dfded5] px-1.5 py-0.5 rounded text-[#444] uppercase tracking-wider">
                    {sesion.modalidad}
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setEditandoNombre(!editandoNombre)}
                    className="text-[#adae1d] hover:underline font-medium"
                  >
                    {editandoNombre ? 'cancelar' : 'editar nombre'}
                  </button>
                  <span>/</span>
                  <button

                                </div>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <div className="editorial-card p-6 text-center text-xs text-[#73736e]">
                            Acceso restringido según modalidad.
                          </div>
                        ))}

                      {subTabComunidad === 'gildas' && (
                        <div className="grid grid-cols-1 gap-2">
                          {usuariasClub.map((u, i) => (
                            <div
                              key={i}
                              className="editorial-card p-3.5 flex justify-between items-center text-xs"
                            >
                              <div>
                                <span className="font-medium text-[#262624] block">
                                  {u.nombre || 'Socia'}
                                </span>
                                <span className="text-[10px] text-[#73736e] uppercase">
                                  {u.modalidad}
                                </span>
                              </div>
                              <span className="text-[11px] text-[#444] bg-[#faf9f5] px-2 py-0.5 rounded border border-[#dfded5]">
                                pág. {u.pagina || '0'}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {seccionApp === 'biblioteca' && (
                    <div className="space-y-4 fade-in">
                      <div className="editorial-card p-5 space-y-1">
                        <span className="text-[10px] text-[#adae1d] uppercase tracking-wider font-semibold block">
                          archivo
                        </span>
                        <h2 className="text-sm font-semibold text-[#262624]">
                          historial y propuestas
                        </h2>
                        <p className="text-xs text-[#73736e]">
                          Obras leídas y votaciones para la próxima lectura.
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        {lecturas.map((lec, i) => (
                          <div
                            key={i}
                            className="editorial-card p-3 text-center space-y-2 flex flex-col items-center"
                          >
                            <PortadaLibro
                              titulo={lec.titulo}
                              autora={lec.autora}
                              portada={lec.portada}
                              size="grid"
                            />
                            <div className="w-full truncate">
                              <h3 className="text-xs font-medium text-[#262624] truncate">
                                {lec.titulo}
                              </h3>
                              <p className="text-[10px] text-[#73736e] truncate">
                                {lec.autora}
                              </p>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="editorial-card p-4 space-y-3">
                        <h3 className="text-[10px] uppercase tracking-wider text-[#73736e] font-semibold">
                          propuestas activas
                        </h3>

                        {puedeProponerLibros && (
                          <div className="space-y-2">
                            <input
                              type="text"
                              placeholder="Título - Autora"
                              value={nuevaPropuesta}
                              onChange={(e) =>
                                setNuevaPropuesta(e.target.value)
                              }
                              className="w-full editorial-input px-3 py-2 text-xs"
                            />
                            <p className="text-[10px] text-[#73736e] pl-0.5">
                              Formato requerido: Título - Autora
                            </p>
                            <button
                              onClick={async () => {
                                const textoInput = nuevaPropuesta.trim();
                                if (!textoInput) return;

                                if (!textoInput.includes('-')) {
                                  mostrarToast('Usa el formato: Título - Autora');
                                  return;
                                }

                                const partes = textoInput.split('-');
                                const tituloLibro = partes[0].trim();
                                const autoraLibro = partes.slice(1).join('-').trim();

                                mostrarToast('Buscando portada...');
                                let portadaUrl = '';

                                try {
                                  const res = await fetch(
                                    `https://openlibrary.org/search.json?q=${encodeURIComponent(
                                      tituloLibro + ' ' + autoraLibro
                                    )}&fields=title,cover_i&limit=1`
                                  );
                                  const data = await res.json();

                                  if (
                                    data.docs &&
                                    data.docs.length > 0 &&
                                    data.docs[0].cover_i
                                  ) {
                                    portadaUrl = `https://covers.openlibrary.org/b/id/${data.docs[0].cover_i}-M.jpg`;
                                  }
                                } catch (err) {
                                  console.error('Error buscando portada:', err);
                                }

                                const nombreActual =
                                  localStorage.getItem(
                                    'gilda_nombre_usuario'
                                  ) || sesion.nombre;
                                
                                const nuevaObra = {
                                  titulo: tituloLibro,
                                  autora: autoraLibro,
                                  propuestoPor: nombreActual,
                                  votos: 1,
                                  portada: portadaUrl,
                                  sinopsis:
                                    'Sinopsis pendiente de actualización.',
                                };

                                const listaActualizada = [nuevaObra, ...propuestas];
                                setPropuestas(listaActualizada);
                                localStorage.setItem('gilda_propuestas', JSON.stringify(listaActualizada));

                                enviarAccion('propuesta', {
                                  titulo: tituloLibro,
                                  autora: autoraLibro,
                                  portada: portadaUrl,
                                  propuestoPor: nombreActual,
                                });
                                setNuevaPropuesta('');
                                mostrarToast('Propuesta añadida con éxito.');
                              }}
                              disabled={enviandoForm}
                              className="w-full editorial-btn py-2 text-xs"
                            >
                              proponer obra
                            </button>
                          </div>
                        )}

                        <div className="space-y-2.5 pt-1">
                          {propuestas.map((prop, i) => (
                            <div
                              key={i}
                              className="bg-[#faf9f5] border border-[#dfded5] p-3 rounded-lg flex items-center justify-between gap-3 text-xs"
                            >
                              <div
                                onClick={() => setLibroSeleccionadoModal(prop)}
                                className="flex items-center gap-3 cursor-pointer flex-grow hover:opacity-80 transition-opacity"
                              >
                                <PortadaLibro
                                  titulo={prop.titulo}
                                  autora={prop.autora || prop.propuestoPor}
                                  portada={prop.portada}
                                  size="small"
                                />
                                <div>
                                  <span className="font-medium text-[#262624] block leading-tight">
                                    {prop.titulo}
                                  </span>
                                  <span className="text-[10px] text-[#73736e] block">
                                    {prop.autora || 'Autora desconocida'}
                                  </span>
                                  <span className="text-[10px] text-[#73736e]">
                                    por {prop.propuestoPor || 'Socia'} /{' '}
                                    <span className="text-[#adae1d] underline">
                                      sinopsis
                                    </span>
                                  </span>
                                </div>
                              </div>

                              <button
                                onClick={() => {
                                  const actualizadas = [...propuestas];
                                  const votosActuales =
                                    Number(actualizadas[i].votos || 0) + 1;
                                  actualizadas[i].votos = votosActuales;
                                  setPropuestas(actualizadas);
                                  localStorage.setItem('gilda_propuestas', JSON.stringify(actualizadas));

                                  enviarAccion('voto', {
                                    tituloPropuesta: prop.titulo,
                                    nuevosVotos: votosActuales,
                                  });
                                  mostrarToast('Voto registrado.');
                                }}
                                className="bg-white border border-[#dfded5] text-[#262624] hover:bg-[#f3f4f6] px-3 py-2 text-xs rounded shadow-xs shrink-0 transition-all font-medium"
                              >
                                votar ({prop.votos || 0})
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'buzon' && (
                    <div className="space-y-3 fade-in">
                      <div className="editorial-card p-5 space-y-3">
                        <h2 className="text-sm font-semibold text-[#262624]">
                          buzón privado
                        </h2>
                        <p className="text-xs text-[#73736e]">
                          Sugerencias y comunicación directa con la administración.
                        </p>
                        <textarea
                          placeholder="Escribe tu mensaje..."
                          value={mensajeFundadora}
                          onChange={(e) => setMensajeFundadora(e.target.value)}
                          rows="4"
                          className="w-full editorial-input p-3 text-xs resize-none"
                        />
                        <button
                          onClick={() => {
                            if (!mensajeFundadora.trim()) return;
                            enviarAccion('mensaje_fundadora', {
                              mensaje: mensajeFundadora,
                            });
                            setMensajeFundadora('');
                            mostrarToast('Mensaje enviado.');
                          }}
                          disabled={enviandoForm}
                          className="w-full editorial-btn py-2 text-xs"
                        >
                          enviar mensaje
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-2.5 px-3 flex justify-around items-center max-w-md mx-auto z-50">
              {[
                { key: 'inicio', label: 'inicio' },
                { key: 'edificio', label: 'habitacion' },
                { key: 'capitulos', label: 'capitulos' },
                { key: 'comunidad', label: 'comunidad' },
                { key: 'biblioteca', label: 'archivo' },
                { key: 'buzon', label: 'buzon' },
              ].map((tab) => (
                <button
                  key={tab.key}
                  onClick={() =>
                    seccionApp !== tab.key && setSeccionApp(tab.key)
                  }
                  className={`py-1.5 px-2 rounded transition-all text-xs tracking-tight ${
                    seccionApp === tab.key
                      ? 'text-[#262624] font-semibold bg-white shadow-xs'
                      : 'text-[#73736e] hover:text-[#262624]'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
