    --color-text-dark: #232321;
    --color-text-muted: #6B685E;
    --color-border: #E8E6DF;
    --color-accent-soft: #FAF6E8;
  }

  @font-face {
    font-family: 'BabyDoll';
    src: url('babydoll.ttf') format('truetype'),
         url('babydoll.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  /* MEJORA UI: Estilos para que en PC se vea como un móvil centrado y elegante */
  body {
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #EAE6DF; /* Fondo grisáceo para escritorio */
    color: var(--color-text-dark);
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    background-color: var(--color-bg-main);
    width: 100%;
    max-width: 450px; /* Ancho de móvil */
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Bordes redondeados en pantallas grandes */
  @media (min-width: 481px) {
    body { padding: 2rem 0; }
    #root {
      min-height: calc(100vh - 4rem);
      border-radius: 2rem;
      border: 8px solid white;
      overflow: hidden; /* Evita que el contenido se salga de los bordes redondeados */
    }
    /* Ajuste de la navegación para que se quede dentro del contenedor en PC */
    .editorial-nav {
      position: absolute !important;
      bottom: 0;
    }
  }

  .font-babydoll {
    font-family: 'BabyDoll', cursive, sans-serif;
    letter-spacing: 0.5px;
  }

  .editorial-card {
    background: var(--color-card-bg);
    color: var(--color-text-dark);
    border: 1px solid var(--color-border);
    border-radius: 1rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  }

  .editorial-input {
    background: #F8F7F3;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    color: var(--color-text-dark);
    font-family: 'Satoshi', sans-serif;
    font-size: 0.875rem; /* 14px */
    transition: all 0.2s ease;
  }
  .editorial-input:focus {
    outline: none;
    background: #FFFFFF;
    border-color: var(--color-olive-main);
    box-shadow: 0 0 0 3px rgba(74, 80, 40, 0.15);
  }

  .editorial-btn {
    background: var(--color-text-dark);
    color: var(--color-bg-main);
    border-radius: 20px;
    font-weight: 600;
    font-family: 'Satoshi', sans-serif;
    letter-spacing: 0.02em;
    transition: all 0.2s ease;
    min-height: 44px; /* MEJORA UX: Tamaño mínimo táctil */
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .editorial-btn:hover { background: var(--color-olive-main); color: #FFFFFF; }
  .editorial-btn:active { transform: scale(0.98); }

  .editorial-nav {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--color-border);
    padding-bottom: max(env(safe-area-inset-bottom), 12px);
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
  }

  .fade-in { animation: fadeIn 0.25s ease-out forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }

  .estanteria-madera {
    background: linear-gradient(to bottom, #F4F0E6 0%, #EAE4D2 100%);
    border-bottom: 14px solid #C5B99E;
    border-radius: 6px 6px 10px 10px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.05);

  .lomo-libro {

  @keyframes parpadeoVela {

  #mapa-gilda { height: 280px; width: 100%; border-radius: 16px; border: 1px solid var(--color-border); z-index: 1; }

<script type="text/babel">
  const { useState, useEffect, useMemo, useRef } = React;

  const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbxAA85jNkM6_Xfnd2NNIiCm3VQcAwD4ZLpXJJsPNyj07vXaUxC5rbZWjSYJM_AU472X/exec';

  const URL_CSV_CAFECITOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1040100079&single=true&output=csv';

  const URL_CSV_CHAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=456334295&single=true&output=csv';
  const URL_CSV_PROPUESTAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1701531859&single=true&output=csv';
  const URL_CSV_VOTACION_CAFE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=933058441&single=true&output=csv';
  const URL_CSV_LECTURAS_PERSONALES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1089788162&single=true&output=csv';
  const URL_CSV_CALENDARIO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=2016923063&single=true&output=csv';

  const FRASES_INICIALES = [
    "Un lector vive mil vidas antes de morir. El que no lee vive solo una.",
    "La depresión... como la manifestación de algo que no se puede reducir a lo anecdótico porque es estructural y colectivo.",
    "No hay barrera, cerradura ni cerrojo que puedas imponer a la libertad de mi mente."
  ];

  const formatoOracion = (texto) => {
    if (!texto) return '';
    const str = texto.toString().trim().toLowerCase();
    return str.charAt(0).toUpperCase() + str.slice(1);
  };

  // MEJORA UX/UI: Modal con cierre de fondo (Backdrop click)
  function ModalUpgrade({ onClose }) {
    return (
      <div className="fixed inset-0 z-[99999] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 fade-in" onClick={onClose}>
        <div className="editorial-card max-w-xs w-full p-6 space-y-4 text-center bg-white relative shadow-2xl" onClick={(e) => e.stopPropagation()}>
          <button onClick={onClose} aria-label="Cerrar ventana" className="absolute top-3 right-3 w-10 h-10 flex items-center justify-center text-gray-400 hover:text-black rounded-full hover:bg-gray-100 transition-colors">
            <i className="fa-solid fa-xmark text-lg"></i>
          </button>
          <div className="w-12 h-12 bg-[#FAF6E8] rounded-full flex items-center justify-center mx-auto text-[#4A5028]">
            <i className="fa-solid fa-lock text-lg"></i>
          </div>
          <div className="space-y-2">
            <h3 className="font-babydoll text-xl font-bold text-[#232321]">Acceso restringido</h3>
            <p className="text-sm text-[#6B685E] font-sans leading-relaxed">
              Tu modalidad actual no incluye acceso a esta función. Actualiza tu suscripción para disfrutar de todas las funciones de gilda.
            </p>
          </div>
          <a href="https://nagoreads.github.io/gilda/" target="_blank" rel="noopener noreferrer" className="w-full editorial-btn py-3 text-sm text-center font-semibold">
            Actualizar modalidad
          </a>
        </div>
      </div>
    );
  }

  function BuscadorLibros({ placeholder, valor, setValor, onSelectLibro }) {
    const [sugerencias, setSugerencias] = useState([]);
    const [buscando, setBuscando] = useState(false);
    const [mostrarDropdown, setMostrarDropdown] = useState(false);

    useEffect(() => {
      if (!valor || valor.trim().length < 2) {
        setSugerencias([]);
        setMostrarDropdown(false);
        return;
      }
      const timer = setTimeout(async () => {
        setBuscando(true);
        try {
          const query = encodeURIComponent(valor.trim());
          const [resGoogle, resOpenLib] = await Promise.allSettled([
            fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=8&printType=books&langRestrict=es`),
            fetch(`https://openlibrary.org/search.json?q=${query}&limit=6&language=spa`)
          ]);
          let listaCombinada = [];
          if (resGoogle.status === 'fulfilled' && resGoogle.value.ok) {
            const dataG = await resGoogle.value.json();
            if (dataG.items) {
              dataG.items.forEach(item => {
                const info = item.volumeInfo || {};
                let thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '';
                if (thumb) {
                  thumb = thumb.replace('http:', 'https:').replace('&edge=curl', '');
                }
                listaCombinada.push({ 
                  titulo: info.title || '', 
                  autora: info.authors ? info.authors.join(', ') : '', 
                  portada: thumb 
                });
              });
            }
          }
          if (resOpenLib.status === 'fulfilled' && resOpenLib.value.ok) {
            const dataOL = await resOpenLib.value.json();
            if (dataOL.docs) {
              dataOL.docs.forEach(doc => {
                listaCombinada.push({ 
                  titulo: doc.title || '', 
                  autora: doc.author_name ? doc.author_name.join(', ') : '', 
                  portada: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : '' 
                });
              });
            }
          }
          const unicos = [];
          const titulosVistos = new Set();
          listaCombinada.forEach(item => {
            const tLimpio = item.titulo.toLowerCase().trim();
            if (tLimpio && !titulosVistos.has(tLimpio)) { 
              titulosVistos.add(tLimpio); 
              unicos.push(item); 
            }
          });
          setSugerencias(unicos.slice(0, 8));
          setMostrarDropdown(unicos.length > 0);
        } catch (err) { console.error(err); } finally { setBuscando(false); }
      }, 300);
      return () => clearTimeout(timer);
    }, [valor]);

    return (
      <div className="relative w-full">
        <div className="relative flex items-center">
          <input type="text" placeholder={placeholder} value={valor} onChange={(e) => { setValor(e.target.value); setMostrarDropdown(true); }} className="w-full editorial-input p-3 text-sm italic pr-9" />
          {buscando && <i className="fa-solid fa-spinner animate-spin absolute right-3 text-sm text-[#4A5028]"></i>}
        </div>
        {mostrarDropdown && sugerencias.length > 0 && (
          <div className="absolute top-full left-0 right-0 z-50 bg-[#FFFFFF] border border-[#E8E6DF] rounded-b-xl shadow-xl max-h-56 overflow-y-auto mt-1">
            {sugerencias.map((item, idx) => (
              <div key={idx} onClick={() => { onSelectLibro(item); setMostrarDropdown(false); }} className="flex items-center gap-3 p-2.5 hover:bg-[#FBF9F5] cursor-pointer border-b border-[#E8E6DF] last:border-0 text-left transition-colors">
                {item.portada ? <img src={`https://images.weserv.nl/?url=${encodeURIComponent(item.portada)}&w=100&output=jpg`} alt="" className="w-7 h-10 object-cover rounded shrink-0 shadow-xs" /> : <div className="w-7 h-10 bg-[#F3EFE6] rounded shrink-0 flex items-center justify-center text-[10px] text-gray-500 border border-[#E8E6DF]">Sin foto</div>}
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-[#232321] truncate leading-tight font-sans">{item.titulo}</p>
                  <p className="text-xs text-[#6B685E] italic truncate font-sans mt-0.5">{item.autora || 'Autora desconocida'}</p>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  function PortadaLibro({ titulo, autora, autor, escritora, portada, cover, image, size = 'normal' }) {
    const [errorImg, setErrorImg] = useState(false);
    const [portadaDinamica, setPortadaDinamica] = useState('');
    const [autoraEncontrada, setAutoraEncontrada] = useState('');
    const [buscandoOnline, setBuscandoOnline] = useState(false);

    // MEJORA UI: Tamaños estandarizados sin micro-tipografías
    const sizeClasses = size === 'large' ? 'w-24 h-36' : size === 'grid' ? 'w-16 h-24' : size === 'thumb' ? 'w-12 h-16' : 'w-12 h-16';
    const fontSizeClass = size === 'large' ? 'text-xs' : 'text-[10px]';

    const portadaOriginal = portada || cover || image || '';
    const tituloFinal = titulo || 'Sin título';
    
    const autoraCruda = autora || autor || escritora || '';
    const autoraFinal = useMemo(() => {
      if (!autoraCruda || typeof autoraCruda !== 'string') return '';
      const aLimpia = autoraCruda.trim();
      const lower = aLimpia.toLowerCase();
      if (['autora', 'autor', 'desconocida', 'escritora', 'undefined', 'null'].includes(lower)) {
        return '';
      }
      return aLimpia;
    }, [autoraCruda]);

    useEffect(() => {
      let activo = true;
      if ((!portadaOriginal || errorImg || !autoraFinal) && tituloFinal && tituloFinal !== 'Sin título' && !buscandoOnline && !portadaDinamica) {
        setBuscandoOnline(true);
        const query = encodeURIComponent(`${tituloFinal} ${autoraFinal}`);
        
        Promise.allSettled([
          fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1&langRestrict=es`).then(r => r.json()),
          fetch(`https://openlibrary.org/search.json?q=${query}&limit=1&language=spa`).then(r => r.json())
        ]).then(results => {
          if (!activo) return;
          let imgEncontrada = '';
          let autEncontrada = '';

          if (results[0].status === 'fulfilled') {
            const itemG = results[0].value.items?.[0]?.volumeInfo;
            if (itemG) {
              if (itemG.imageLinks?.thumbnail || itemG.imageLinks?.smallThumbnail) {
                imgEncontrada = itemG.imageLinks.thumbnail || itemG.imageLinks.smallThumbnail;
              }
              if (itemG.authors && itemG.authors.length > 0) {
                autEncontrada = itemG.authors.join(', ');
              }
            }
          }

          if (!imgEncontrada && results[1].status === 'fulfilled') {
            const docOL = results[1].value.docs?.[0];
            if (docOL) {
              if (docOL.cover_i) {
                imgEncontrada = `https://covers.openlibrary.org/b/id/${docOL.cover_i}-L.jpg`;
              }
              if (docOL.author_name && docOL.author_name.length > 0) {
                autEncontrada = docOL.author_name.join(', ');
              }
            }
          }

          if (imgEncontrada) {
            setPortadaDinamica(imgEncontrada.replace('http:', 'https:'));
          }
          if (autEncontrada && !autoraFinal) {
            setAutoraEncontrada(autEncontrada);
          }
        }).catch(() => {}).finally(() => {
          if (activo) setBuscandoOnline(false);
        });
      }
      return () => { activo = false; };
    }, [portadaOriginal, errorImg, tituloFinal, autoraFinal]);

    const urlSegura = useMemo(() => {
      const pFinal = portadaOriginal || portadaDinamica;
      if (!pFinal || typeof pFinal !== 'string') return '';
      let p = pFinal.trim();
      
      if (p.startsWith('data:image')) return p;

      if (p.startsWith('http://')) {
        p = p.replace('http://', 'https://');
      }

      if (p.startsWith('https://')) {
        return `https://images.weserv.nl/?url=${encodeURIComponent(p)}&w=300&output=jpg`;
      }
      
      return '';
    }, [portadaOriginal, portadaDinamica]);

    const autoraMostrar = autoraFinal || autoraEncontrada || '';

    const colorEditorialFallback = useMemo(() => {
      let hash = 0;
      for (let i = 0; i < tituloFinal.length; i++) { hash = tituloFinal.charCodeAt(i) + ((hash << 5) - hash); }
      const matices = ['#4A5028', '#3E4522', '#633B28', '#2B3027', '#7A4232', '#3C5868', '#684C3C', '#4C3C68', '#5C4033', '#405242'];
      return matices[Math.abs(hash) % matices.length];
    }, [tituloFinal]);

    if (urlSegura !== '' && !errorImg) {
      return (
        <img 
          src={urlSegura} 
          alt={tituloFinal} 
          onError={() => setErrorImg(true)} 
          className={`${sizeClasses} object-cover rounded shadow-xs shrink-0 bg-gray-100`} 
        />
      );
    }

    return (
      <div style={{ backgroundColor: colorEditorialFallback }} className={`${sizeClasses} text-[#FBF9F5] p-2 rounded shadow-xs border border-white/20 shrink-0 flex flex-col justify-between overflow-hidden text-left relative`}>
        <div className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-white/30"></div>
        <span className={`font-bold tracking-tight line-clamp-3 leading-tight font-sans drop-shadow-xs ${fontSizeClass}`}>
          {tituloFinal}
        </span>
        <span className="text-[10px] text-white/80 uppercase tracking-wider truncate font-sans">
          {autoraMostrar}
        </span>
      </div>
    );
  }

  function LomoLibroEstanteria({ item, onClick }) {
    const generarColorEditorial = (texto) => {
      let hash = 0;
      for (let i = 0; i < texto.length; i++) { hash = texto.charCodeAt(i) + ((hash << 5) - hash); }
      const matices = ['#4A5028', '#3E4522', '#633B28', '#2B3027', '#7A4232', '#3C5868', '#684C3C', '#4C3C68', '#5C4033', '#405242', '#6A4E36', '#35424A', '#523A3A', '#4A3B5C', '#3F4E4F'];
      return matices[Math.abs(hash) % matices.length];
    };

    const tituloLibro = item.libro || item.titulo || 'libro';

    return (

    const handleFileChange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          setErrorImg(false);
          onFotoChange(reader.result);
        };

      }
    };

    const renderContent = () => {
      if (foto && foto.trim() !== '' && !errorImg) {
        return <img src={foto} alt={nombre || 'Lector(a)'} onError={() => setErrorImg(true)} className={`${sizeClass} rounded-full object-cover border border-[#E8E6DF] shrink-0`} />;

    };

    if (editable) {
      return (
        <div className="relative group cursor-pointer" onClick={() => fileInputRef.current && fileInputRef.current.click()} title="Cambiar foto de perfil">

    }

    return renderContent();
  }

  function CalendarioInteractivo({ eventos }) {
    const [fechaActual, setFechaActual] = useState(new Date());

    const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
    const nombresMeses = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    const anio = fechaActual.getFullYear();
    const mes = fechaActual.getMonth();

    const primerDiaMes = new Date(anio, mes, 1);
    const ultimoDiaMes = new Date(anio, mes + 1, 0);

    let primerDiaSemanaIndice = primerDiaMes.getDay() - 1;
    if (primerDiaSemanaIndice === -1) primerDiaSemanaIndice = 6;

    const totalDiasMes = ultimoDiaMes.getDate();

    const hoy = new Date();
    const esMesActual = hoy.getFullYear() === anio && hoy.getMonth() === mes;

    const parsearFechaEvento = (strFecha) => {
      if (!strFecha) return null;
      const s = strFecha.toString().trim().toLowerCase();

      if (s.includes('-') || s.includes('/')) {
        const partes = s.split(/[\/-]/);
        if (partes.length >= 2) {
          if (partes[0].length === 4) {
            const y = parseInt(partes[0], 10);
            const m = parseInt(partes[1], 10) - 1;
            const d = parseInt(partes[2], 10);
            if (!isNaN(d) && !isNaN(m)) return { dia: d, mes: m, anio: y };
          } else {
            const d = parseInt(partes[0], 10);
            const m = parseInt(partes[1], 10) - 1;
            const y = partes[2] ? parseInt(partes[2], 10) : anio;
            if (!isNaN(d) && !isNaN(m)) return { dia: d, mes: m, anio: y };
          }
        }
      }

      const matchDia = s.match(/^(\d{1,2})/);
      if (matchDia) {
        const diaNum = parseInt(matchDia[1], 10);
        const mapaMeses = {
          ene: 0, enero: 0, feb: 1, febrero: 1, mar: 2, marzo: 2, abr: 3, abril: 3,
          may: 4, mayo: 4, jun: 5, junio: 5, jul: 6, julio: 6, ago: 7, agosto: 7,
          sep: 8, sept: 8, septiembre: 8, oct: 9, octubre: 9, nov: 10, noviembre: 10, dic: 11, diciembre: 11
        };

        for (const [clave, mesIndex] of Object.entries(mapaMeses)) {
          if (s.includes(clave)) {
            const matchAnio = s.match(/\b(20\d{2})\b/);
            const anioParsed = matchAnio ? parseInt(matchAnio[1], 10) : anio;
            return { dia: diaNum, mes: mesIndex, anio: anioParsed };
          }
        }
      }
      return null;
    };

    const eventosDelMes = useMemo(() => {
      const mapa = {};
      (eventos || []).forEach(ev => {
        const est = (ev.estado || '').toLowerCase();
        if (est === 'pendiente' || est === 'por definir') return;

        const valFecha = ev.fecha || ev.dia || ev.date || ev.fecha_evento;
        const parsed = parsearFechaEvento(valFecha);

        if (parsed && parsed.mes === mes && parsed.anio === anio) {
          if (!mapa[parsed.dia]) mapa[parsed.dia] = [];
          mapa[parsed.dia].push(ev);
        }
      });
      return mapa;
    }, [eventos, mes, anio]);

    const mesAnterior = () => setFechaActual(new Date(anio, mes - 1, 1));
    const mesSiguiente = () => setFechaActual(new Date(anio, mes + 1, 1));

    const celdas = [];
    for (let i = 0; i < primerDiaSemanaIndice; i++) {
      celdas.push(<div key={`empty-${i}`} className="h-9"></div>);
    }

    for (let dia = 1; dia <= totalDiasMes; dia++) {
      const esHoy = esMesActual && hoy.getDate() === dia;
      const evs = eventosDelMes[dia] || [];
      const tieneCafecito = evs.some(e => {
        const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
        return t.includes('cafecito') || t.includes('café');
      });
      const tieneComentario = evs.some(e => {
        const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
        return t.includes('comentario') || t.includes('libro');
      });
      const tieneRecordatorio = evs.some(e => {
        const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
        return t.includes('votar') || t.includes('recordatorio') || t.includes('último día');
      });

      celdas.push(
        <div
          key={dia}
          className={`h-9 flex flex-col items-center justify-center rounded-xl relative transition-all text-xs font-sans ${
            esHoy ? 'bg-[#4A5028] text-white font-bold shadow-xs' : 'hover:bg-[#F8F7F3] text-[#232321]'
          }`}
        >
          <span>{dia}</span>
          {evs.length > 0 && (
            <div className="flex gap-0.5 mt-0.5">
              {tieneCafecito && (
                <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-amber-300' : 'bg-amber-600'}`}></span>
              )}
              {tieneComentario && (
                <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-white' : 'bg-[#4A5028]'}`}></span>
              )}
              {tieneRecordatorio && (
                <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-purple-300' : 'bg-purple-600'}`}></span>
              )}
              {!tieneCafecito && !tieneComentario && !tieneRecordatorio && (
                <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-white' : 'bg-[#4A5028]'}`}></span>
              )}
            </div>
          )}
        </div>
      );
    }

    return (
      <div className="space-y-3">
        <div className="flex justify-between items-center bg-[#FBF9F5] p-2.5 rounded-xl border border-[#E8E6DF]">
          <button onClick={mesAnterior} aria-label="Mes anterior" className="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white text-[#232321] transition-colors">
            <i className="fa-solid fa-chevron-left text-sm"></i>
          </button>
          <h4 className="font-babydoll text-lg font-bold text-[#232321]">
            {nombresMeses[mes]} {anio}
          </h4>
          <button onClick={mesSiguiente} aria-label="Mes siguiente" className="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white text-[#232321] transition-colors">
            <i className="fa-solid fa-chevron-right text-sm"></i>
          </button>
        </div>

        <div className="grid grid-cols-7 gap-1 text-center font-sans text-[10px] uppercase font-bold text-[#6B685E] pb-1 border-b border-[#E8E6DF]">
          {diasSemana.map((d, i) => (
            <div key={i}>{d}</div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-1 text-center">
          {celdas}
        </div>

        <div className="flex items-center justify-center gap-3 pt-2 text-xs font-sans text-[#6B685E] border-t border-[#E8E6DF] flex-wrap">
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-[#4A5028]"></span>
            <span>Comentarios</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-amber-600"></span>
            <span>Cafecito</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-purple-600"></span>
            <span>Recordatorio</span>
          </div>
        </div>
      </div>
    );
  }

      if (!loc) return { coords: [40.4168, -3.7038], ca: 'Otras regiones' };
      const lLimpia = loc.toLowerCase().trim();
      if (GEO_INTERNA[lLimpia]) return GEO_INTERNA[lLimpia];
      for (const key in GEO_INTERNA) {
        if (lLimpia.includes(key) || key.includes(lLimpia)) {

        }
      }
      return { coords: [40.4168, -3.7038], ca: 'Otras regiones' };
    };

      const conteo = {};
      usuarias.forEach(u => {
        const loc = (u.ciudad || u.provincia_region || 'Otras').trim();
        const info = obtenerDatosUbicacion(loc);
        const caNombre = info.ca;
        conteo[caNombre] = (conteo[caNombre] || 0) + 1;
      });
      return Object.entries(conteo).sort((a, b) => b[1] - a[1]);
    }, [usuarias]);

    const usuariasConCoordenadas = useMemo(() => {
      const mapaCoordenadasSocio = {};
      return usuarias.map(u => {
        const loc = (u.ciudad || u.provincia_region || '').trim();

        let coordsFinales = [...baseCoords];

        if (!mapaCoordenadasSocio[coordKey]) {
          mapaCoordenadasSocio[coordKey] = 1;
        } else {
          const count = mapaCoordenadasSocio[coordKey];
          mapaCoordenadasSocio[coordKey]++;
          const angle = count * 1.2;
          const distance = 0.012 * Math.sqrt(count);
          coordsFinales = [
            baseCoords[0] + distance * Math.cos(angle),
            baseCoords[1] + distance * Math.sin(angle)
          ];

                          const nombreAutorChat = obtenerNombreReal(m.email, m.usuario || m.usuaria);
                          const usuarioMsg = nombreAutorChat.toLowerCase().trim();
                          const miNombre = (nombreUsuarioPersonalizado || sesion.nombre || '').toLowerCase().trim();
                          const esMia = usuarioMsg === miNombre;
                          return (
                            <div key={i} className={`flex flex-col max-w-[85%] ${esMia ? 'self-end items-end' : 'self-start items-start'}`}>
                              <span className="text-[10px] uppercase font-bold text-gray-500 font-sans mb-1 px-1">{nombreAutorChat}</span>
                              <div className={`p-3.5 rounded-2xl text-sm leading-relaxed shadow-xs font-sans ${esMia ? 'bg-[#4A5028] text-white rounded-br-xs' : 'bg-[#F8F7F3] border border-[#E8E6DF] text-[#232321] rounded-bl-xs'}`}>
                                {m.mensaje}
                              </div>
                            </div>
                          );
                        })}
                        <div ref={chatEndRef} />
                      </div>
                      <form onSubmit={(e) => { e.preventDefault(); if(!nuevoChat.trim())return; enviarAccion('enviar_chat', {mensaje: nuevoChat}); setNuevoChat(''); }} className="p-3 border-t border-[#E8E6DF] flex gap-2 bg-white">
                        <input type="text" value={nuevoChat} onChange={e => setNuevoChat(e.target.value)} className="flex-grow editorial-input px-4 py-3 text-sm" placeholder="Escribe un mensaje al club..." />
                        <button type="submit" aria-label="Enviar mensaje" className="editorial-btn px-5 py-3 text-sm min-h-[44px]"><i className="fa-solid fa-paper-plane"></i></button>
                      </form>
                    </div>
                  )}

                  {subTabComunidad === 'mapa' && (
                    <div className="editorial-card p-4 space-y-3">
                      <div className="flex justify-between items-center text-sm px-1">
                        <span className="font-babydoll text-xl font-bold">Mapa Global de Lectoras</span>
                        <span className="text-xs text-[#4A5028] font-bold font-sans">{usuariasClub.length} socia(s)</span>
                      </div>
                      <MapaGilda usuarias={usuariasClub} />
                    </div>
                  )}

                  {subTabComunidad === 'archivo' && (
                    <div className="space-y-5">
                      <div className="editorial-card p-6 space-y-4">
                        <h3 className="font-babydoll text-xl font-bold">Proponer Nueva Lectura</h3>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          const tit = nuevaPropuestaTitulo?.trim();
                          if (!tit) return;
                          const nueva = { titulo: tit, autora: nuevaPropuestaAutora?.trim() || '', votos: '1', votantes: sesion.email.toLowerCase(), portada: nuevaPropuestaPortada?.trim() || '' };
                          setPropuestas([...propuestas, nueva]);
                          enviarAccion('propuesta', nueva);
                          setNuevaPropuestaTitulo(''); setNuevaPropuestaAutora(''); setNuevaPropuestaPortada('');
                          mostrarToast('Propuesta añadida.');
                        }} className="space-y-3">
                          <BuscadorLibros placeholder="Título del libro o autora..." valor={nuevaPropuestaTitulo} setValor={setNuevaPropuestaTitulo} onSelectLibro={(l) => { setNuevaPropuestaTitulo(l.titulo); setNuevaPropuestaAutora(l.autora); setNuevaPropuestaPortada(l.portada); }} />
                          <input type="text" placeholder="Autora..." value={nuevaPropuestaAutora || ''} onChange={e=>setNuevaPropuestaAutora(e.target.value)} className="w-full editorial-input p-3 text-sm" />
                          <button type="submit" className="w-full editorial-btn py-3 text-sm mt-1">Añadir propuesta</button>
                        </form>
                      </div>

                      <div className="editorial-card p-6">
                        <div className="flex justify-between items-center mb-4">
                          <h3 className="font-babydoll text-xl font-bold">Votación del Mes</h3>
                          <span className="text-[10px] text-gray-500 font-sans uppercase font-bold">Top 3 finalistas</span>
                        </div>
                        <div className="space-y-4">
                          {[...propuestas]
                            .sort((a, b) => (Number(b.votos) || 0) - (Number(a.votos) || 0))
                            .slice(0, 3)
                            .map((p, i) => (
                              <div key={i} className="flex gap-4 border border-[#E8E6DF] p-4 rounded-xl bg-[#FBF9F5]">
                                <PortadaLibro titulo={p.titulo} autora={p.autora} portada={p.portada} size="thumb" />
                                <div className="flex flex-col justify-between w-full">
                                  <div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-sm font-bold text-[#4A5028] font-sans">#{i + 1}</span>
                                      <h4 className="font-bold text-sm leading-tight font-sans">{p.titulo}</h4>
                                    </div>
                                    <p className="text-xs text-[#6B685E] italic font-sans mt-1">{p.autora}</p>
                                  </div>
                                  <button onClick={()=>{
                                    const clon = [...propuestas]; const item = clon.find(x => x.titulo === p.titulo); if(!item) return;
                                    let arr = (item.votantes||"").toLowerCase().split(',').map(v=>v.trim()).filter(v=>v);
                                    if(arr.includes(sesion.email.toLowerCase())){ arr = arr.filter(v=>v!==sesion.email.toLowerCase()); item.votos = Math.max(0, Number(item.votos||0) - 1); } else { arr.push(sesion.email.toLowerCase()); item.votos = Number(item.votos||0) + 1; }
                                    item.votantes = arr.join(','); setPropuestas(clon); enviarAccion('votar', { tipo: 'propuesta', id: p.titulo, email: sesion.email }); mostrarToast('Voto actualizado.');
                                  }} className="self-start mt-3 px-4 py-2 min-h-[44px] text-sm rounded-full font-bold bg-white text-[#232321] border border-[#E8E6DF] font-sans active:scale-95 hover:bg-gray-50 transition-colors">Votar ({p.votos||0})</button>
                                </div>
                              </div>
                            ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {subTabComunidad === 'buzon' && (
                    <div className="editorial-card p-6 space-y-4">
                      <h2 className="font-babydoll text-2xl font-bold">Buzón privado</h2>
                      <p className="text-sm text-[#6B685E] font-sans">Sugerencias y comunicación directa con la administración.</p>
                      <textarea placeholder="Escribe tu mensaje..." value={mensajeFundadora} onChange={e=>setMensajeFundadora(e.target.value)} className="w-full editorial-input p-4 text-sm h-32 resize-none"></textarea>
                      <button onClick={()=>{ enviarAccion('buzon',{mensaje:mensajeFundadora}); setMensajeFundadora(''); mostrarToast('Mensaje enviado.');}} className="w-full editorial-btn py-3 text-sm">Enviar mensaje</button>
                    </div>
                  )}
                </div>
              )}
            </div>
        </div>

        <nav className="editorial-nav fixed bottom-0 z-40">
          <div className="flex justify-around items-center py-2 px-3">
            {[
              { id: 'inicio', icon: 'fa-house', label: 'inicio' },
              { id: 'edificio', icon: 'fa-building', label: 'casa' },
              { id: 'habitacion', icon: 'fa-bookmark', label: 'habitación' },
              { id: 'capitulos', icon: 'fa-book-open', label: 'capítulos' },
              { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' }
            ].map(tab => {
              const esComunidad = tab.id === 'comunidad';
              const bloqueado = esRestringida && esComunidad;

              return (
                <button 
                  key={tab.id} 
                  aria-label={`Ir a la sección ${tab.label}`}
                  onClick={() => {
                    if (bloqueado) {
                      setMostrarModalUpgrade(true);
                    } else {
                      setSeccionApp(tab.id);
                    }
                  }} 
                  className={`flex flex-col items-center justify-center gap-1 transition-all min-w-[64px] min-h-[48px] rounded-xl ${seccionApp === tab.id ? 'text-[#232321] font-bold bg-[#F8F7F3]' : 'text-gray-400 hover:text-gray-600'} ${bloqueado ? 'opacity-50' : ''}`}
                >
                  <i className={`fa-solid ${tab.icon} text-lg ${bloqueado ? 'fa-lock text-xs' : ''}`}></i>
                  <span className="text-[10px] font-bold uppercase font-sans tracking-wide">{tab.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      </div>
    );
  }

  const containerRoot = ReactDOM.createRoot(document.getElementById('root'));
  containerRoot.render(<App />);
</script>
