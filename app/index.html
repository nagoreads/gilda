<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4A5028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>gilda — club de lectura</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW error:', err));
        });
      }
    </script>

    <!-- Fontshare: Satoshi -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React, ReactDOM y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      @font-face {
        font-family: 'BabyDoll';
        src: url('babydoll.ttf') format('truetype'),
             url('babydoll.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg-editorial: #FBF9F5;
        --text-main: #232321;
        --text-muted: #5C574F;
        --primary-olive: #4A5028;
        --border-editorial: #E8E6DF;
      }

      body {
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-editorial);
        color: var(--text-main);
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .font-babydoll {
        font-family: 'BabyDoll', cursive, sans-serif;
        letter-spacing: 0.5px;
      }

      .editorial-card {
        background: #FFFFFF;
        color: var(--text-main);
        border: 1px solid var(--border-editorial);
        border-radius: 20px;
        box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .editorial-card:hover {
        box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.08);
      }

      .editorial-input {
        background: #F8F7F3;
        border: 1px solid var(--border-editorial);
        border-radius: 12px;
        color: var(--text-main);
        font-family: 'Satoshi', sans-serif;
        font-size: 0.875rem;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-input:focus {
        outline: none;
        background: #FFFFFF;
        border-color: var(--primary-olive);
        box-shadow: 0 0 0 3px rgba(74, 80, 40, 0.12);
      }

      .editorial-btn {
        background: var(--text-main);
        color: var(--bg-editorial);
        border-radius: 20px;
        font-weight: 600;
        font-family: 'Satoshi', sans-serif;
        letter-spacing: 0.02em;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-btn:hover { 
        background: var(--primary-olive); 
        color: #FFFFFF; 
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(74, 80, 40, 0.2);
      }
      .editorial-btn:active {
        transform: scale(0.96);
      }

      .editorial-nav {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border-editorial);
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }

      /* Animaciones Avanzadas */
      @keyframes viewTransition {
        from { opacity: 0; transform: translateY(10px) scale(0.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-view { animation: viewTransition 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes modalSpring {
        0% { opacity: 0; transform: scale(0.93) translateY(12px); }
        70% { transform: scale(1.01) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-modal { animation: modalSpring 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

      @keyframes parpadeoVela {
        0%, 100% { transform: scale(1) rotate(-3deg); opacity: 0.9; }
        50% { transform: scale(1.1) rotate(3deg); opacity: 1; filter: drop-shadow(0 0 6px rgba(230,126,34,0.5)); }
      }
      .vela-flama { animation: parpadeoVela 1.6s infinite ease-in-out; transform-origin: bottom center; }

      @keyframes subirHumo {
        0% { transform: translateY(0) scaleX(1); opacity: 0.7; }
        100% { transform: translateY(-16px) scaleX(1.5); opacity: 0; }
      }
      .humo-taza { animation: subirHumo 2.2s infinite ease-out; }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton-shimmer {
        background: linear-gradient(90deg, #F0EDE6 25%, #E5E1D8 50%, #F0EDE6 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      .estanteria-madera {
        background: linear-gradient(to bottom, #F4F0E6 0%, #EAE4D2 100%);
        border-bottom: 14px solid #C5B99E;
        border-radius: 8px 8px 12px 12px;
        box-shadow: inset 0 3px 8px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.05);
        position: relative;
      }

      .lomo-libro {
        transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      }
      .lomo-libro:hover {
        transform: translateY(-10px) scale(1.04);
        box-shadow: 0 18px 32px rgba(0,0,0,0.2);
      }

      #mapa-gilda { height: 280px; width: 100%; border-radius: 16px; border: 1px solid var(--border-editorial); z-index: 1; }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D0CEB3; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root" class="w-full flex flex-col items-center"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbxAA85jNkM6_Xfnd2NNIiCm3VQcAwD4ZLpXJJsPNyj07vXaUxC5rbZWjSYJM_AU472X/exec';
      const URL_CSV_USUARIAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=0&single=true&output=csv';
      const URL_CSV_CAPITULOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1060479353&single=true&output=csv';
      const URL_CSV_COMENTARIOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1626426174&single=true&output=csv';
      const URL_CSV_CAFECITOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1040100079&single=true&output=csv';
      const URL_CSV_LECTURAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1676533026&single=true&output=csv';
      const URL_CSV_CHAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=456334295&single=true&output=csv';
      const URL_CSV_PROPUESTAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1701531859&single=true&output=csv';
      const URL_CSV_VOTACION_CAFE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=933058441&single=true&output=csv';
      const URL_CSV_LECTURAS_PERSONALES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1089788162&single=true&output=csv';
      const URL_CSV_CALENDARIO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=2016923063&single=true&output=csv';

      const FRASES_INICIALES = [
        "Un lector vive mil vidas antes de morir. El que no lee vive solo una.",
        "La depresión... como la manifestación de algo que no se puede reducir a lo anecdótico porque es estructural y colectivo.",
        "No hay barrera, cerradura ni cerrojo que puedas imponer a la libertad di mi mente."
      ];

      const formatoOracion = (texto) => {
        if (!texto) return '';
        const str = texto.toString().trim().toLowerCase();
        return str.charAt(0).toUpperCase() + str.slice(1);
      };

      function ModalUpgrade({ onClose }) {
        return (
          <div className="fixed inset-0 z-[99999] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="editorial-card max-w-sm w-full p-6 space-y-4 text-center bg-white relative animate-modal">
              <button onClick={onClose} className="absolute top-3 right-3 text-gray-400 hover:text-black transition-colors">
                <i className="fa-solid fa-xmark text-sm"></i>
              </button>
              <div className="w-12 h-12 bg-[#FAF6E8] rounded-full flex items-center justify-center mx-auto text-[#4A5028] shadow-inner">
                <i className="fa-solid fa-lock text-lg animate-bounce"></i>
              </div>
              <div className="space-y-1">
                <h3 className="font-babydoll text-xl font-bold">Acceso restringido</h3>
                <p className="text-xs text-[#5C574F] font-sans leading-relaxed">
                  Tu modalidad actual no incluye acceso a esta función. Actualiza tu suscripción para desbloquear todas las secciones de gilda.
                </p>
              </div>
              <a href="https://nagoreads.github.io/gilda/" target="_blank" rel="noopener noreferrer" className="block w-full editorial-btn py-2.5 text-xs text-center font-semibold">
                Actualizar modalidad
              </a>
            </div>
          </div>
        );
      }

      function BuscadorLibros({ placeholder, valor, setValor, onSelectLibro }) {
        const [sugerencias, setSugerencias] = useState([]);
        const [buscando, setBuscando] = useState(false);
        const [mostrarDropdown, setMostrarDropdown] = useState(false);

        useEffect(() => {
          if (!valor || valor.trim().length < 2) {
            setSugerencias([]);
            setMostrarDropdown(false);
            return;
          }
          const timer = setTimeout(async () => {
            setBuscando(true);
            try {
              const query = encodeURIComponent(valor.trim());
              const [resGoogle, resOpenLib] = await Promise.allSettled([
                fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=8&printType=books&langRestrict=es`),
                fetch(`https://openlibrary.org/search.json?q=${query}&limit=6&language=spa`)
              ]);
              let listaCombinada = [];
              if (resGoogle.status === 'fulfilled' && resGoogle.value.ok) {
                const dataG = await resGoogle.value.json();
                if (dataG.items) {
                  dataG.items.forEach(item => {
                    const info = item.volumeInfo || {};
                    let thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '';
                    if (thumb) {
                      thumb = thumb.replace('http:', 'https:').replace('&edge=curl', '');
                    }
                    listaCombinada.push({ 
                      titulo: info.title || '', 
                      autora: info.authors ? info.authors.join(', ') : '', 
                      portada: thumb 
                    });
                  });
                }
              }
              if (resOpenLib.status === 'fulfilled' && resOpenLib.value.ok) {
                const dataOL = await resOpenLib.value.json();
                if (dataOL.docs) {
                  dataOL.docs.forEach(doc => {
                    listaCombinada.push({ 
                      titulo: doc.title || '', 
                      autora: doc.author_name ? doc.author_name.join(', ') : '', 
                      portada: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : '' 
                    });
                  });
                }
              }
              const unicos = [];
              const titulosVistos = new Set();
              listaCombinada.forEach(item => {
                const tLimpio = item.titulo.toLowerCase().trim();
                if (tLimpio && !titulosVistos.has(tLimpio)) { 
                  titulosVistos.add(tLimpio); 
                  unicos.push(item); 
                }
              });
              setSugerencias(unicos.slice(0, 8));
              setMostrarDropdown(unicos.length > 0);
            } catch (err) { console.error(err); } finally { setBuscando(false); }
          }, 300);
          return () => clearTimeout(timer);
        }, [valor]);

        return (
          <div className="relative w-full">
            <div className="relative flex items-center">
              <input type="text" placeholder={placeholder} value={valor} onChange={(e) => { setValor(e.target.value); setMostrarDropdown(true); }} className="w-full editorial-input p-2.5 text-xs italic pr-8" />
              {buscando && <i className="fa-solid fa-spinner animate-spin absolute right-2.5 text-xs text-[#4A5028]"></i>}
            </div>
            {mostrarDropdown && sugerencias.length > 0 && (
              <div className="absolute top-full left-0 right-0 z-50 bg-[#FFFFFF] border border-[#E8E6DF] rounded-b-xl shadow-xl max-h-56 overflow-y-auto mt-1 animate-modal">
                {sugerencias.map((item, idx) => (
                  <div key={idx} onClick={() => { onSelectLibro(item); setMostrarDropdown(false); }} className="flex items-center gap-2.5 p-2 hover:bg-[#FBF9F5] cursor-pointer border-b border-[#E8E6DF] last:border-0 text-left transition-colors">
                    {item.portada ? <img src={`https://images.weserv.nl/?url=${encodeURIComponent(item.portada)}&w=100&output=jpg`} alt="" className="w-7 h-10 object-cover rounded shrink-0 shadow-sm" /> : <div className="w-7 h-10 bg-[#F3EFE6] rounded shrink-0 flex items-center justify-center text-[7px] text-[#5C574F] border border-[#E8E6DF]">Sin foto</div>}
                    <div className="overflow-hidden">
                      <p className="text-sm font-bold text-[#232321] truncate leading-tight font-babydoll">{item.titulo}</p>
                      <p className="text-[10px] text-[#5C574F] italic truncate font-sans">{item.autora || ''}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PortadaLibro({ titulo, autora, autor, escritora, portada, cover, image, size = 'normal' }) {
        const [errorImg, setErrorImg] = useState(false);
        const [portadaDinamica, setPortadaDinamica] = useState('');
        const [autoraEncontrada, setAutoraEncontrada] = useState('');
        const [buscandoOnline, setBuscandoOnline] = useState(false);

        const sizeClasses = size === 'large' ? 'w-24 h-36 text-xs' : size === 'grid' ? 'w-16 h-24 text-[9px]' : size === 'thumb' ? 'w-10 h-14 text-[8px]' : 'w-12 h-16 text-[8px]';

        const portadaOriginal = portada || cover || image || '';
        const tituloFinal = titulo || 'Sin título';
        const autoraCruda = autora || autor || escritora || '';
        
        const autoraFinal = useMemo(() => {
          if (!autoraCruda || typeof autoraCruda !== 'string') return '';
          const aLimpia = autoraCruda.trim();
          if (['autora', 'autor', 'desconocida', 'escritora', 'undefined', 'null'].includes(aLimpia.toLowerCase())) return '';
          return aLimpia;
        }, [autoraCruda]);

        useEffect(() => {
          let activo = true;
          if ((!portadaOriginal || errorImg || !autoraFinal) && tituloFinal && tituloFinal !== 'Sin título' && !buscandoOnline && !portadaDinamica) {
            setBuscandoOnline(true);
            const query = encodeURIComponent(`${tituloFinal} ${autoraFinal}`);
            
            Promise.allSettled([
              fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1&langRestrict=es`).then(r => r.json()),
              fetch(`https://openlibrary.org/search.json?q=${query}&limit=1&language=spa`).then(r => r.json())
            ]).then(results => {
              if (!activo) return;
              let imgEncontrada = '';
              let autEncontrada = '';

              if (results[0].status === 'fulfilled') {
                const itemG = results[0].value.items?.[0]?.volumeInfo;
                if (itemG?.imageLinks) {
                  imgEncontrada = itemG.imageLinks.thumbnail || itemG.imageLinks.smallThumbnail;
                }
                if (itemG?.authors?.length > 0) autEncontrada = itemG.authors.join(', ');
              }

              if (!imgEncontrada && results[1].status === 'fulfilled') {
                const docOL = results[1].value.docs?.[0];
                if (docOL?.cover_i) imgEncontrada = `https://covers.openlibrary.org/b/id/${docOL.cover_i}-L.jpg`;
                if (docOL?.author_name?.length > 0) autEncontrada = docOL.author_name.join(', ');
              }

              if (imgEncontrada) setPortadaDinamica(imgEncontrada.replace('http:', 'https:'));
              if (autEncontrada && !autoraFinal) setAutoraEncontrada(autEncontrada);
            }).catch(() => {}).finally(() => { if (activo) setBuscandoOnline(false); });
          }
          return () => { activo = false; };
        }, [portadaOriginal, errorImg, tituloFinal, autoraFinal]);

        const urlSegura = useMemo(() => {
          const pFinal = portadaOriginal || portadaDinamica;
          if (!pFinal || typeof pFinal !== 'string') return '';
          let p = pFinal.trim();
          if (p.startsWith('data:image')) return p;
          if (p.startsWith('http://')) p = p.replace('http://', 'https://');
          if (p.startsWith('https://')) return `https://images.weserv.nl/?url=${encodeURIComponent(p)}&w=300&output=jpg`;
          return '';
        }, [portadaOriginal, portadaDinamica]);

        const autoraMostrar = autoraFinal || autoraEncontrada || '';

        const colorEditorialFallback = useMemo(() => {
          let hash = 0;
          for (let i = 0; i < tituloFinal.length; i++) { hash = tituloFinal.charCodeAt(i) + ((hash << 5) - hash); }
          const matices = ['#4A5028', '#3E4522', '#633B28', '#2B3027', '#7A4232', '#3C5868', '#684C3C', '#4C3C68', '#5C4033', '#405242'];
          return matices[Math.abs(hash) % matices.length];
        }, [tituloFinal]);

        if (urlSegura !== '' && !errorImg) {
          return <img src={urlSegura} alt={tituloFinal} onError={() => setErrorImg(true)} className={`${sizeClasses} object-cover rounded shadow-sm shrink-0 bg-gray-100 transition-transform duration-300 hover:scale-105`} />;
        }

        return (
          <div style={{ backgroundColor: colorEditorialFallback }} className={`${sizeClasses} text-[#FBF9F5] p-2 rounded shadow-sm border border-white/20 shrink-0 flex flex-col justify-between overflow-hidden text-left relative`}>
            <div className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-white/30"></div>
            <span className="font-bold tracking-tight line-clamp-3 leading-tight font-babydoll drop-shadow-sm" style={{ fontSize: size === 'large' ? '11px' : '9px' }}>
              {tituloFinal}
            </span>
            <span className="text-[7px] text-white/80 uppercase tracking-wider truncate font-sans">
              {autoraMostrar}
            </span>
          </div>
        );
      }

      function LomoLibroEstanteria({ item, onClick }) {
        const generarColorEditorial = (texto) => {
          let hash = 0;
          for (let i = 0; i < texto.length; i++) { hash = texto.charCodeAt(i) + ((hash << 5) - hash); }
          const matices = ['#4A5028', '#3E4522', '#633B28', '#2B3027', '#7A4232', '#3C5868', '#684C3C', '#4C3C68', '#5C4033', '#405242', '#6A4E36', '#35424A', '#523A3A', '#4A3B5C', '#3F4E4F'];
          return matices[Math.abs(hash) % matices.length];
        };

        const tituloLibro = item.libro || item.titulo || 'libro';

        return (
          <div onClick={onClick} style={{ backgroundColor: generarColorEditorial(tituloLibro) }} className="lomo-libro text-[#FBF9F5] w-12 h-36 shrink-0 cursor-pointer shadow-md relative rounded-t-sm overflow-hidden flex flex-col justify-start p-2 border-t border-white/20" title={`${tituloLibro} — ${item.autora || ''}`}>
            <div className="absolute top-1 left-1.5 w-1 h-2 rounded-full bg-white/20"></div>
            <div className="flex flex-col h-full justify-start pt-3">
              <span className="font-babydoll font-bold text-[9px] leading-tight text-left text-white drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)] overflow-hidden" style={{writingMode: 'vertical-rl', textOrientation: 'mixed', maxHeight: '110px'}}>
                {tituloLibro}
              </span>
            </div>
          </div>
        );
      }

      function IlustracionDecoracion({ tipo }) {
        if (tipo === 'monstera') return (

      function AvatarUsuaria({ foto, nombre, sizeClass = "w-9 h-9", textClass = "text-lg", editable = false, onFotoChange = () => {} }) {
        const [errorImg, setErrorImg] = useState(false);
        const fileInputRef = useRef(null);

        const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => { setErrorImg(false); onFotoChange(reader.result); };
            reader.readAsDataURL(file);
          }
        };

        const renderContent = () => {
          if (foto && foto.trim() !== '' && !errorImg) {
            return <img src={foto} alt={nombre || 'Lector(a)'} onError={() => setErrorImg(true)} className={`${sizeClass} rounded-full object-cover border border-[#E8E6DF] shrink-0 transition-transform duration-300 hover:scale-105`} />;
          }
          return <div className={`${sizeClass} rounded-full bg-[#F8F7F3] border border-[#E8E6DF] flex items-center justify-center font-babydoll ${textClass} text-[#4A5028] shrink-0 font-bold`}>{(nombre || 'L').charAt(0).toUpperCase()}</div>;
        };

        if (editable) {
          return (
            <div className="relative group cursor-pointer" onClick={() => fileInputRef.current && fileInputRef.current.click()} title="Cambiar foto de perfil">
              {renderContent()}
              <div className="absolute inset-0 rounded-full bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                <i className="fa-solid fa-camera text-white text-xs"></i>
              </div>
              <input type="file" ref={fileInputRef} accept="image/*" onChange={handleFileChange} className="hidden" />
            </div>
          );
        }
        return renderContent();
      }

      function CalendarioInteractivo({ eventos }) {
        const [fechaActual, setFechaActual] = useState(new Date());
        const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        const anio = fechaActual.getFullYear();
        const mes = fechaActual.getMonth();
        const primerDiaMes = new Date(anio, mes, 1);
        const ultimoDiaMes = new Date(anio, mes + 1, 0);

        let primerDiaSemanaIndice = primerDiaMes.getDay() - 1;
        if (primerDiaSemanaIndice === -1) primerDiaSemanaIndice = 6;
        const totalDiasMes = ultimoDiaMes.getDate();
        const hoy = new Date();
        const esMesActual = hoy.getFullYear() === anio && hoy.getMonth() === mes;

        const parsearFechaEvento = (strFecha) => {
          if (!strFecha) return null;
          const s = strFecha.toString().trim().toLowerCase();
          if (s.includes('-') || s.includes('/')) {
            const partes = s.split(/[\/-]/);
            if (partes.length >= 2) {
              const d = parseInt(partes[0].length === 4 ? partes[2] : partes[0], 10);
              const m = parseInt(partes[0].length === 4 ? partes[1] : partes[1], 10) - 1;
              const y = partes[0].length === 4 ? parseInt(partes[0], 10) : (partes[2] ? parseInt(partes[2], 10) : anio);
              if (!isNaN(d) && !isNaN(m)) return { dia: d, mes: m, anio: y };
            }
          }
          const matchDia = s.match(/^(\d{1,2})/);
          if (matchDia) {
            const diaNum = parseInt(matchDia[1], 10);
            const mapaMeses = { ene:0, enero:0, feb:1, febrero:1, mar:2, marzo:2, abr:3, abril:3, may:4, mayo:4, jun:5, junio:5, jul:6, julio:6, ago:7, agosto:7, sep:8, septiembre:8, oct:9, octubre:9, nov:10, noviembre:10, dic:11, diciembre:11 };
            for (const [clave, mesIndex] of Object.entries(mapaMeses)) {
              if (s.includes(clave)) return { dia: diaNum, mes: mesIndex, anio };
            }
          }
          return null;
        };

        const eventosDelMes = useMemo(() => {
          const mapa = {};
          (eventos || []).forEach(ev => {
            if ((ev.estado || '').toLowerCase() === 'pendiente') return;
            const parsed = parsearFechaEvento(ev.fecha || ev.dia || ev.date);
            if (parsed && parsed.mes === mes && parsed.anio === anio) {
              if (!mapa[parsed.dia]) mapa[parsed.dia] = [];
              mapa[parsed.dia].push(ev);
            }
          });
          return mapa;
        }, [eventos, mes, anio]);

        return (
          <div className="space-y-3">
            <div className="flex justify-between items-center bg-[#FBF9F5] p-2.5 rounded-xl border border-[#E8E6DF]">
              <button onClick={() => setFechaActual(new Date(anio, mes - 1, 1))} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white transition-colors"><i className="fa-solid fa-chevron-left text-xs"></i></button>
              <h4 className="font-babydoll text-base font-bold text-[#232321]">{nombresMeses[mes]} {anio}</h4>
              <button onClick={() => setFechaActual(new Date(anio, mes + 1, 1))} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white transition-colors"><i className="fa-solid fa-chevron-right text-xs"></i></button>
            </div>
            <div className="grid grid-cols-7 gap-1 text-center font-sans text-[10px] uppercase font-semibold text-[#5C574F] pb-1 border-b border-[#E8E6DF]">
              {diasSemana.map((d, i) => <div key={i}>{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1 text-center">
              {Array.from({ length: primerDiaSemanaIndice }).map((_, i) => <div key={`e-${i}`} className="h-9"></div>)}
              {Array.from({ length: totalDiasMes }).map((_, i) => {
                const dia = i + 1;
                const esHoy = esMesActual && hoy.getDate() === dia;
                const evs = eventosDelMes[dia] || [];
                return (
                  <div key={dia} className={`h-9 flex flex-col items-center justify-center rounded-xl relative transition-all text-xs font-sans ${esHoy ? 'bg-[#4A5028] text-white font-bold shadow-md scale-105' : 'hover:bg-[#F8F7F3] text-[#232321]'}`}>
                    <span>{dia}</span>
                    {evs.length > 0 && <span className={`w-1.5 h-1.5 rounded-full mt-0.5 ${esHoy ? 'bg-amber-300' : 'bg-[#4A5028]'}`}></span>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function MapaGilda({ usuarias }) {
        const mapRef = useRef(null);
        const markersGroupRef = useRef(null);
        const [regionSeleccionada, setRegionSeleccionada] = useState(null);

        const GEO_INTERNA = {
          'madrid': { coords: [40.4168, -3.7038], ca: 'Comunidad de Madrid' },
          'barcelona': { coords: [41.3851, 2.1734], ca: 'Cataluña' },
          'bilbao': { coords: [43.2630, -2.9350], ca: 'País Vasco' },
          'sevilla': { coords: [37.3891, -5.9845], ca: 'Andalucía' },
          'valencia': { coords: [39.4699, -0.3763], ca: 'Comunidad Valenciana' },
          'a coruña': { coords: [43.3623, -8.4115], ca: 'Galicia' },
          'zaragoza': { coords: [41.6488, -0.8891], ca: 'Aragón' }
        };

        const obtenerDatosUbicacion = (loc) => {
          if (!loc) return { coords: [40.4168, -3.7038], ca: 'Otras regiones' };
          const lLimpia = loc.toLowerCase().trim();
          for (const key in GEO_INTERNA) {
            if (lLimpia.includes(key)) return GEO_INTERNA[key];
          }
          return { coords: [40.4168, -3.7038], ca: 'Otras regiones' };
        };

        const regionesConteo = useMemo(() => {
          const conteo = {};
          usuarias.forEach(u => {
            const ca = obtenerDatosUbicacion(u.ciudad || u.provincia_region).ca;
            conteo[ca] = (conteo[ca] || 0) + 1;
          });
          return Object.entries(conteo).sort((a, b) => b[1] - a[1]);
        }, [usuarias]);

        const usuariasConCoordenadas = useMemo(() => {
          const mapaC = {};
          return usuarias.map(u => {
            const info = obtenerDatosUbicacion(u.ciudad || u.provincia_region);
            const key = `${info.coords[0].toFixed(2)},${info.coords[1].toFixed(2)}`;
            let coords = [...info.coords];
            if (mapaC[key]) {
              const c = mapaC[key]++;
              coords = [coords[0] + 0.01 * Math.cos(c), coords[1] + 0.01 * Math.sin(c)];
            } else { mapaC[key] = 1; }
            return { ...u, coords, regionAgrupada: info.ca };
          });
        }, [usuarias]);

        useEffect(() => {
          if (typeof L === 'undefined') return;
          if (!mapRef.current) {
            const map = L.map('mapa-gilda', { zoomControl: false, attributionControl: false }).setView([40.4167, -3.7037], 5);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
            markersGroupRef.current = L.layerGroup().addTo(map);
            mapRef.current = map;
          }
          setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 200);

          if (markersGroupRef.current) {
            markersGroupRef.current.clearLayers();
            const bounds = [];
            usuariasConCoordenadas.forEach(item => {
              bounds.push(item.coords);
              const html = `<div style="position:relative; width:16px; height:24px;"><svg viewBox="0 0 16 24" width="16" height="24"><line x1="8" y1="12" x2="8" y2="23" stroke="#232321" stroke-width="1.8"/><circle cx="8" cy="7" r="6" fill="#4A5028" stroke="#232321" stroke-width="1.5"/></svg></div>`;
              const icon = L.divIcon({ html, className: '', iconSize: [16, 24], iconAnchor: [8, 23] });
              const marker = L.marker(item.coords, { icon });
              marker.on('click', () => setRegionSeleccionada({ region: item.regionAgrupada, usuarias: usuariasConCoordenadas.filter(u => u.regionAgrupada === item.regionAgrupada) }));
              markersGroupRef.current.addLayer(marker);
            });
            if (bounds.length > 0 && mapRef.current) mapRef.current.fitBounds(bounds, { padding: [25, 25], maxZoom: 6 });
          }
        }, [usuariasConCoordenadas]);

        return (
          <div className="space-y-4">
            <div className="relative">
              <div id="mapa-gilda"></div>
              {regionSeleccionada && (
                <div className="absolute inset-0 z-[1000] bg-[#FFFFFF]/95 backdrop-blur-sm p-4 flex flex-col rounded-xl animate-modal text-[#232321]">
                  <div className="flex justify-between items-center border-b border-[#E8E6DF] pb-2 mb-3">
                    <h3 className="font-babydoll font-bold text-lg">{regionSeleccionada.region} ({regionSeleccionada.usuarias.length})</h3>
                    <button onClick={() => setRegionSeleccionada(null)} className="text-xs bg-white border border-[#E8E6DF] px-2.5 py-1 rounded-lg">cerrar</button>
                  </div>
                  <div className="overflow-y-auto flex-grow space-y-2">
                    {regionSeleccionada.usuarias.map((u, i) => (
                      <div key={i} className="flex justify-between items-center text-xs p-2.5 bg-white rounded-xl border border-[#E8E6DF]">
                        <span className="font-bold font-babydoll">{u.nombre}</span>
                        <span className="text-[#5C574F]">{u.ciudad || 'Sin localidad'}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="editorial-card p-4 space-y-2.5">
              <h4 className="font-babydoll text-base font-bold">Lectoras por Comunidad Autónoma</h4>
              <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pr-1">
                {regionesConteo.map(([region, cantidad], idx) => (
                  <div key={idx} className="flex justify-between items-center bg-[#FBF9F5] px-3 py-2 rounded-xl border border-[#E8E6DF] text-xs">
                    <span className="font-bold font-babydoll truncate pr-2">{region}</span>
                    <span className="bg-[#4A5028] text-white px-2 py-0.5 rounded-full text-[10px] font-bold">{cantidad}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

                      <div className="bg-[#FBF9F5] p-3.5 border-b border-[#E8E6DF] flex items-center justify-between text-xs font-bold">
                        <span>Chat de Lectoras</span>
                        <span className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                      </div>
                      <div className="flex-grow p-4 overflow-y-auto space-y-3 flex flex-col">
                        {chatMsgs.map((m, i) => (
                          <div key={i} className={`flex flex-col max-w-[85%] ${m.email === sesion.email ? 'self-end items-end' : 'self-start items-start'}`}>
                            <span className="text-[10px] text-[#5C574F] mb-0.5 px-1">{obtenerNombreReal(m.email, m.usuario)}</span>
                            <div className={`p-3 rounded-2xl text-xs leading-relaxed shadow-sm ${m.email === sesion.email ? 'bg-[#4A5028] text-white rounded-br-xs' : 'bg-[#F8F7F3] border border-[#E8E6DF] text-[#232321] rounded-bl-xs'}`}>{m.mensaje}</div>
                          </div>
                        ))}
                        <div ref={chatEndRef} />
                      </div>
                      <form onSubmit={(e) => { e.preventDefault(); if(!nuevoChat.trim())return; enviarAccion('enviar_chat', {mensaje: nuevoChat}); setNuevoChat(''); }} className="p-3 border-t border-[#E8E6DF] flex gap-2 bg-white">
                        <input type="text" value={nuevoChat} onChange={e => setNuevoChat(e.target.value)} className="flex-grow editorial-input px-3.5 py-2.5 text-xs" placeholder="Escribe un mensaje..." />
                        <button type="submit" className="editorial-btn px-4 py-2.5 text-xs"><i className="fa-solid fa-paper-plane"></i></button>
                      </form>
                    </div>
                  )}
                  {subTabComunidad === 'mapa' && <MapaGilda usuarias={usuariasClub} />}
                </div>
              )}
            </main>

            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-3 px-4 flex justify-around items-center max-w-lg mx-auto z-40 rounded-t-2xl shadow-lg">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'inicio' },
                { id: 'edificio', icon: 'fa-building', label: 'casa' },
                { id: 'habitacion', icon: 'fa-bookmark', label: 'habitación' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setSeccionApp(tab.id)} className={`flex flex-col items-center gap-1 transition-all p-1.5 ${seccionApp === tab.id ? 'text-[#232321] font-bold bg-[#F8F7F3] px-3.5 py-1.5 rounded-xl shadow-sm scale-105' : 'text-[#5C574F] hover:text-gray-800'}`}>
                  <i className={`fa-solid ${tab.icon} text-sm`}></i>
                  <span className="text-[9px] font-bold uppercase font-sans">{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
