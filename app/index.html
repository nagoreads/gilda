<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A5028" />
    <title>gilda — club de lectura</title>

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Tailwind Config adaptada para UI/UX coherente -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gilda: {
                bg: '#FBF9F5',
                card: '#FFFFFF',
                olive: '#4A5028',
                'olive-dark': '#373C1E',
                text: '#232321',
                muted: '#6B685E',
                border: '#E8E6DF',
                accent: '#FAF6E8'
              }
            },
            boxShadow: {
              'soft': '0 4px 20px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>

    <style>
      @font-face {
        font-family: 'BabyDoll';
        src: url('babydoll.ttf') format('truetype');
        font-display: swap;
      }

      body {
        font-family: 'Satoshi', sans-serif;
        /* Fondo para Desktop: diferencia el canvas de la app */
        background-color: #EAE6DF; 
        color: theme('colors.gilda.text');
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      /* Contenedor principal estilo móvil para pantallas grandes */
      .app-container {
        background-color: theme('colors.gilda.bg');
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        position: relative;
        box-shadow: 0 0 40px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
      }

      @media (min-width: 481px) {
        body { padding: 2rem 0; }
        .app-container {
          min-height: calc(100vh - 4rem);
          border-radius: 2rem;
          overflow: hidden;
          border: 8px solid white;
        }
        /* Ajuste de navegación inferior para Desktop */
        .editorial-nav {
          position: absolute !important;
        }
      }

      .font-babydoll {
        font-family: 'BabyDoll', cursive, sans-serif;
      }

      .editorial-card {
        background: theme('colors.gilda.card');
        border: 1px solid theme('colors.gilda.border');
        border-radius: 1rem; /* Consistencia en bordes */
        box-shadow: theme('boxShadow.soft');
      }

      .editorial-input {
        background: #F8F7F3;
        border: 1px solid theme('colors.gilda.border');
        border-radius: 0.75rem;
        transition: all 0.2s ease;
      }
      
      .editorial-input:focus {
        outline: none;
        background: #FFFFFF;
        border-color: theme('colors.gilda.olive');
        box-shadow: 0 0 0 3px rgba(74, 80, 40, 0.15);
      }

      /* Optimizado para áreas táctiles (min-height 44px) */
      .editorial-btn {
        background: theme('colors.gilda.text');
        color: theme('colors.gilda.bg');
        border-radius: 9999px; /* Pill shape */
        font-weight: 600;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .editorial-btn:hover, .editorial-btn:focus-visible { 
        background: theme('colors.gilda.olive'); 
        color: #FFFFFF; 
        outline: none;
      }
      .editorial-btn:active { transform: scale(0.97); }

      .editorial-nav {
        background: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(12px);
        border-top: 1px solid theme('colors.gilda.border');
        padding-bottom: max(env(safe-area-inset-bottom), 12px);
      }
    </style>
  </head>
  <body>
    <!-- Scripts de React omitidos por brevedad -->
    <div id="root" class="app-container"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // 1. MEJORA: Modal accesible con cierre al hacer clic fuera (Backdrop click)
      function ModalUpgrade({ onClose }) {
        return (
          <div 
            className="fixed inset-0 z-[99999] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]"
            onClick={onClose} // Cierra al tocar el fondo oscuro
          >
            <div 
              className="editorial-card max-w-xs w-full p-6 space-y-4 text-center relative"
              onClick={(e) => e.stopPropagation()} // Previene que el clic dentro de la tarjeta cierre el modal
            >
              <button 
                onClick={onClose} 
                aria-label="Cerrar ventana" 
                className="absolute top-3 right-3 w-10 h-10 flex items-center justify-center text-gray-400 hover:text-black rounded-full hover:bg-gray-100 transition-colors"
              >
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
              
              <div className="w-12 h-12 bg-gilda-accent rounded-full flex items-center justify-center mx-auto text-gilda-olive">
                <i className="fa-solid fa-lock text-xl"></i>
              </div>
              <div className="space-y-2">
                <h3 className="font-babydoll text-2xl font-bold text-gilda-text">Acceso restringido</h3>
                {/* MEJORA: Uso de text-sm en lugar de text-[10px] para legibilidad */}
                <p className="text-sm text-gilda-muted leading-relaxed">
                  Tu modalidad actual no incluye acceso a esta función. Actualiza tu suscripción para disfrutar de todas las funciones.
                </p>
              </div>
              <a 
                href="https://nagoreads.github.io/gilda/" 
                target="_blank" 
                className="w-full editorial-btn py-3 text-sm"
              >
                Actualizar modalidad
              </a>
            </div>
          </div>
        );
      }

      // 2. MEJORA: Corrección tipográfica y semántica de componentes menores
      function PortadaLibro({ titulo, autora, portada, size = 'normal' }) {
        // Lógica de fallback original omitida por brevedad...
        
        // Tamaños basados en rem en lugar de px fijos para mejor escalabilidad
        const sizeClasses = size === 'large' ? 'w-24 h-36' : size === 'thumb' ? 'w-12 h-16' : 'w-14 h-20';
        
        return (
          <div className={`${sizeClasses} bg-gilda-accent rounded-md shadow-sm border border-gilda-border flex flex-col justify-between p-2 overflow-hidden shrink-0`}>
             {/* Eliminadas las clases text-[7px] text-[8px]. Se usa text-xs (12px) con line-clamp para acomodar el texto legíblemente */}
             <span className="font-bold text-xs line-clamp-3 leading-tight">{titulo || 'Sin título'}</span>
          </div>
        );
      }

      // 3. ESTRUCTURA PRINCIPAL REFACTORIZADA
      function App() {
        const [seccionApp, setSeccionApp] = useState('inicio');
        const [mostrarModalUpgrade, setMostrarModalUpgrade] = useState(false);

        return (
          <div className="flex flex-col flex-grow relative w-full h-full pb-20">
            {mostrarModalUpgrade && <ModalUpgrade onClose={() => setMostrarModalUpgrade(false)} />}
            
            <header className="sticky top-0 z-30 bg-gilda-bg/90 backdrop-blur-md px-5 py-4 border-b border-gilda-border flex justify-between items-center">
                <h1 className="font-babydoll text-2xl m-0 leading-none">gilda</h1>
                <button className="w-10 h-10 rounded-full bg-white border border-gilda-border flex items-center justify-center shadow-sm hover:bg-gray-50">
                    <i className="fa-solid fa-user text-gilda-olive"></i>
                </button>
            </header>

            <main className="flex-grow p-5 space-y-6 overflow-y-auto">
              <div className="editorial-card p-6 space-y-4">
                <h2 className="text-xl font-bold font-babydoll">Bienvenida a tu habitación</h2>
                <p className="text-sm text-gilda-muted">Toda la tipografía ha sido ajustada a un mínimo de 12px (text-xs) para asegurar la accesibilidad.</p>
                <button 
                  onClick={() => setMostrarModalUpgrade(true)}
                  className="editorial-btn w-full"
                >
                  Probar Modal Accesible
                </button>
              </div>
            </main>

            <nav className="editorial-nav absolute bottom-0 left-0 right-0 py-2 px-4 flex justify-between items-center z-40 rounded-t-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'Inicio' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'Comunidad' }
              ].map(tab => (
                <button 
                  key={tab.id} 
                  onClick={() => setSeccionApp(tab.id)} 
                  className={`flex flex-col items-center justify-center gap-1 min-w-[64px] min-h-[48px] rounded-xl transition-colors ${seccionApp === tab.id ? 'text-gilda-text' : 'text-gray-400 hover:text-gray-700'}`}
                >
                  <i className={`fa-solid ${tab.icon} text-lg`}></i>
                  <span className="text-[10px] font-bold uppercase tracking-wide">{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const containerRoot = ReactDOM.createRoot(document.getElementById('root'));
      containerRoot.render(<App />);
    </script>
  </body>
</html>
