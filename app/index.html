<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>gilda — club de lectura</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW error:', err));
        });
      }
    </script>

    <!-- Fontshare: Satoshi -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React, ReactDOM y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      @font-face {
        font-family: 'BabyDoll';
        src: url('babydoll.ttf') format('truetype'),
             url('babydoll.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg-editorial: #ffffee;
        --text-main: #1c1c1a;
        --text-muted: #595750;
        --primary-olive: #3d4220;
        --border-editorial: #e6e4dc;
      }

      body {
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-editorial);
        color: var(--text-main);
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .font-babydoll {
        font-family: 'BabyDoll', cursive, sans-serif;
        letter-spacing: 0.5px;
      }

      .editorial-card {
        background: #FFFFFF;
        color: var(--text-main);
        border: 1px solid var(--border-editorial);
        border-radius: 20px;
        box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.03), 0 1px 2px 0 rgba(0, 0, 0, 0.02);
      }

      .editorial-input {
        background: #faf9f5;
        border: 1px solid var(--border-editorial);
        border-radius: 12px;
        color: var(--text-main);
        font-family: 'Satoshi', sans-serif;
        font-size: 0.875rem;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-input:focus {
        outline: none;
        background: #FFFFFF;
        border-color: var(--primary-olive);
        box-shadow: 0 0 0 3px rgba(61, 66, 32, 0.1);
      }

      .editorial-btn {
        background: var(--text-main);
        color: var(--bg-editorial);
        border-radius: 20px;
        font-weight: 600;
        font-family: 'Satoshi', sans-serif;
        letter-spacing: 0.02em;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .editorial-btn:hover { 
        background: var(--primary-olive); 
        color: #FFFFFF; 
        transform: translateY(-1px);
      }

      .editorial-nav {
        background: rgba(255, 255, 238, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border-editorial);
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }

      .editorial-nav span {
        font-family: 'Satoshi', sans-serif !important;
        font-weight: 600;
      }

      .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .estanteria-madera {
        background: linear-gradient(to bottom, #f7f3e8 0%, #ede6d5 100%);
        border-bottom: 14px solid #c9bea3;
        border-radius: 8px 8px 12px 12px;
        box-shadow: inset 0 3px 8px rgba(0,0,0,0.05), 0 12px 24px rgba(0,0,0,0.04);
        position: relative;
      }

      .lomo-libro {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      }
      .lomo-libro:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 16px 30px rgba(0,0,0,0.15);
      }

      @keyframes parpadeoVela {
        0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
        50% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      }
      .vela-flama { animation: parpadeoVela 1.5s infinite ease-in-out; transform-origin: bottom center; }

      @keyframes subirHumo {
        0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
        100% { transform: translateY(-14px) scaleX(1.4); opacity: 0; }
      }
      .humo-taza { animation: subirHumo 2s infinite ease-out; }

      #mapa-gilda { height: 280px; width: 100%; border-radius: 16px; border: 1px solid var(--border-editorial); z-index: 1; }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d4d0bc; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root" class="w-full flex flex-col items-center"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbyrxPTA7Bs5Q3Tr-eftF6DkI45dq1WHLRFge1Mk864VJjhq9av0BOozCsKw2ywUrsoc/exec';
      const URL_CSV_USUARIAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=0&single=true&output=csv';
      const URL_CSV_CAPITULOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1060479353&single=true&output=csv';
      const URL_CSV_COMENTARIOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1626426174&single=true&output=csv';
      const URL_CSV_CAFECITOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1040100079&single=true&output=csv';
      const URL_CSV_LECTURAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1676533026&single=true&output=csv';
      const URL_CSV_CHAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=456334295&single=true&output=csv';
      const URL_CSV_PROPUESTAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1701531859&single=true&output=csv';
      const URL_CSV_VOTACION_CAFE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=933058441&single=true&output=csv';
      const URL_CSV_LECTURAS_PERSONALES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1089788162&single=true&output=csv';
      const URL_CSV_CALENDARIO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=2016923063&single=true&output=csv';

      const FRASES_INICIALES = [
        "Un lector vive mil vidas antes de morir. El que no lee vive solo una.",
        "La depresión... como la manifestación de algo que no se puede reducir a lo anecdótico porque es estructural y colectivo.",
        "No hay barrera, cerradura ni cerrojo que puedas imponer a la libertad di mi mente."
      ];

      const formatoOracion = (texto) => {
        if (!texto) return '';
        const str = texto.toString().trim().toLowerCase();
        return str.charAt(0).toUpperCase() + str.slice(1);
      };

      function ModalUpgrade({ onClose }) {
        return (
          <div className="fixed inset-0 z-[99999] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
            <div className="editorial-card max-w-sm w-full p-6 space-y-4 text-center bg-white relative">
              <button onClick={onClose} className="absolute top-3 right-3 text-gray-400 hover:text-black">
                <i className="fa-solid fa-xmark text-sm"></i>
              </button>
              <div className="w-12 h-12 bg-[#ffffee] rounded-full flex items-center justify-center mx-auto text-[#3d4220] border border-[#e6e4dc]">
                <i className="fa-solid fa-lock text-lg"></i>
              </div>
              <div className="space-y-1">
                <h3 className="font-babydoll text-xl font-bold">Acceso restringido</h3>
                <p className="text-xs text-[#595750] font-sans leading-relaxed">
                  Tu modalidad actual no incluye acceso a esta función. Actualiza tu suscripción para acceder a todas las secciones de gilda.
                </p>
              </div>
              <a href="https://nagoreads.github.io/gilda/" target="_blank" rel="noopener noreferrer" className="block w-full editorial-btn py-2.5 text-xs text-center font-semibold">
                Actualizar modalidad
              </a>
            </div>
          </div>
        );
      }

      function BuscadorLibros({ placeholder, valor, setValor, onSelectLibro }) {
        const [sugerencias, setSugerencias] = useState([]);
        const [buscando, setBuscando] = useState(false);
        const [mostrarDropdown, setMostrarDropdown] = useState(false);

        useEffect(() => {
          if (!valor || valor.trim().length < 2) {
            setSugerencias([]);
            setMostrarDropdown(false);
            return;
          }
          const timer = setTimeout(async () => {
            setBuscando(true);
            try {
              const query = encodeURIComponent(valor.trim());
              const [resGoogle, resOpenLib] = await Promise.allSettled([
                fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=8&printType=books&langRestrict=es`),
                fetch(`https://openlibrary.org/search.json?q=${query}&limit=6&language=spa`)
              ]);
              let listaCombinada = [];
              if (resGoogle.status === 'fulfilled' && resGoogle.value.ok) {
                const dataG = await resGoogle.value.json();
                if (dataG.items) {
                  dataG.items.forEach(item => {
                    const info = item.volumeInfo || {};
                    let thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '';
                    if (thumb) {
                      thumb = thumb.replace('http:', 'https:').replace('&edge=curl', '');
                    }
                    listaCombinada.push({ 
                      titulo: info.title || '', 
                      autora: info.authors ? info.authors.join(', ') : '', 
                      portada: thumb 
                    });
                  });
                }
              }
              if (resOpenLib.status === 'fulfilled' && resOpenLib.value.ok) {
                const dataOL = await resOpenLib.value.json();
                if (dataOL.docs) {
                  dataOL.docs.forEach(doc => {
                    listaCombinada.push({ 
                      titulo: doc.title || '', 
                      autora: doc.author_name ? doc.author_name.join(', ') : '', 
                      portada: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : '' 
                    });
                  });
                }
              }
              const unicos = [];
              const titulosVistos = new Set();
              listaCombinada.forEach(item => {
                const tLimpio = item.titulo.toLowerCase().trim();
                if (tLimpio && !titulosVistos.has(tLimpio)) { 
                  titulosVistos.add(tLimpio); 
                  unicos.push(item); 
                }
              });
              setSugerencias(unicos.slice(0, 8));
              setMostrarDropdown(unicos.length > 0);
            } catch (err) { console.error(err); } finally { setBuscando(false); }
          }, 300);
          return () => clearTimeout(timer);
        }, [valor]);

        return (
          <div className="relative w-full">
            <div className="relative flex items-center">
              <input type="text" placeholder={placeholder} value={valor} onChange={(e) => { setValor(e.target.value); setMostrarDropdown(true); }} className="w-full editorial-input p-2.5 text-xs italic pr-8" />
              {buscando && <i className="fa-solid fa-spinner animate-spin absolute right-2.5 text-xs text-[#3d4220]"></i>}
            </div>
            {mostrarDropdown && sugerencias.length > 0 && (
              <div className="absolute top-full left-0 right-0 z-50 bg-[#FFFFFF] border border-[#e6e4dc] rounded-b-xl shadow-xl max-h-56 overflow-y-auto mt-1">
                {sugerencias.map((item, idx) => (
                  <div key={idx} onClick={() => { onSelectLibro(item); setMostrarDropdown(false); }} className="flex items-center gap-2.5 p-2 hover:bg-[#ffffee] cursor-pointer border-b border-[#e6e4dc] last:border-0 text-left">
                    {item.portada ? <img src={`https://images.weserv.nl/?url=${encodeURIComponent(item.portada)}&w=100&output=jpg`} alt="" className="w-7 h-10 object-cover rounded shrink-0 shadow-sm" /> : <div className="w-7 h-10 bg-[#faf9f5] rounded shrink-0 flex items-center justify-center text-[7px] text-[#595750] border border-[#e6e4dc]">Sin foto</div>}
                    <div className="overflow-hidden">
                      <p className="text-sm font-bold text-[#1c1c1a] truncate leading-tight font-babydoll">{item.titulo}</p>
                      <p className="text-[10px] text-[#595750] italic truncate font-sans">{item.autora || ''}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PortadaLibro({ titulo, autora, autor, escritora, portada, cover, image, size = 'normal' }) {
        const [errorImg, setErrorImg] = useState(false);
        const [portadaDinamica, setPortadaDinamica] = useState('');
        const [autoraEncontrada, setAutoraEncontrada] = useState('');
        const [buscandoOnline, setBuscandoOnline] = useState(false);

        const sizeClasses = size === 'large' ? 'w-24 h-36 text-xs' : size === 'grid' ? 'w-16 h-24 text-[9px]' : size === 'thumb' ? 'w-10 h-14 text-[8px]' : 'w-12 h-16 text-[8px]';

        const portadaOriginal = portada || cover || image || '';
        const tituloFinal = titulo || 'Sin título';
        
        const autoraCruda = autora || autor || escritora || '';
        const autoraFinal = useMemo(() => {
          if (!autoraCruda || typeof autoraCruda !== 'string') return '';
          const aLimpia = autoraCruda.trim();
          const lower = aLimpia.toLowerCase();
          if (['autora', 'autor', 'desconocida', 'escritora', 'undefined', 'null'].includes(lower)) {
            return '';
          }
          return aLimpia;
        }, [autoraCruda]);

        useEffect(() => {
          let activo = true;
          if ((!portadaOriginal || errorImg || !autoraFinal) && tituloFinal && tituloFinal !== 'Sin título' && !buscandoOnline && !portadaDinamica) {
            setBuscandoOnline(true);
            const query = encodeURIComponent(`${tituloFinal} ${autoraFinal}`);
            
            Promise.allSettled([
              fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1&langRestrict=es`).then(r => r.json()),
              fetch(`https://openlibrary.org/search.json?q=${query}&limit=1&language=spa`).then(r => r.json())
            ]).then(results => {
              if (!activo) return;
              let imgEncontrada = '';
              let autEncontrada = '';

              if (results[0].status === 'fulfilled') {
                const itemG = results[0].value.items?.[0]?.volumeInfo;
                if (itemG) {
                  if (itemG.imageLinks?.thumbnail || itemG.imageLinks?.smallThumbnail) {
                    imgEncontrada = itemG.imageLinks.thumbnail || itemG.imageLinks.smallThumbnail;
                  }
                  if (itemG.authors && itemG.authors.length > 0) {
                    autEncontrada = itemG.authors.join(', ');
                  }
                }
              }

              if (!imgEncontrada && results[1].status === 'fulfilled') {
                const docOL = results[1].value.docs?.[0];
                if (docOL) {
                  if (docOL.cover_i) {
                    imgEncontrada = `https://covers.openlibrary.org/b/id/${docOL.cover_i}-L.jpg`;
                  }
                  if (docOL.author_name && docOL.author_name.length > 0) {
                    autEncontrada = docOL.author_name.join(', ');
                  }
                }
              }

              if (imgEncontrada) {
                setPortadaDinamica(imgEncontrada.replace('http:', 'https:'));
              }
              if (autEncontrada && !autoraFinal) {
                setAutoraEncontrada(autEncontrada);
              }
            }).catch(() => {}).finally(() => {
              if (activo) setBuscandoOnline(false);
            });
          }
          return () => { activo = false; };
        }, [portadaOriginal, errorImg, tituloFinal, autoraFinal]);

        const urlSegura = useMemo(() => {
          const pFinal = portadaOriginal || portadaDinamica;
          if (!pFinal || typeof pFinal !== 'string') return '';
          let p = pFinal.trim();
          
          if (p.startsWith('data:image')) return p;

          if (p.startsWith('http://')) {
            p = p.replace('http://', 'https://');
          }

          if (p.startsWith('https://')) {
            return `https://images.weserv.nl/?url=${encodeURIComponent(p)}&w=300&output=jpg`;
          }
          
          return '';
        }, [portadaOriginal, portadaDinamica]);

        const autoraMostrar = autoraFinal || autoraEncontrada || '';

        const colorEditorialFallback = useMemo(() => {
          let hash = 0;
          for (let i = 0; i < tituloFinal.length; i++) { hash = tituloFinal.charCodeAt(i) + ((hash << 5) - hash); }
          const matices = ['#3d4220', '#34381b', '#523021', '#232820', '#633528', '#324854', '#543d30', '#3d3054', '#4a3429', '#324235'];
          return matices[Math.abs(hash) % matices.length];
        }, [tituloFinal]);

        if (urlSegura !== '' && !errorImg) {
          return (
            <img 
              src={urlSegura} 
              alt={tituloFinal} 
              onError={() => setErrorImg(true)} 
              className={`${sizeClasses} object-cover rounded shadow-sm shrink-0 bg-gray-100`} 
            />
          );
        }

        return (
          <div style={{ backgroundColor: colorEditorialFallback }} className={`${sizeClasses} text-[#ffffee] p-2 rounded shadow-sm border border-white/20 shrink-0 flex flex-col justify-between overflow-hidden text-left relative`}>
            <div className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-white/30"></div>
            <span className="font-bold tracking-tight line-clamp-3 leading-tight font-babydoll drop-shadow-sm" style={{ fontSize: size === 'large' ? '11px' : '9px' }}>
              {tituloFinal}
            </span>
            <span className="text-[7px] text-white/80 uppercase tracking-wider truncate font-sans">
              {autoraMostrar}
            </span>
          </div>
        );
      }

      function LomoLibroEstanteria({ item, onClick }) {
        const generarColorEditorial = (texto) => {
          let hash = 0;
          for (let i = 0; i < texto.length; i++) { hash = texto.charCodeAt(i) + ((hash << 5) - hash); }
          const matices = ['#3d4220', '#34381b', '#523021', '#232820', '#633528', '#324854', '#543d30', '#3d3054', '#4a3429', '#324235', '#523c2a', '#2c363d', '#422e2e', '#3a2e4a', '#323d3e'];
          return matices[Math.abs(hash) % matices.length];
        };

        const tituloLibro = item.libro || item.titulo || 'libro';

        return (
          <div onClick={onClick} style={{ backgroundColor: generarColorEditorial(tituloLibro) }} className="lomo-libro text-[#ffffee] w-12 h-36 shrink-0 cursor-pointer shadow-md relative rounded-t-sm overflow-hidden flex flex-col justify-start p-2 border-t border-white/20" title={`${tituloLibro} — ${item.autora || ''}`}>
            <div className="absolute top-1 left-1.5 w-1 h-2 rounded-full bg-white/20"></div>
            <div className="flex flex-col h-full justify-start pt-3">
              <span className="font-babydoll font-bold text-[9px] leading-tight text-left text-white drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)] overflow-hidden" style={{writingMode: 'vertical-rl', textOrientation: 'mixed', maxHeight: '110px'}}>
                {tituloLibro}
              </span>
            </div>
          </div>
        );
      }

      function IlustracionDecoracion({ tipo }) {
        if (tipo === 'monstera') return (
          <svg width="42" height="46" viewBox="0 0 42 46" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">

      function AvatarUsuaria({ foto, nombre, sizeClass = "w-9 h-9", textClass = "text-lg", editable = false, onFotoChange = () => {} }) {
        const [errorImg, setErrorImg] = useState(false);
        const fileInputRef = useRef(null);

        const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setErrorImg(false);
              onFotoChange(reader.result);
            };
            reader.readAsDataURL(file);
          }
        };

        const renderContent = () => {
          if (foto && foto.trim() !== '' && !errorImg) {
            return <img src={foto} alt={nombre || 'Lector(a)'} onError={() => setErrorImg(true)} className={`${sizeClass} rounded-full object-cover border border-[#e6e4dc] shrink-0`} />;
          }
          return <div className={`${sizeClass} rounded-full bg-[#faf9f5] border border-[#e6e4dc] flex items-center justify-center font-babydoll ${textClass} text-[#3d4220] shrink-0 font-bold`}>{(nombre || 'L').charAt(0).toUpperCase()}</div>;
        };

        if (editable) {
          return (
            <div className="relative group cursor-pointer" onClick={() => fileInputRef.current && fileInputRef.current.click()} title="Cambiar foto de perfil desde tu galería">
              {renderContent()}
              <div className="absolute inset-0 rounded-full bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                <i className="fa-solid fa-camera text-white text-xs"></i>
              </div>
              <input type="file" ref={fileInputRef} accept="image/*" onChange={handleFileChange} className="hidden" />
            </div>
          );
        }

        return renderContent();
      }

      function CalendarioInteractivo({ eventos }) {
        const [fechaActual, setFechaActual] = useState(new Date());

        const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        const nombresMeses = [
          'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
        ];

        const anio = fechaActual.getFullYear();
        const mes = fechaActual.getMonth();

        const primerDiaMes = new Date(anio, mes, 1);
        const ultimoDiaMes = new Date(anio, mes + 1, 0);

        let primerDiaSemanaIndice = primerDiaMes.getDay() - 1;
        if (primerDiaSemanaIndice === -1) primerDiaSemanaIndice = 6;

        const totalDiasMes = ultimoDiaMes.getDate();

        const hoy = new Date();
        const esMesActual = hoy.getFullYear() === anio && hoy.getMonth() === mes;

        const parsearFechaEvento = (strFecha) => {
          if (!strFecha) return null;
          const s = strFecha.toString().trim().toLowerCase();

          if (s.includes('-') || s.includes('/')) {
            const partes = s.split(/[\/-]/);
            if (partes.length >= 2) {
              if (partes[0].length === 4) {
                const y = parseInt(partes[0], 10);
                const m = parseInt(partes[1], 10) - 1;
                const d = parseInt(partes[2], 10);
                if (!isNaN(d) && !isNaN(m)) return { dia: d, mes: m, anio: y };
              } else {
                const d = parseInt(partes[0], 10);
                const m = parseInt(partes[1], 10) - 1;
                const y = partes[2] ? parseInt(partes[2], 10) : anio;
                if (!isNaN(d) && !isNaN(m)) return { dia: d, mes: m, anio: y };
              }
            }
          }

          const matchDia = s.match(/^(\d{1,2})/);
          if (matchDia) {
            const diaNum = parseInt(matchDia[1], 10);
            const mapaMeses = {
              ene: 0, enero: 0,
              feb: 1, febrero: 1,
              mar: 2, marzo: 2,
              abr: 3, abril: 3,
              may: 4, mayo: 4,
              jun: 5, junio: 5,
              jul: 6, julio: 6,
              ago: 7, agosto: 7,
              sep: 8, sept: 8, septiembre: 8,
              oct: 9, octubre: 9,
              nov: 10, noviembre: 10,
              dic: 11, diciembre: 11
            };

            for (const [clave, mesIndex] of Object.entries(mapaMeses)) {
              if (s.includes(clave)) {
                const matchAnio = s.match(/\b(20\d{2})\b/);
                const anioParsed = matchAnio ? parseInt(matchAnio[1], 10) : anio;
                return { dia: diaNum, mes: mesIndex, anio: anioParsed };
              }
            }
          }
          return null;
        };

        const eventosDelMes = useMemo(() => {
          const mapa = {};
          (eventos || []).forEach(ev => {
            const est = (ev.estado || '').toLowerCase();
            if (est === 'pendiente' || est === 'por definir') return;

            const valFecha = ev.fecha || ev.dia || ev.date || ev.fecha_evento;
            const parsed = parsearFechaEvento(valFecha);

            if (parsed && parsed.mes === mes && parsed.anio === anio) {
              if (!mapa[parsed.dia]) mapa[parsed.dia] = [];
              mapa[parsed.dia].push(ev);
            }
          });
          return mapa;
        }, [eventos, mes, anio]);

        const mesAnterior = () => setFechaActual(new Date(anio, mes - 1, 1));
        const mesSiguiente = () => setFechaActual(new Date(anio, mes + 1, 1));

        const celdas = [];
        for (let i = 0; i < primerDiaSemanaIndice; i++) {
          celdas.push(<div key={`empty-${i}`} className="h-9"></div>);
        }

        for (let dia = 1; dia <= totalDiasMes; dia++) {
          const esHoy = esMesActual && hoy.getDate() === dia;
          const evs = eventosDelMes[dia] || [];
          const tieneCafecito = evs.some(e => {
            const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
            return t.includes('cafecito') || t.includes('café');
          });
          const tieneComentario = evs.some(e => {
            const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
            return t.includes('comentario') || t.includes('libro');
          });
          const tieneRecordatorio = evs.some(e => {
            const t = (e.evento || e.titulo || e.nombre || '').toLowerCase();
            return t.includes('votar') || t.includes('recordatorio') || t.includes('último día');
          });

          celdas.push(
            <div
              key={dia}
              className={`h-9 flex flex-col items-center justify-center rounded-xl relative transition-all text-xs font-sans ${
                esHoy ? 'bg-[#3d4220] text-white font-bold shadow-sm' : 'hover:bg-[#faf9f5] text-[#1c1c1a]'
              }`}
            >
              <span>{dia}</span>
              {evs.length > 0 && (
                <div className="flex gap-0.5 mt-0.5">
                  {tieneCafecito && (
                    <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-amber-300' : 'bg-amber-600'}`}></span>
                  )}
                  {tieneComentario && (
                    <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-white' : 'bg-[#3d4220]'}`}></span>
                  )}
                  {tieneRecordatorio && (
                    <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-purple-300' : 'bg-purple-600'}`}></span>
                  )}
                  {!tieneCafecito && !tieneComentario && !tieneRecordatorio && (
                    <span className={`w-1.5 h-1.5 rounded-full ${esHoy ? 'bg-white' : 'bg-[#3d4220]'}`}></span>
                  )}
                </div>
              )}
            </div>
          );
        }

        return (
          <div className="space-y-3">
            <div className="flex justify-between items-center bg-[#ffffee] p-2.5 rounded-xl border border-[#e6e4dc]">
              <button onClick={mesAnterior} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white text-[#1c1c1a] transition-colors">
                <i className="fa-solid fa-chevron-left text-xs"></i>
              </button>
              <h4 className="font-babydoll text-base font-bold text-[#1c1c1a]">
                {nombresMeses[mes]} {anio}
              </h4>
              <button onClick={mesSiguiente} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white text-[#1c1c1a] transition-colors">
                <i className="fa-solid fa-chevron-right text-xs"></i>
              </button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center font-sans text-[10px] uppercase font-semibold text-[#595750] pb-1 border-b border-[#e6e4dc]">
              {diasSemana.map((d, i) => (
                <div key={i}>{d}</div>
              ))}
            </div>

            <div className="grid grid-cols-7 gap-1 text-center">
              {celdas}
            </div>

            <div className="flex items-center justify-center gap-3 pt-2 text-[10px] font-sans text-[#595750] border-t border-[#e6e4dc] flex-wrap">
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#3d4220]"></span>
                <span>Comentarios</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-amber-600"></span>
                <span>Cafecito</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-purple-600"></span>
                <span>Recordatorio</span>
              </div>
            </div>
          </div>
        );
      }

                      const cCap = String(c.capitulo || '').trim().toLowerCase();
                      const padreId = String(c.parent_id || '').trim();
                      const esPrincipal = !padreId || padreId === '' || padreId === 'undefined' || padreId === 'null';
                      const coincide = !cCap || cCap === identificadorCap || cCap === String(cap.titulo || '').trim().toLowerCase() || cCap.includes(String(i + 1));
                      return coincide && esPrincipal;
                    });

                    return (
                      <div key={i} className="editorial-card p-5 space-y-4">
                        <div className="flex justify-between items-center">
                          <h3 className="font-babydoll text-2xl font-bold">{cap.titulo}</h3>
                          <span className="text-[10px] text-[#595750] font-sans font-semibold">pág. {paginaMinima}</span>
                        </div>
                        {desbloqueado ? (
                          <div className="space-y-4">
                            <p className="text-xs text-gray-700 leading-relaxed whitespace-pre-line font-sans">{cap.descripcion || cap.contenido}</p>

                            <div className="pt-4 border-t border-[#e6e4dc] space-y-3">
                              <h4 className="font-babydoll text-sm font-bold">Comentarios de lectoras</h4>
                              
                              <div className="space-y-3">
                                {comentariosCapitulo.length === 0 ? (
                                  <p className="text-[11px] text-[#595750] italic font-sans">Aún no hay comentarios en este capítulo. ¡Sé la primera en escribir!</p>
                                ) : (
                                  comentariosCapitulo.map((com, cIdx) => {
                                    const idComentario = String(com.id || '').trim();
                                    
                                    const respuestasCom = comentarios.filter(r => {
                                      const rPadre = String(r.parent_id || '').trim();
                                      return rPadre && idComentario && rPadre === idComentario;
                                    });

                                    const nombreAutorComentario = obtenerNombreReal(com.autora, com.autora);
                                    const textoComTxt = com.texto || '';

                                    return (
                                      <div key={cIdx} className="bg-[#ffffee] p-3 rounded-xl border border-[#e6e4dc] text-xs space-y-2">
                                        <div className="flex justify-between items-center">
                                          <span className="font-bold font-sans text-[#3d4220]">{nombreAutorComentario}</span>
                                          <span className="text-[9px] text-[#595750] font-sans">{com.fecha || ''}</span>
                                        </div>
                                        <p className="text-gray-700 font-sans">{textoComTxt}</p>

                                        {!modalidadLimpia.includes('cotilla') && (
                                          <div className="flex justify-end">
                                            <button onClick={() => setRespondiendoA(respondiendoA === idComentario ? null : idComentario)} className="text-[10px] text-[#3d4220] font-bold font-sans hover:underline">
                                              {respondiendoA === idComentario ? 'Cancelar' : 'Responder'}
                                            </button>
                                          </div>
                                        )}

                                        {respuestasCom.length > 0 && (
                                          <div className="pl-3 mt-2 border-l-2 border-[#d4cfbc] space-y-2">
                                            {respuestasCom.map((resp, rIdx) => {
                                              const nombreAutorRespuesta = obtenerNombreReal(resp.autora, resp.autora);
                                              const textoRespTxt = resp.texto || '';
                                              return (
                                                <div key={rIdx} className="bg-white p-2 rounded-lg border border-[#e6e4dc] text-xs space-y-1">
                                                  <div className="flex justify-between items-center">
                                                    <span className="font-bold font-sans text-[#3d4220]">{nombreAutorRespuesta}</span>
                                                    <span className="text-[9px] text-[#595750] font-sans">{resp.fecha || ''}</span>
                                                  </div>
                                                  <p className="text-gray-700 font-sans">{textoRespTxt}</p>
                                                </div>
                                              );
                                            })}
                                          </div>
                                        )}

                                        {respondiendoA === idComentario && !modalidadLimpia.includes('cotilla') && (
                                          <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const txtResp = textoRespuesta[idComentario];
                                            if (!txtResp || !txtResp.trim()) return;
                                            
                                            const nombreActual = nombreUsuarioPersonalizado || sesion.nombre;
                                            const nuevaRespObj = { 
                                              capitulo: identificadorCap, 
                                              parent_id: idComentario, 
                                              autora: nombreActual, 
                                              texto: txtResp, 
                                              fecha: 'Justo ahora' 
                                            };
                                            setComentarios([...comentarios, nuevaRespObj]);
                                            enviarAccion('comentar_capitulo', { capitulo: identificadorCap, parent_id: idComentario, comentario: txtResp });
                                            setTextoRespuesta({ ...textoRespuesta, [idComentario]: '' });
                                            setRespondiendoA(null);
                                            mostrarToast('Respuesta enviada');
                                          }} className="flex gap-2 pt-2">
                                            <input 
                                              type="text" 
                                              placeholder="Escribe tu respuesta..." 
                                              value={textoRespuesta[idComentario] || ''} 
                                              onChange={(e) => setTextoRespuesta({ ...textoRespuesta, [idComentario]: e.target.value })} 
                                              className="flex-grow editorial-input px-2.5 py-1.5 text-xs bg-white" 
                                            />
                                            <button type="submit" className="editorial-btn px-2.5 py-1 text-[10px]">Enviar</button>
                                          </form>
                                        )}
                                      </div>
                                    );
                                  })
                                )}
                              </div>

                              {modalidadLimpia.includes('cotilla') ? (
                                <div className="p-3 bg-[#faf9f5] border border-[#e6e4dc] rounded-xl text-center">
                                  <p className="text-[11px] text-[#595750] font-sans">
                                    Tu modalidad actual es de solo lectura en comentarios. <button onClick={() => setMostrarModalUpgrade(true)} className="text-[#3d4220] font-bold underline">Actualiza tu suscripción</button> para participar.
                                  </p>
                                </div>
                              ) : (
                                <form onSubmit={(e) => {
                                  e.preventDefault();
                                  const clave = cap.id || cap.titulo;
                                  const txt = textoComentario[clave];
                                  if (!txt || !txt.trim()) return;
                                  
                                  const nombreActual = nombreUsuarioPersonalizado || sesion.nombre;
                                  const nuevoCom = { 
                                    capitulo: identificadorCap, 
                                    parent_id: '',
                                    autora: nombreActual, 
                                    texto: txt, 
                                    fecha: 'Justo ahora' 
                                  };
                                  setComentarios([...comentarios, nuevoCom]);

                                  enviarAccion('comentar_capitulo', { capitulo: identificadorCap, comentario: txt });
                                  setTextoComentario({ ...textoComentario, [cap.id || cap.titulo]: '' });
                                  mostrarToast('Comentario enviado');
                                }} className="flex gap-2 pt-1">
                                  <input 
                                    type="text" 
                                    placeholder="Escribe tu reflexión sobre este capítulo..." 
                                    value={textoComentario[cap.id || cap.titulo] || ''} 
                                    onChange={(e) => setTextoComentario({ ...textoComentario, [cap.id || cap.titulo]: e.target.value })} 
                                    className="flex-grow editorial-input px-3 py-2 text-xs" 
                                  />
                                  <button type="submit" className="editorial-btn px-3 text-xs">Comentar</button>
                                </form>
                              )}
                            </div>
                          </div>
                        ) : (
                          <div className="p-4 bg-[#ffffee] border border-[#e6e4dc] rounded-xl text-center space-y-2">
                            <i className="fa-solid fa-lock text-[#595750] text-sm"></i>
                            <p className="text-xs text-[#595750] font-sans">Capítulo bloqueado. Necesitas llegar a la página <b>{paginaMinima}</b> (vas por la {miPagina}).</p>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {seccionApp === 'comunidad' && (
                <div className="space-y-4 fade-in">
                  <div className="flex bg-[#faf9f5] p-1 rounded-xl text-[10px] uppercase font-bold text-center border border-[#e6e4dc] font-sans">
                    <button onClick={() => setSubTabComunidad('chat')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'chat' ? 'bg-[#1c1c1a] text-[#ffffee]' : 'text-[#595750]'}`}>Chat</button>
                    <button onClick={() => setSubTabComunidad('mapa')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'mapa' ? 'bg-[#1c1c1a] text-[#ffffee]' : 'text-[#595750]'}`}>Mapa ({usuariasClub.length})</button>
                    <button onClick={() => setSubTabComunidad('archivo')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'archivo' ? 'bg-[#1c1c1a] text-[#ffffee]' : 'text-[#595750]'}`}>Archivo</button>
                    <button onClick={() => setSubTabComunidad('buzon')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'buzon' ? 'bg-[#1c1c1a] text-[#ffffee]' : 'text-[#595750]'}`}>Buzón</button>
                  </div>

                  {subTabComunidad === 'chat' && (
                    <div className="editorial-card h-[480px] flex flex-col justify-between relative overflow-hidden">
                      <div className="bg-[#ffffee] p-3.5 border-b border-[#e6e4dc] flex items-center justify-between text-xs rounded-t-2xl font-sans font-bold">
                        <span>Chat de Lectoras</span>
                        <span className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                      </div>
                      <div className="flex-grow p-4 overflow-y-auto space-y-3 flex flex-col">
                        {chatMsgs.map((m, i) => {
                          const nombreAutorChat = obtenerNombreReal(m.email, m.usuario || m.usuaria);
                          const usuarioMsg = nombreAutorChat.toLowerCase().trim();
                          const miNombre = (nombreUsuarioPersonalizado || sesion.nombre || '').toLowerCase().trim();
                          const esMia = usuarioMsg === miNombre;
                          return (
                            <div key={i} className={`flex flex-col max-w-[85%] ${esMia ? 'self-end items-end' : 'self-start items-start'}`}>
                              <span className="text-[10px] text-[#595750] font-sans mb-0.5 px-1">{nombreAutorChat}</span>
                              <div className={`p-3 rounded-2xl text-xs leading-relaxed shadow-sm font-sans ${esMia ? 'bg-[#3d4220] text-white rounded-br-xs' : 'bg-[#faf9f5] border border-[#e6e4dc] text-[#1c1c1a] rounded-bl-xs'}`}>
                                {m.mensaje}
                              </div>
                            </div>
                          );
                        })}
                        <div ref={chatEndRef} />
                      </div>
                      <form onSubmit={(e) => { e.preventDefault(); if(!nuevoChat.trim())return; enviarAccion('enviar_chat', {mensaje: nuevoChat}); setNuevoChat(''); }} className="p-3 border-t border-[#e6e4dc] flex gap-2 bg-white">
                        <input type="text" value={nuevoChat} onChange={e => setNuevoChat(e.target.value)} className="flex-grow editorial-input px-3.5 py-2.5 text-xs" placeholder="Escribe un mensaje al club..." />
                        <button type="submit" className="editorial-btn px-4 py-2.5 text-xs"><i className="fa-solid fa-paper-plane"></i></button>
                      </form>
                    </div>
                  )}

                  {subTabComunidad === 'mapa' && (
                    <div className="editorial-card p-4 space-y-3">
                      <div className="flex justify-between items-center text-xs px-1">
                        <span className="font-babydoll text-xl font-bold">Mapa Global de Lectoras</span>
                        <span className="text-[10px] text-[#3d4220] font-bold font-sans">{usuariasClub.length} socia(s)</span>
                      </div>
                      <MapaGilda usuarias={usuariasClub} />
                    </div>
                  )}

                  {subTabComunidad === 'archivo' && (
                    <div className="space-y-4">
                      <div className="editorial-card p-5 space-y-3">
                        <h3 className="font-babydoll text-xl font-bold">Proponer Nueva Lectura</h3>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          const tit = nuevaPropuestaTitulo?.trim();
                          if (!tit) return;
                          const nueva = { titulo: tit, autora: nuevaPropuestaAutora?.trim() || '', votos: '1', votantes: sesion.email.toLowerCase(), portada: nuevaPropuestaPortada?.trim() || '' };
                          setPropuestas([...propuestas, nueva]);
                          enviarAccion('propuesta', nueva);
                          setNuevaPropuestaTitulo(''); setNuevaPropuestaAutora(''); setNuevaPropuestaPortada('');
                          mostrarToast('Propuesta añadida.');
                        }} className="space-y-2">
                          <BuscadorLibros placeholder="Título del libro o autora..." valor={nuevaPropuestaTitulo} setValor={setNuevaPropuestaTitulo} onSelectLibro={(l) => { setNuevaPropuestaTitulo(l.titulo); setNuevaPropuestaAutora(l.autora); setNuevaPropuestaPortada(l.portada); }} />
                          <input type="text" placeholder="Autora..." value={nuevaPropuestaAutora || ''} onChange={e=>setNuevaPropuestaAutora(e.target.value)} className="w-full editorial-input p-2.5 text-xs" />
                          <button type="submit" className="w-full editorial-btn py-2.5 text-xs">Añadir propuesta</button>
                        </form>
                      </div>

                      <div className="editorial-card p-5">
                        <div className="flex justify-between items-center mb-3">
                          <h3 className="font-babydoll text-xl font-bold">Votación del Mes</h3>
                          <span className="text-[10px] text-[#595750] font-sans uppercase">Top 3 finalistas</span>
                        </div>
                        <div className="space-y-3">
                          {[...propuestas]
                            .sort((a, b) => (Number(b.votos) || 0) - (Number(a.votos) || 0))
                            .slice(0, 3)
                            .map((p, i) => (
                              <div key={i} className="flex gap-3 border border-[#e6e4dc] p-3.5 rounded-xl bg-[#ffffee]">
                                <PortadaLibro titulo={p.titulo} autora={p.autora} portada={p.portada} size="small" />
                                <div className="flex flex-col justify-between w-full">
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-[10px] font-bold text-[#3d4220] font-sans">#{i + 1}</span>
                                      <h4 className="font-bold text-base leading-tight font-babydoll">{p.titulo}</h4>
                                    </div>
                                    <p className="text-[10px] text-[#595750] italic font-sans">{p.autora}</p>
                                  </div>
                                  <button onClick={()=>{
                                    const clon = [...propuestas]; const item = clon.find(x => x.titulo === p.titulo); if(!item) return;
                                    let arr = (item.votantes||"").toLowerCase().split(',').map(v=>v.trim()).filter(v=>v);
                                    if(arr.includes(sesion.email.toLowerCase())){ arr = arr.filter(v=>v!==sesion.email.toLowerCase()); item.votos = Math.max(0, Number(item.votos||0) - 1); } else { arr.push(sesion.email.toLowerCase()); item.votos = Number(item.votos||0) + 1; }
                                    item.votantes = arr.join(','); setPropuestas(clon); enviarAccion('votar', { tipo: 'propuesta', id: p.titulo, email: sesion.email }); mostrarToast('Voto actualizado.');
                                  }} className="self-start mt-2 px-3.5 py-1 text-[10px] rounded-full font-bold bg-white text-[#1c1c1a] border border-[#e6e4dc] font-sans">Votar ({p.votos||0})</button>
                                </div>
                              </div>
                            ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {subTabComunidad === 'buzon' && (
                    <div className="editorial-card p-5 space-y-3">
                      <h2 className="font-babydoll text-2xl font-bold">Buzón privado</h2>
                      <p className="text-xs text-[#595750] font-sans">Sugerencias y comunicación directa con la administración.</p>
                      <textarea placeholder="Escribe tu mensaje..." value={mensajeFundadora} onChange={e=>setMensajeFundadora(e.target.value)} className="w-full editorial-input p-3 text-xs h-28 resize-none"></textarea>
                      <button onClick={()=>{ enviarAccion('buzon',{mensaje:mensajeFundadora}); setMensajeFundadora(''); mostrarToast('Mensaje enviado.');}} className="w-full editorial-btn py-2.5 text-xs">Enviar mensaje</button>
                    </div>
                  )}
                </div>
              )}
            </main>

            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-3 px-4 flex justify-around items-center max-w-lg mx-auto z-40 rounded-t-2xl shadow-lg">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'inicio' },
                { id: 'edificio', icon: 'fa-building', label: 'casa' },
                { id: 'habitacion', icon: 'fa-bookmark', label: 'habitación' },
                { id: 'capitulos', icon: 'fa-book-open', label: 'capítulos' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' }
              ].map(tab => {
                const esComunidad = tab.id === 'comunidad';
                const bloqueado = esRestringida && esComunidad;

                return (
                  <button 
                    key={tab.id} 
                    onClick={() => {
                      if (bloqueado) {
                        setMostrarModalUpgrade(true);
                      } else {
                        setSeccionApp(tab.id);
                      }
                    }} 
                    className={`flex flex-col items-center gap-1 transition-all p-1.5 ${seccionApp === tab.id ? 'text-[#1c1c1a] font-bold bg-[#faf9f5] px-3.5 py-1.5 rounded-xl shadow-sm' : 'text-[#595750] hover:text-gray-800'} ${bloqueado ? 'opacity-50' : ''}`}
                  >
                    <i className={`fa-solid ${tab.icon} text-sm ${bloqueado ? 'fa-lock text-xs' : ''}`}></i>
                    <span className="text-[9px] font-bold uppercase font-sans">{tab.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>
        );
      }

      const containerRoot = ReactDOM.createRoot(document.getElementById('root'));
      containerRoot.render(<App />);
    </script>
  </body>
</html>
