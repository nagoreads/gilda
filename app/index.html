<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4A5028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>gilda — club de lectura</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Fontshare: Satoshi -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      @font-face {
        font-family: 'BabyDoll';
        src: url('babydoll.ttf') format('truetype'),
             url('babydoll.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      body {
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #FBF9F5;
        color: #232321;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .font-babydoll {
        font-family: 'BabyDoll', cursive, sans-serif;
        letter-spacing: 0.5px;
      }

      .editorial-card {
        background: #FFFFFF;
        color: #232321;
        border: 1px solid #E8E6DF;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }

      .editorial-input {
        background: #F8F7F3;
        border: 1px solid #E8E6DF;
        border-radius: 12px;
        color: #232321;
        font-family: 'Satoshi', sans-serif;
        font-size: 0.875rem;
        transition: all 0.2s ease;
      }
      .editorial-input:focus {
        outline: none;
        background: #FFFFFF;
        border-color: #4A5028;
        box-shadow: 0 0 0 3px rgba(74, 80, 40, 0.12);
      }

      .editorial-btn {
        background: #232321;
        color: #FBF9F5;
        border-radius: 20px;
        font-weight: 600;
        font-family: 'Satoshi', sans-serif;
        letter-spacing: 0.02em;
        transition: all 0.2s ease;
      }
      .editorial-btn:hover { background: #4A5028; color: #FFFFFF; }

      .fade-in { animation: fadeIn 0.25s ease-out forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root" class="w-full max-w-md min-h-screen flex flex-col justify-center p-4"></div>

    <script type="text/babel">
      const { useState } = React;

      const MODALIDADES = [
        {
          id: 'sofa',
          nombre: 'Lectoras de Sofá',
          precio: 'Gratis',
          descripcion: 'Ideal si quieres seguir las lecturas del mes a tu propio ritmo.',
          beneficios: [
            'Acceso al libro mensual seleccionado',
            'Participación en debates del foro público',
            'Boletín de novedades literarias'
          ]
        },
        {
          id: 'barra',
          nombre: 'Lectoras de Barra',
          precio: 'Popular',
          descripcion: 'Pensado para quienes buscan interacciones semanales y cafecitos virtuales.',
          beneficios: [
            'Todo lo de Lectoras de Sofá',
            'Acceso a los Cafecitos Virtuales semanales',
            'Votación directa para los siguientes libros',
            'Chat grupal activo en directo'
          ]
        },
        {
          id: 'vip',
          nombre: 'Lectoras VIP',
          precio: 'Completo',
          descripcion: 'La experiencia completa con encuentros presenciales y contenido exclusivo.',
          beneficios: [
            'Todo lo de Lectoras de Barra',
            'Reserva prioritaria en reuniones presenciales',
            'Descuentos en librerías asociadas',
            'Kit de bienvenida exclusivo'
          ]
        }
      ];

      function PantallaBienvenida() {
        const [modo, setModo] = useState('registro'); // 'registro' o 'login'
        const [modalidadSel, setModalidadSel] = useState('barra');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [nombre, setNombre] = useState('');

        return (
          <div className="w-full space-y-6 py-6 fade-in">
            <!-- Header & Branding -->
            <div className="text-center space-y-2">
              <h1 className="font-babydoll text-4xl text-[#4A5028] font-bold">gilda</h1>
              <p className="text-xs uppercase tracking-widest text-gray-500 font-semibold">Club de Lectura</p>
              <p className="text-sm text-gray-700 font-medium max-w-xs mx-auto leading-snug pt-1">
                Tu refugio literario para leer a tu ritmo y compartir lecturas con otras apasionadas.
              </p>
            </div>

            <!-- Proof Social & Lectura Actual -->
            <div className="editorial-card p-3.5 flex items-center gap-3 bg-[#FAF8F3]">
              <div className="flex -space-x-2 shrink-0">
                <div className="w-7 h-7 rounded-full bg-[#4A5028] text-white flex items-center justify-center text-xs font-bold border-2 border-white">M</div>
                <div className="w-7 h-7 rounded-full bg-[#633B28] text-white flex items-center justify-center text-xs font-bold border-2 border-white">L</div>
                <div className="w-7 h-7 rounded-full bg-[#3C5868] text-white flex items-center justify-center text-xs font-bold border-2 border-white">C</div>
              </div>
              <div className="text-xs text-gray-700">
                <p className="font-bold text-[#232321]">+500 lectoras activas</p>
                <p className="text-[11px] text-gray-500">Leyendo este mes: <span className="italic font-semibold text-[#4A5028]">La vegetariana</span></p>
              </div>
            </div>

            <!-- Selector de Modalidades (Paso clave para resolver dudas) -->
            {modo === 'registro' && (
              <div className="space-y-3">
                <p className="text-xs font-bold text-gray-700 uppercase tracking-wider text-center">
                  Elige tu modalidad de lectura:
                </p>
                <div className="grid grid-cols-3 gap-2">
                  {MODALIDADES.map((m) => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setModalidadSel(m.id)}
                      className={`p-2.5 rounded-xl text-center border transition-all text-xs flex flex-col items-center justify-center ${
                        modalidadSel === m.id
                          ? 'border-[#4A5028] bg-[#FAF6E8] text-[#4A5028] font-bold shadow-xs'
                          : 'border-[#E8E6DF] bg-white text-gray-600 hover:border-gray-300'
                      }`}
                    >
                      <span>{m.nombre}</span>
                      <span className="text-[10px] text-gray-400 font-normal">{m.precio}</span>
                    </button>
                  ))}
                </div>

                <!-- Detalle de la modalidad seleccionada -->
                {MODALIDADES.filter(m => m.id === modalidadSel).map(m => (
                  <div key={m.id} className="editorial-card p-3.5 space-y-2 bg-white text-xs fade-in">
                    <p className="text-gray-700 font-medium">{m.descripcion}</p>
                    <ul className="space-y-1 text-gray-600">
                      {m.beneficios.map((b, i) => (
                        <li key={i} className="flex items-center gap-2">
                          <i className="fa-solid fa-check text-[10px] text-[#4A5028]"></i>
                          <span>{b}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            )}

            <!-- Formulario de Acceso -->
            <form onSubmit={(e) => e.preventDefault()} className="editorial-card p-5 space-y-3">
              <div className="flex border-b border-[#E8E6DF] pb-2 mb-3">
                <button
                  type="button"
                  onClick={() => setModo('registro')}
                  className={`flex-1 text-center text-xs font-bold pb-1 transition-all ${
                    modo === 'registro' ? 'text-[#4A5028] border-b-2 border-[#4A5028]' : 'text-gray-400'
                  }`}
                >
                  Unirme al club
                </button>
                <button
                  type="button"
                  onClick={() => setModo('login')}
                  className={`flex-1 text-center text-xs font-bold pb-1 transition-all ${
                    modo === 'login' ? 'text-[#4A5028] border-b-2 border-[#4A5028]' : 'text-gray-400'
                  }`}
                >
                  Ya tengo cuenta
                </button>
              </div>

              {modo === 'registro' && (
                <div>
                  <label className="block text-[11px] font-semibold text-gray-600 mb-1">Tu nombre o apodo</label>
                  <input
                    type="text"
                    value={nombre}
                    onChange={(e) => setNombre(e.target.value)}
                    placeholder="Escríbelo aquí..."
                    className="w-full editorial-input p-2.5"
                  />
                </div>
              )}

              <div>
                <label className="block text-[11px] font-semibold text-gray-600 mb-1">Correo electrónico</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="hola@ejemplo.com"
                  className="w-full editorial-input p-2.5"
                />
              </div>

              <div>
                <label className="block text-[11px] font-semibold text-gray-600 mb-1">Contraseña</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full editorial-input p-2.5"
                />
              </div>

              <button type="submit" className="w-full editorial-btn py-3 text-xs uppercase tracking-wider mt-2">
                {modo === 'registro' ? 'Crear mi cuenta' : 'Entrar al club'}
              </button>
            </form>

            <p className="text-center text-[11px] text-gray-400">
              Al continuar aceptas compartir el gusto por los libros y el café.
            </p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PantallaBienvenida />);
    </script>
  </body>
</html>
