      function EdificioClub({ usuarias, libroActual }) {
        const [usuariaActivaIndice, setUsuariaActivaIndice] = useState(0);
        const [notificacionActual, setNotificacionActual] = useState(null);
        const colaNotificaciones = useRef([]);
        const estaProcesando = useRef(false);

        const listaUsuarias = usuarias.length > 0 ? usuarias : [];
        const usuariaActiva = listaUsuarias[usuariaActivaIndice] || listaUsuarias[0] || {};

        const tieneProgresoClub = Number(usuariaActiva.pagina || 0) > 0;
        const misLibrosPersonales = usuariaActiva.misLecturasPersonales || [];

        // Lógica de cola de notificaciones secuencial
        const procesarSiguienteNotificacion = () => {
          if (colaNotificaciones.current.length === 0) {
            estaProcesando.current = false;
            setNotificacionActual(null);
            return;
          }
          estaProcesando.current = true;
          const siguiente = colaNotificaciones.current.shift();
          setNotificacionActual(siguiente);

          setTimeout(() => {
            setNotificacionActual(null);
            setTimeout(() => {
              procesarSiguienteNotificacion();
            }, 400);
          }, 4500);
        };

        useEffect(() => {
          const nuevas = [];
          listaUsuarias.forEach((u, i) => {
            if (u.tieneNovedad) {
              const tituloLibro = (Number(u.pagina || 0) > 0) 
                ? libroActual.titulo 
                : (u.misLecturasPersonales && u.misLecturasPersonales.length > 0 ? u.misLecturasPersonales[0].libro : '');
              
              const pagLibro = (Number(u.pagina || 0) > 0)
                ? u.pagina
                : (u.misLecturasPersonales && u.misLecturasPersonales.length > 0 ? u.misLecturasPersonales[0].pagina : 0);

              const texto = `${(u.nombre || '').toLowerCase()} - ${tituloLibro || 'lectura'} - pag. ${pagLibro || 0}`;

              if (!colaNotificaciones.current.some(n => n.id === u.email) && (!notificacionActual || notificacionActual.id !== u.email)) {
                nuevas.push({ id: u.email, texto, indice: i });
              }
            }
          });

          if (nuevas.length > 0) {
            colaNotificaciones.current = [...colaNotificaciones.current, ...nuevas];
            if (!estaProcesando.current) {
              procesarSiguienteNotificacion();
            }
          }
        }, [listaUsuarias, libroActual]);

        return (
          <div className="flex flex-col items-center w-full max-w-[450px] mx-auto py-2 relative">

              Selecciona una ventana para ver sus lecturas actuales.
            </p>

            {/* Banner único de notificaciones que nunca se solapa */}
            <div className="h-8 mb-4 flex items-center justify-center">
              {notificacionActual && (
                <div 
                  key={notificacionActual.id + notificacionActual.texto}
                  onClick={() => setUsuariaActivaIndice(notificacionActual.indice)}
                  className="bg-[#1a1a1a] text-[#ffffee] border border-[#adae1d] px-3 py-1 rounded-full shadow-lg text-[10px] font-medium tracking-wide notificacion-secuencial cursor-pointer flex items-center gap-2"
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-[#adae1d] animate-pulse"></span>
                  <span>{notificacionActual.texto}</span>
                </div>
              )}

            <div className="grid grid-cols-3 gap-x-4 gap-y-8 w-full max-w-[180px] mx-auto mb-10">
              {listaUsuarias.map((usuaria, indice) => {
                const estaLeyendo = usuaria.estaLeyendo;

                return (

                  </div>

      function MapaGilda({ usuarias }) {
        const mapRef = useRef(null);
        const markersGroupRef = useRef(null);
        const [regionSeleccionada, setRegionSeleccionada] = useState(null);

        const regionesMap = useMemo(() => {
          const map = {};
          usuarias.forEach(u => {
            const reg = u.provincia_region || u.ciudad || 'Global';
            if (!map[reg]) map[reg] = [];
            map[reg].push(u);
          });
          return map;
        }, [usuarias]);

        useEffect(() => {
          if (!mapRef.current) {
            const map = L.map('mapa-gilda', { zoomControl: false }).setView([30, -10], 2);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
              attribution: '&copy; OpenStreetMap', maxZoom: 10
            }).addTo(map);
            markersGroupRef.current = L.layerGroup().addTo(map);
            mapRef.current = map;
          }

          const renderMarkers = async () => {
            markersGroupRef.current.clearLayers();
            for (const [reg, lista] of Object.entries(regionesMap)) {
              if (reg === 'Global') continue;
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(reg)}&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) {
                  const marker = L.circleMarker([parseFloat(data[0].lat), parseFloat(data[0].lon)], {
                    radius: 8 + Math.min(lista.length * 2, 12),
                    fillColor: '#adae1d', color: '#ffffff', weight: 2, opacity: 1, fillOpacity: 0.85
                  });
                  marker.bindTooltip(`<b>${reg}</b>: ${lista.length} lectoras`, { direction: 'top' });
                  marker.on('click', () => setRegionSeleccionada({ region: reg, usuarias: lista }));
                  markersGroupRef.current.addLayer(marker);
                }
              } catch (e) {}
            }
          };
          renderMarkers();
        }, [regionesMap]);

        return (
          <div className="relative">
            <div id="mapa-gilda"></div>
            {regionSeleccionada && (
              <div className="absolute inset-0 z-[1000] bg-white/95 backdrop-blur-sm p-4 flex flex-col rounded-lg fade-in text-black">
                <div className="flex justify-between items-center border-b pb-2 mb-3">
                  <h3 className="font-editorial-title font-medium text-base">{regionSeleccionada.region}</h3>
                  <button onClick={() => setRegionSeleccionada(null)} className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">cerrar</button>
                </div>
                <div className="overflow-y-auto flex-grow space-y-2">
                  {regionSeleccionada.usuarias.map((u, i) => (
                    <div key={i} className="flex justify-between items-center text-xs p-2 bg-[#ffffee] rounded border border-[#e2e2da]">
                      <span className="font-medium">{u.nombre}</span>
                      <span className="text-gray-500">{u.ciudad || 'Sin localidad'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      }

          Promise.all([
            parsearHoja(URL_CSV_USUARIAS),
            parsearHoja(URL_CSV_CAPITULOS), 
            parsearHoja(URL_CSV_COMENTARIOS), 
            parsearHoja(URL_CSV_CAFECITOS),
            parsearHoja(URL_CSV_LECTURAS), 
            parsearHoja(URL_CSV_CHAT), 
            parsearHoja(URL_CSV_PROPUESTAS),
            parsearHoja(URL_CSV_VOTACION_CAFE), 
            parsearHoja(URL_CSV_LECTURAS_PERSONALES)
          ]).then(results => {
            setUsuariasClub(results[0].filter(u => (u.email || '').trim() !== ''));
            setCapitulos(results[1]); 
            setComentarios(results[2].reverse()); 
            setCafecitos(results[3]);
            setLecturas(results[4]); 
            setChatMsgs(results[5]); 
            setPropuestas(results[6]);
            setFechasCafe(results[7]); 
            setLecturasPersonales(results[8]);
          });
        };

        useEffect(() => {
          parsearHoja(URL_CSV_USUARIAS).then(data => setUsuariasClub(data.filter(u => (u.email || '').trim() !== '')));
        }, []);

        useEffect(() => {
          if (sesion) {
            setCargandoDatos(true);
            cargarTodosLosDatos();
            setCargandoDatos(false);

            const interval = setInterval(() => {
              parsearHoja(URL_CSV_CHAT).then(data => setChatMsgs(data));
              parsearHoja(URL_CSV_USUARIAS).then(data => setUsuariasClub(data.filter(u => (u.email || '').trim() !== '')));
              parsearHoja(URL_CSV_LECTURAS_PERSONALES).then(data => setLecturasPersonales(data));
            }, 10000);

            return () => clearInterval(interval);
          }
        }, [sesion]);

        useEffect(() => {
          if (sesion && usuariasClub.length > 0) {
            const socia = usuariasClub.find(u => (u.email || '').toLowerCase() === sesion.email.toLowerCase());
            if (socia) {
              setMiPagina(Number(socia.pagina || 0));
              if (!nombreUsuarioPersonalizado) setNombreUsuarioPersonalizado(socia.nombre || sesion.email.split('@')[0]);
              if (socia.ciudad && !miCiudad) setMiCiudad(socia.ciudad);
            }
          }
        }, [sesion, usuariasClub.length]);

        const enviarAccion = async (action, payload) => {
          try {
            const nombreActual = nombreUsuarioPersonalizado || sesion?.nombre || 'Socia';
            await fetch(GOOGLE_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, usuario: nombreActual, usuaria: nombreActual, email: sesion?.email, ...payload }),
            });
          } catch (err) { console.error(err); }
        };

        const iniciarSesion = (e) => {
          e.preventDefault();
          setErrorLogin('');
          const mail = inputEmail.trim().toLowerCase();
          const pwd = inputPassword.trim();
          if (!mail || !pwd) return;

          const socia = usuariasClub.find(u => (u.email || '').trim().toLowerCase() === mail);
          if (!socia) return setErrorLogin('Este correo no está registrado en gilda.');
          if ((socia.estado || '').toLowerCase() === 'pendiente') return setErrorLogin('Tu cuenta está pendiente de aprobación.');

          const pwdSheet = socia.password || '';
          if (pwdSheet === '') {
            if (pwd.length < 4) return setErrorLogin('Establece una contraseña de al menos 4 caracteres.');
            enviarAccion('set_password', { email: mail, password: pwd });
            mostrarToast('Contraseña registrada con éxito.');
          } else {
            if (pwdSheet !== pwd) return setErrorLogin('Contraseña incorrecta.');
          }

          const nombreDef = socia.nombre || mail.split('@')[0];
          const datosSesion = { nombre: nombreDef, email: mail, modalidad: (socia.modalidad || 'gilda').toLowerCase() };
          localStorage.setItem('gilda_sesion', JSON.stringify(datosSesion));
          localStorage.setItem('gilda_nombre_usuario', nombreDef);
          setSesion(datosSesion);
        };

        const cerrarSesion = () => { localStorage.removeItem('gilda_sesion'); setSesion(null); setInputEmail(''); setInputPassword(''); };

        const guardarMiCiudad = async () => {
          const ciudadLimpia = miCiudad.trim();
          if (!ciudadLimpia) return;
          localStorage.setItem('gilda_mi_ciudad', ciudadLimpia);
          mostrarToast('Detectando región...');
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ciudadLimpia)}&limit=1&addressdetails=1`);
            const data = await res.json();
            const provincia = (data && data.length > 0) ? (data[0].address.state || data[0].address.region || ciudadLimpia) : ciudadLimpia;
            enviarAccion('actualizar_ubicacion', { ciudad: ciudadLimpia, provincia_region: provincia });
            mostrarToast(`Guardado: ${ciudadLimpia}`);
          } catch(e) {
            enviarAccion('actualizar_ubicacion', { ciudad: ciudadLimpia, provincia_region: ciudadLimpia });
            mostrarToast('Ubicación guardada.');
          }
        };

        const guardarLibroPersonal = (tituloOpt, pagOpt) => {
          const tituloLibro = (tituloOpt !== undefined ? tituloOpt : libroPersonal).trim();
          if (!tituloLibro) return;
          const pag = Number(pagOpt !== undefined ? pagOpt : paginaPersonalInput) || 0;

          const clon = [...lecturasPersonales];
          const idx = clon.findIndex(l => (l.email || '').toLowerCase() === sesion.email.toLowerCase() && (l.libro || '').toLowerCase() === tituloLibro.toLowerCase());
          if (idx > -1) {
            clon[idx].pagina = pag;
          } else {
            clon.push({ email: sesion.email, nombre: nombreUsuarioPersonalizado || sesion.nombre, libro: tituloLibro, pagina: pag });
          }
          setLecturasPersonales(clon);
          setLibroPersonal('');
          setPaginaPersonalInput('');

          enviarAccion('actualizar_libro_personal', { email: sesion.email, nombre: nombreUsuarioPersonalizado || sesion.nombre, libro: tituloLibro, pagina: pag });
          mostrarToast(`Guardado: ${tituloLibro}`);
        };

        const enviarRespuesta = (idPadre, capTitulo) => {
          const txt = respuestaComentario[idPadre];
          if(!txt || !txt.trim()) return;
          const nuevo = { id: Date.now().toString(), parent_id: idPadre, capitulo: capTitulo, autora: nombreUsuarioPersonalizado || sesion.nombre, texto: txt, fecha: 'Ahora' };
          setComentarios([nuevo, ...comentarios]);
          setRespuestaComentario({...respuestaComentario, [idPadre]: ''});
          enviarAccion('comentario', nuevo);
          mostrarToast('Respuesta publicada.');
        };

        const reaccionar = (idComentario, emoji) => {
          const clon = [...comentarios];
          const com = clon.find(c => c.id === idComentario);
          if(com) {
            com.reacciones = (com.reacciones || "") + emoji;
            setComentarios(clon);
            enviarAccion('reaccionar', { id: idComentario, reacciones: com.reacciones });
          }
        };

        const enviarChat = (e) => {
          e.preventDefault();
          const textoMsg = nuevoChat.trim();
          if (!textoMsg) return;
          const nombreActual = nombreUsuarioPersonalizado || sesion.nombre;
          setChatMsgs(prev => [...prev, { usuario: nombreActual, mensaje: textoMsg, fecha: 'Ahora' }]);
          enviarAccion('enviar_chat', { mensaje: textoMsg });
          setNuevoChat('');
          mostrarToast('Mensaje enviado.');
        };

        const toggleLecturaLamp = () => {
          const nuevo = !isReadingNow; 
          setIsReadingNow(nuevo);
          localStorage.setItem('gilda_is_reading', JSON.stringify(nuevo));
          enviarAccion('estado_lectura', { leyendo: nuevo });
        };

        const actualizarPagina = (nuevaPag) => {
          const pagValida = Math.max(0, nuevaPag); setMiPagina(pagValida);
          enviarAccion('actualizar_pagina', { pagina: pagValida });
          mostrarToast(`Progreso: pág. ${pagValida}`);
        };

        const libroActual = useMemo(() => lecturas[0] || { titulo: 'La campana de cristal', autora: 'Sylvia Plath', paginas_totales: 280, portada: '' }, [lecturas]);
        const porcentajeLibro = useMemo(() => Math.min(Math.round((miPagina / Number(libroActual.paginas_totales || 280)) * 100), 100), [miPagina, libroActual]);
        
        const usuariasConectadas = useMemo(() => {
          const ah = new Date().getTime();
          return usuariasClub.filter(u => {
            if ((u.email || '').toLowerCase() === (sesion?.email || '').toLowerCase()) return true;
            if (!u.ultima_actividad) return false;
            const t = new Date(u.ultima_actividad).getTime();
            return (ah - (isNaN(t) ? 0 : t)) < 15 * 60 * 1000;
          });
        }, [usuariasClub, sesion]);

        const miembrosEdificio = useMemo(() => {
          const ah = new Date().getTime();
          return usuariasClub.map(u => {
            const emailU = (u.email || '').toLowerCase().trim();
            const esYo = emailU === (sesion?.email || '').toLowerCase().trim();
            const misPersonales = lecturasPersonales.filter(l => (l.email || '').toLowerCase().trim() === emailU);
            
            // Detecta si la usuaria actualizó actividad recientemente
            let tieneNovedad = false;
            if (u.ultima_actividad) {
              const t = new Date(u.ultima_actividad).getTime();
              if (!isNaN(t) && (ah - t) < 24 * 60 * 60 * 1000) {
                tieneNovedad = true;
              }
            }

            return {
              ...u,
              nombre: esYo ? (nombreUsuarioPersonalizado || u.nombre) : (u.nombre || 'Socia'),
              pagina: esYo ? miPagina : Number(u.pagina || 0),
              estaLeyendo: esYo ? isReadingNow : (Number(u.pagina || 0) > 0 || misPersonales.length > 0),
              misLecturasPersonales: misPersonales,
              tieneNovedad: tieneNovedad
            };
          });
        }, [usuariasClub, sesion, nombreUsuarioPersonalizado, miPagina, isReadingNow, lecturasPersonales]);

        if (!sesion) {
          return (
            <div className="min-h-screen flex items-center justify-center px-4 w-full">
              <div className="editorial-card max-w-sm w-full p-8 space-y-6 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-24 h-24 bg-[#adae1d] rounded-bl-full opacity-10"></div>
                <div className="space-y-1 relative z-10 text-center">
                  <h1 className="font-modern-title text-4xl text-[#1a1a1a]">gilda</h1>
                </div>
                <div className="bg-[#ffffee] border border-[#e2e2da] p-3 rounded text-center text-xs text-gray-600">
                  <span className="text-black font-bold">{usuariasClub.length}</span> lectoras
                </div>
                <form onSubmit={iniciarSesion} className="space-y-4 relative z-10">
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Correo electrónico</label>
                    <input type="email" placeholder="tu@correo.com" value={inputEmail} onChange={(e) => setInputEmail(e.target.value)} required className="w-full editorial-input px-3.5 py-2.5 text-sm mt-1" />
                  </div>
                  <div>
                    <label className="text-[10px] uppercase font-semibold text-gray-500 ml-1">Contraseña</label>
                    <input type="password" placeholder="••••••••" value={inputPassword} onChange={(e) => setInputPassword(e.target.value)} required className="w-full editorial-input px-3.5 py-2.5 text-sm mt-1" />
                  </div>
                  {errorLogin && <p className="text-[11px] text-red-600 font-medium text-center">{errorLogin}</p>}
                  <button type="submit" className="w-full editorial-btn py-3 text-sm font-medium tracking-wide">
                    Iniciar sesión
                  </button>
                </form>
                <div className="pt-4 border-t border-gray-100 text-center space-y-2">
                  <p className="text-[11px] text-gray-500 leading-relaxed px-1">
                    por si no lo sabes, hay distintas modalidades de gilda, así que seguro que encuentras la tuya en el siguiente botón:
                  </p>
                  <a href="https://nagoreads.github.io/gilda/" target="_blank" rel="noreferrer" className="inline-block text-[11px] text-[#adae1d] font-bold hover:underline">
                    quiero registrarme :)
                  </a>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col items-center pt-6 pb-28 px-4 sm:px-6 max-w-md w-full mx-auto relative">
            
            {toastMsg && (
              <div className="fixed top-6 z-50 bg-[#1a1a1a] text-[#ffffee] text-xs px-4 py-2.5 rounded-full shadow-lg fade-in flex items-center gap-2 border border-white/20">
                <span className="w-2 h-2 rounded-full bg-[#adae1d]"></span><span>{toastMsg}</span>
              </div>
            )}

            <header className="w-full mb-5 flex justify-between items-center bg-white text-[#1a1a1a] p-3.5 rounded-xl border border-[#1a1a1a] shadow-sm">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-[#ffffee] border border-[#e2e2da] flex items-center justify-center font-editorial-title text-lg text-[#adae1d]">
                  {sesion.nombre.charAt(0).toUpperCase()}
                </div>
                <div>
                  {editandoNombre ? (
                    <div className="flex gap-2">
                      <input type="text" value={nombreUsuarioPersonalizado} onChange={e => setNombreUsuarioPersonalizado(e.target.value)} className="editorial-input text-xs px-2 py-1 w-24" />
                      <button onClick={() => { localStorage.setItem('gilda_nombre_usuario', nombreUsuarioPersonalizado); setEditandoNombre(false); enviarAccion('actualizar_nombre',{nombre: nombreUsuarioPersonalizado}); }} className="text-[#adae1d] text-xs font-bold">ok</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <h2 className="font-semibold text-sm leading-none">{nombreUsuarioPersonalizado || sesion.nombre}</h2>
                      <button onClick={() => setEditandoNombre(true)} className="text-gray-400 text-[10px]"><i className="fa-solid fa-pen"></i></button>
                    </div>
                  )}
                  <span className="text-[9px] text-gray-500 uppercase block mt-0.5">{sesion.modalidad}</span>
                </div>
              </div>
              <button onClick={cerrarSesion} className="text-gray-400 hover:text-black"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
            </header>

            <main className="w-full flex-grow space-y-4 fade-in">
              {cargandoDatos ? (
                <div className="text-center py-20 text-xs text-white animate-pulse">Cargando volúmenes...</div>
              ) : (
                <>
                  {seccionApp === 'inicio' && (
                    <div className="space-y-4 fade-in">
                      <div className="editorial-card p-5 space-y-4">
                        <div className="flex gap-4 items-center">
                          <PortadaLibro titulo={libroActual.titulo} autora={libroActual.autora} portada={libroActual.portada} size="large" />
                          <div className="space-y-2 w-full">
                            <span className="text-[9px] uppercase tracking-wider text-[#adae1d] font-bold">Lectura del Club</span>
                            <h2 className="font-editorial-title text-base font-medium leading-snug">{libroActual.titulo}</h2>
                            <p className="text-xs text-gray-500 italic">{libroActual.autora}</p>
                            <div className="mt-2">
                              <div className="flex justify-between text-[10px] text-gray-500 mb-1">
                                <span>progreso general</span><span>{porcentajeLibro}%</span>
                              </div>
                              <div className="w-full bg-gray-100 rounded-full h-1"><div className="bg-[#adae1d] h-full rounded-full transition-all" style={{width: `${porcentajeLibro}%`}}></div></div>
                            </div>
                          </div>
                        </div>

                        <div className="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                          <span className="text-xs text-gray-500">página por la que vas:</span>
                          <div className="flex items-center gap-1">
                            <button onClick={() => actualizarPagina(miPagina - 5)} className="bg-gray-100 px-2 py-1 rounded text-xs">-5</button>
                            <input type="number" value={miPagina} onChange={(e) => setMiPagina(Number(e.target.value))} className="editorial-input w-12 text-center py-1 text-xs" />
                            <button onClick={() => actualizarPagina(miPagina + 5)} className="bg-gray-100 px-2 py-1 rounded text-xs">+5</button>
                            <button onClick={() => actualizarPagina(miPagina)} className="editorial-btn px-2 py-1 text-xs">ok</button>
                          </div>
                        </div>
                      </div>

                      {/* Tu Estancia — Estilo Goodreads */}
                      <div className="editorial-card p-5 space-y-4">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                          <h3 className="font-editorial-title text-base">Mi Estantería Personal</h3>
                          <button onClick={toggleLecturaLamp} className={`px-3 py-1 text-xs rounded-full font-bold transition-all ${isReadingNow ? 'bg-[#adae1d] text-black shadow' : 'bg-gray-100 text-gray-500'}`}>
                            {isReadingNow ? 'Luz encendida' : 'Luz apagada'}
                          </button>
                        </div>

                        {/* Formulario para añadir nueva lectura personal */}
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          if (!libroPersonal.trim()) return;
                          guardarLibroPersonal();
                        }} className="space-y-2 bg-[#ffffee] p-3 rounded border border-[#e2e2da]">
                          <span className="text-[10px] uppercase font-bold text-gray-500">Añadir libro a mi estantería</span>
                          <input type="text" placeholder="Título del libro..." value={libroPersonal} onChange={(e) => setLibroPersonal(e.target.value)} required className="w-full editorial-input p-2 text-xs italic" />
                          <div className="flex gap-2">
                            <input type="number" placeholder="Pág. actual" value={paginaPersonalInput || ''} onChange={(e) => setPaginaPersonalInput(e.target.value)} className="w-1/2 editorial-input p-2 text-xs" />
                            <button type="submit" className="w-1/2 editorial-btn py-1.5 text-xs">Añadir / Guardar</button>
                          </div>
                        </form>

                        {/* Lista de lecturas personales de la socia */}
                        <div className="space-y-2 pt-1">
                          <span className="text-[10px] text-gray-400 uppercase font-bold">Mis lecturas actuales</span>
                          {lecturasPersonales.filter(l => (l.email || '').toLowerCase() === sesion.email.toLowerCase()).length === 0 ? (
                            <p className="text-xs text-gray-400 italic">No has añadido libros personales todavía.</p>
                          ) : (
                            lecturasPersonales.filter(l => (l.email || '').toLowerCase() === sesion.email.toLowerCase()).map((item, idx) => (
                              <div key={idx} className="flex justify-between items-center p-2.5 bg-white rounded border border-[#e2e2da] text-xs">
                                <div>
                                  <p className="font-bold italic">{item.libro}</p>
                                  <p className="text-[10px] text-gray-500">Página {item.pagina || 0}</p>
                                </div>
                                <div className="flex items-center gap-1">
                                  <input type="number" defaultValue={item.pagina || 0} onBlur={(e) => guardarLibroPersonal(item.libro, e.target.value)} className="editorial-input w-12 text-center py-1 text-[11px]" />
                                  <span className="text-[10px] text-gray-400">pág.</span>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>

                      <div className="editorial-card p-4">
                        <h3 className="font-editorial-title text-sm mb-2">Ubicación geográfica</h3>
                        <div className="flex gap-2">
                          <input type="text" placeholder="Ciudad (ej. Eibar, Madrid)" value={miCiudad} onChange={(e) => setMiCiudad(e.target.value)} className="flex-grow editorial-input px-3 py-2 text-xs" />
                          <button onClick={guardarMiCiudad} className="editorial-btn px-4 text-xs">actualizar</button>
                        </div>
                      </div>

                      <div className="editorial-card p-4 space-y-3">
                        <div className="flex justify-between items-center">
                          <h3 className="font-editorial-title text-sm">Notas y fragmentos</h3>
                          <button onClick={() => { setBotellaAbierta(!botellaAbierta); setFraseActualBotella((prev) => (prev + 1) % FRASES_INICIALES.length); }} className="text-[10px] text-gray-500 uppercase">
                            {botellaAbierta ? 'ocultar' : 'descubrir cita'}
                          </button>
                        </div>
                        {botellaAbierta && (
                          <div className="p-3 bg-[#ffffee] border border-[#e2e2da] rounded text-xs italic font-editorial-title text-gray-700">
                            "{FRASES_INICIALES[fraseActualBotella]}"
                          </div>
                        )}
                        <div className="flex gap-2 pt-2 border-t border-gray-100">
                          <input type="text" placeholder="Guardar cita..." value={nuevaFraseBotella} onChange={(e) => setNuevaFraseBotella(e.target.value)} className="flex-grow editorial-input px-3 py-2 text-xs" />
                          <button onClick={() => { if(!nuevaFraseBotella)return; setMisCitas([nuevaFraseBotella, ...misCitas]); enviarAccion('frase', {frase: nuevaFraseBotella}); setNuevaFraseBotella(''); }} className="editorial-btn px-3 text-xs">guardar</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'edificio' && (
                    <div className="w-full flex justify-center">
                      <EdificioClub usuarias={miembrosEdificio} libroActual={libroActual} />
                    </div>
                  )}

                  {seccionApp === 'capitulos' && (
                    <div className="space-y-4 fade-in">
                      {capitulos.map((cap, i) => {
                        const tituloCap = cap.titulo || `Capítulo ${i}`;
                        const paginaFin = Number(cap.pagina_fin || 0);
                        const bloqueado = paginaFin > 0 && miPagina < paginaFin;

                        return (
                          <div key={i} className="editorial-card p-5 space-y-4">
                            <div className="flex justify-between items-start border-b border-gray-100 pb-2">
                              <h3 className="font-editorial-title text-lg">{tituloCap}</h3>
                              {paginaFin > 0 && (
                                <span className="text-[10px] bg-[#ffffee] border border-[#e2e2da] px-2 py-0.5 rounded text-gray-500 font-medium whitespace-nowrap ml-2">
                                  hasta pág. {paginaFin}
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-gray-600">{cap.descripcion}</p>
                            
                            {bloqueado ? (
                              <div className="bg-[#ffffee] p-4 rounded-lg border border-[#e2e2da] text-center space-y-2 my-2">
                                <i className="fa-solid fa-lock text-[#adae1d] text-base"></i>
                                <p className="text-xs font-bold text-gray-800">Capítulo protegido contra spoilers</p>
                                <p className="text-[11px] text-gray-600 leading-relaxed">
                                  Vas por la página <b>{miPagina}</b> y este capítulo finaliza en la página <b>{paginaFin}</b>. Avanza en tu lectura para desbloquear el contenido.
                                </p>
                              </div>
                            ) : (
                              <>
                                <div className="bg-[#ffffee] p-3 rounded border border-[#e2e2da] flex gap-2">
                                  <input type="text" placeholder="Cita memorable..." value={nuevaCitaCapsula[i]||''} onChange={e=>setNuevaCitaCapsula({...nuevaCitaCapsula, [i]:e.target.value})} className="flex-grow editorial-input px-2 text-xs" />
                                  <button onClick={()=>{ enviarAccion('capsula',{capitulo:tituloCap, cita:nuevaCitaCapsula[i]}); setNuevaCitaCapsula({...nuevaCitaCapsula,[i]:''}); mostrarToast('Cita guardada');}} className="editorial-btn px-3 text-xs">guardar</button>
                                </div>

                                <div className="pt-2">
                                  <div className="flex gap-2 mb-4">
                                    <textarea placeholder="Escribe tu reflexión..." value={nuevoComentario[i]||''} onChange={e=>setNuevoComentario({...nuevoComentario, [i]:e.target.value})} className="flex-grow editorial-input p-2 text-xs h-10 resize-none"></textarea>
                                    <button onClick={()=>{ if(!nuevoComentario[i])return; const n={id:Date.now().toString(), capitulo:tituloCap, autora:nombreUsuarioPersonalizado||sesion.nombre, texto:nuevoComentario[i], fecha:'Ahora'}; setComentarios([n,...comentarios]); enviarAccion('comentario',n); setNuevoComentario({...nuevoComentario,[i]:''});}} className="editorial-btn px-3 text-xs">publicar</button>
                                  </div>

                                  <div className="space-y-4">
                                    {comentarios.filter(c => c.capitulo === tituloCap && !c.parent_id).map(c => (
                                      <div key={c.id} className="space-y-2">
                                        <div className="bg-[#ffffee] p-3 rounded-lg border border-[#e2e2da] shadow-sm">
                                          <div className="flex justify-between mb-1 text-[10px] text-gray-500">
                                            <span className="font-bold text-black uppercase">{c.autora}</span><span>{c.fecha}</span>
                                          </div>
                                          <p className="text-xs text-gray-800">{c.texto}</p>
                                          <div className="flex gap-3 mt-2 pt-2 border-t border-[#e2e2da] text-[11px] text-gray-400">
                                            <button onClick={()=>setRespuestaComentario({...respuestaComentario, [c.id]:respuestaComentario[c.id]!==undefined?undefined:''})} className="hover:text-black font-medium">Responder</button>
                                            <button onClick={()=>reaccionar(c.id,'❤️')} className="hover:scale-110">❤️</button>
                                            <button onClick={()=>reaccionar(c.id,'✨')} className="hover:scale-110">✨</button>
                                            {c.reacciones && <span className="bg-white text-black px-1.5 rounded">{c.reacciones}</span>}
                                          </div>
                                        </div>
                                        <div className="pl-6 space-y-2 border-l-2 border-[#adae1d] ml-3">
                                          {comentarios.filter(r => r.parent_id === c.id).map(r => (
                                            <div key={r.id} className="bg-white p-2 rounded text-xs border border-[#e2e2da]">
                                              <span className="font-bold mr-1 text-[10px] uppercase">{r.autora}:</span><span className="text-gray-600">{r.texto}</span>
                                            </div>
                                          ))}
                                          {respuestaComentario[c.id] !== undefined && (
                                            <div className="flex gap-2 mt-1">
                                              <input type="text" placeholder="Tu respuesta..." value={respuestaComentario[c.id]} onChange={e=>setRespuestaComentario({...respuestaComentario,[c.id]:e.target.value})} className="editorial-input px-2 py-1 text-[11px] flex-grow" />
                                              <button onClick={()=>enviarRespuesta(c.id, tituloCap)} className="editorial-btn px-2 text-[10px]">ok</button>
                                            </div>
                                          )}
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              </>
                            )}
                          </div>
                        )
                      })}
                    </div>
                  )}

                  {seccionApp === 'comunidad' && (
                    <div className="space-y-4 fade-in">
                      <div className="flex bg-[#1a1a1a] p-1 rounded text-[10px] uppercase font-bold text-center border border-white/10">
                        <button onClick={()=>setSubTabComunidad('chat')} className={`flex-1 py-1.5 rounded ${subTabComunidad==='chat'?'bg-white text-[#adae1d] shadow':'text-gray-400'}`}>Chat</button>
                        <button onClick={()=>setSubTabComunidad('mapa')} className={`flex-1 py-1.5 rounded ${subTabComunidad==='mapa'?'bg-white text-[#adae1d] shadow':'text-gray-400'}`}>Mapa</button>
                      </div>
                      
                      {subTabComunidad === 'chat' && (
                        <div className="editorial-card h-[420px] flex flex-col justify-between relative">
                          <div onClick={() => setMostrarModalConectadas(true)} className="bg-[#ffffee] p-2.5 border-b border-[#e2e2da] flex items-center justify-between text-xs rounded-t-lg shrink-0 cursor-pointer hover:bg-[#f6f6e8] transition-colors">
                            <div className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-[#adae1d] animate-pulse"></span>
                              <span className="font-editorial-title text-sm">Conversación en vivo</span>
                            </div>
                            <span className="bg-white px-2 py-0.5 rounded border border-[#e2e2da] text-[#adae1d] font-bold text-[10px] flex items-center gap-1">
                              <i className="fa-solid fa-users text-[9px]"></i> {usuariasConectadas.length} en línea
                            </span>
                          </div>

                          {mostrarModalConectadas && (
                            <div className="absolute inset-0 z-50 bg-white/95 backdrop-blur-sm p-4 rounded-lg flex flex-col fade-in">
                              <div className="flex justify-between items-center border-b pb-2 mb-3">
                                <h3 className="font-editorial-title font-medium text-sm text-black">Socias activas en la app</h3>
                                <button onClick={() => setMostrarModalConectadas(false)} className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">cerrar</button>
                              </div>
                              <div className="overflow-y-auto space-y-2 flex-grow">
                                {usuariasConectadas.map((u, i) => (
                                  <div key={i} className="flex justify-between items-center p-2 bg-[#ffffee] rounded border border-[#e2e2da] text-xs text-black">
                                    <div className="flex items-center gap-2">
                                      <span className="w-2 h-2 rounded-full bg-[#adae1d]"></span>
                                      <span className="font-bold">{u.nombre || u.email}</span>
                                    </div>
                                    <span className="text-[10px] text-gray-500">pág. {u.pagina || 0}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}

                          <div className="flex-grow p-3 overflow-y-auto space-y-3 flex flex-col">
                            {chatMsgs.map((m,i)=>{
                              const autor = m.usuario || m.usuaria || 'Socia';
                              const esMio = autor.toLowerCase() === (nombreUsuarioPersonalizado || sesion.nombre).toLowerCase();
                              return (
                                <div key={i} className={`flex flex-col ${esMio ? 'items-end ml-auto' : 'items-start mr-auto'} text-xs max-w-[85%]`}>
                                  <span className="text-[9px] text-gray-400 mb-0.5">{autor}</span>
                                  <div className={`p-2 rounded-lg ${esMio ? 'bg-[#1a1a1a] text-[#ffffee]' : 'bg-[#ffffee] text-[#1a1a1a] border border-[#e2e2da]'}`}>{m.mensaje}</div>
                                </div>
                              );
                            })}
                          </div>
                          <form onSubmit={enviarChat} className="p-2.5 border-t border-[#e2e2da] flex gap-2 shrink-0 bg-white rounded-b-lg">
                            <input type="text" value={nuevoChat} onChange={e=>setNuevoChat(e.target.value)} className="flex-grow editorial-input px-3 py-2 text-xs" placeholder="Escribe un mensaje..." />
                            <button type="submit" className="editorial-btn px-4 py-2 text-xs"><i className="fa-solid fa-paper-plane"></i></button>
                          </form>
                        </div>
                      )}

                      {subTabComunidad === 'mapa' && (
                        <div className="editorial-card p-3 space-y-2">
                          <div className="flex justify-between items-center text-xs px-1">
                            <span className="font-editorial-title">Mapa Global de Lectoras</span>
                            <span className="text-[10px] text-[#adae1d] font-bold">{usuariasClub.length} socia(s)</span>
                          </div>
                          <MapaGilda usuarias={usuariasClub} />
                        </div>
                      )}
                    </div>
                  )}

                  {seccionApp === 'archivo' && (
                    <div className="space-y-4 fade-in">
                      <div className="editorial-card p-5 space-y-3">
                        <h3 className="font-editorial-title text-base">Proponer Nueva Lectura</h3>
                        <form onSubmit={(e) => {
                          e.preventDefault();
                          const tit = nuevaPropuestaTitulo?.trim();
                          if (!tit) return;
                          const nueva = { titulo: tit, autora: nuevaPropuestaAutora?.trim() || 'Desconocida', votos: '1', votantes: sesion.email.toLowerCase(), portada: nuevaPropuestaPortada?.trim() || '' };
                          setPropuestas([...propuestas, nueva]);
                          enviarAccion('propuesta', nueva);
                          setNuevaPropuestaTitulo(''); setNuevaPropuestaAutora(''); setNuevaPropuestaPortada('');
                          mostrarToast('Propuesta añadida.');
                        }} className="space-y-2">
                          <input type="text" placeholder="Título del libro..." value={nuevaPropuestaTitulo || ''} onChange={e=>setNuevaPropuestaTitulo(e.target.value)} required className="w-full editorial-input p-2.5 text-xs" />
                          <input type="text" placeholder="Autora..." value={nuevaPropuestaAutora || ''} onChange={e=>setNuevaPropuestaAutora(e.target.value)} className="w-full editorial-input p-2.5 text-xs" />
                          <input type="url" placeholder="URL de la portada (opcional)..." value={nuevaPropuestaPortada || ''} onChange={e=>setNuevaPropuestaPortada(e.target.value)} className="w-full editorial-input p-2.5 text-xs" />
                          <button type="submit" className="w-full editorial-btn py-2 text-xs font-medium">Añadir propuesta</button>
                        </form>
                      </div>

                      <div className="editorial-card p-5">
                        <h3 className="font-editorial-title text-base mb-3">Votación Cafecito</h3>
                        <div className="space-y-2">
                          {fechasCafe.map((f,i) => {
                            const votantesArr = (f.votantes || "").toLowerCase().split(',').map(v=>v.trim());
                            const votado = votantesArr.includes(sesion.email.toLowerCase());
                            return (
                              <div key={i} className="flex justify-between items-center text-xs p-2.5 bg-[#ffffee] rounded border border-[#e2e2da]">
                                <span className="font-medium">{f.fecha}</span>
                                <button onClick={()=>{
                                  const clon = [...fechasCafe];
                                  const item = clon.find(x => x.fecha === f.fecha);
                                  if(!item) return;
                                  let arr = (item.votantes||"").toLowerCase().split(',').map(v=>v.trim()).filter(v=>v);
                                  if(arr.includes(sesion.email.toLowerCase())){ 
                                    arr = arr.filter(v=>v!==sesion.email.toLowerCase()); 
                                    item.votos = Math.max(0, Number(item.votos||0) - 1); 
                                  } else { 
                                    arr.push(sesion.email.toLowerCase()); 
                                    item.votos = Number(item.votos||0) + 1; 
                                  }
                                  item.votantes = arr.join(',');
                                  setFechasCafe(clon);
                                  enviarAccion('votar', { tipo: 'cafe', id: f.fecha, email: sesion.email });
                                  mostrarToast('Voto actualizado.');
                                }} className={`px-3 py-1.5 rounded font-bold transition-all ${votado ? 'bg-[#adae1d] text-black shadow' : 'bg-white text-gray-500 border border-[#e2e2da]'}`}>
                                  {votado ? `Votado (${f.votos||0})` : `Votar (${f.votos||0})`}
                                </button>
                              </div>
                            )
                          })}
                        </div>
                      </div>

                      <div className="editorial-card p-5">
                        <h3 className="font-editorial-title text-base mb-3">Próximas Lecturas</h3>
                        <div className="space-y-3">
                          {propuestas.map((p,i) => {
                            const votantesArr = (p.votantes || "").toLowerCase().split(',').map(v=>v.trim());
                            const votado = votantesArr.includes(sesion.email.toLowerCase());
                            return (
                              <div key={i} className="flex gap-3 border border-[#e2e2da] p-3 rounded bg-[#ffffee]">
                                <PortadaLibro titulo={p.titulo} autora={p.autora} portada={p.portada} size="small" />
                                <div className="flex flex-col justify-between w-full">
                                  <div>
                                    <h4 className="font-bold text-xs leading-tight">{p.titulo}</h4>
                                    <p className="text-[10px] text-gray-500 italic">{p.autora}</p>
                                  </div>
                                  <button onClick={()=>{
                                    const clon = [...propuestas];
                                    const item = clon.find(x => x.titulo === p.titulo);
                                    if(!item) return;
                                    let arr = (item.votantes||"").toLowerCase().split(',').map(v=>v.trim()).filter(v=>v);
                                    if(arr.includes(sesion.email.toLowerCase())){ 
                                      arr = arr.filter(v=>v!==sesion.email.toLowerCase()); 
                                      item.votos = Math.max(0, Number(item.votos||0) - 1); 
                                    } else { 
                                      arr.push(sesion.email.toLowerCase()); 
                                      item.votos = Number(item.votos||0) + 1; 
                                    }
                                    item.votantes = arr.join(',');
                                    setPropuestas(clon);
                                    enviarAccion('votar', { tipo: 'propuesta', id: p.titulo, email: sesion.email });
                                    mostrarToast('Voto actualizado.');
                                  }} className={`self-start mt-2 px-3 py-1 text-[10px] rounded font-bold transition-all ${votado ? 'bg-[#adae1d] text-black' : 'bg-white text-[#1a1a1a] border border-[#e2e2da]'}`}>
                                    {votado ? `Votado (${p.votos||0})` : `Votar (${p.votos||0})`}
                                  </button>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'buzon' && (
                    <div className="editorial-card p-5 space-y-3 fade-in">
                      <h2 className="font-editorial-title text-base">Buzón privado</h2>
                      <p className="text-xs text-gray-500">Sugerencias y comunicación directa con la administración.</p>
                      <textarea placeholder="Escribe tu mensaje..." value={mensajeFundadora} onChange={e=>setMensajeFundadora(e.target.value)} className="w-full editorial-input p-3 text-xs h-24 resize-none"></textarea>
                      <button onClick={()=>{ enviarAccion('buzon',{mensaje:mensajeFundadora}); setMensajeFundadora(''); mostrarToast('Mensaje enviado.');}} className="w-full editorial-btn py-2 text-xs">Enviar mensaje</button>
                    </div>
                  )}
                </>
              )}
            </main>

            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-2.5 px-2 flex justify-around items-center max-w-md mx-auto z-40 rounded-t-xl">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'inicio' },
                { id: 'edificio', icon: 'fa-building', label: 'casa' },
                { id: 'capitulos', icon: 'fa-book-open', label: 'capítulos' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' },
                { id: 'archivo', icon: 'fa-box-archive', label: 'archivo' },
                { id: 'buzon', icon: 'fa-envelope', label: 'buzón' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setSeccionApp(tab.id)} className={`flex flex-col items-center gap-1 transition-all p-1 ${seccionApp === tab.id ? 'text-[#1a1a1a] font-bold bg-white px-2.5 py-1 rounded shadow-xs' : 'text-white/60 hover:text-white'}`}>
                  <i className={`fa-solid ${tab.icon} text-sm`}></i>
                  <span className="text-[8px] font-medium uppercase">{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
