<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edificio Gilda - Fachada</title>
  
  <!-- Fuentes tipográficas limpias y poéticas -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@100;300&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       VARIABLES & RESET MÍNIMO
       ========================================= */
    :root {
      --bg-color: #f7f7f5;
      --text-color: #111111;
      --border-color: #d1d1cd;
      --light-off: #2a2a2a;
      --light-on: #ffffff;
      --glow: rgba(255, 255, 255, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header { margin-bottom: 4rem; text-align: center; }
    
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-top: 0.5rem;
    }

    /* =========================================
       FACHADA (CUADRÍCULA DINÁMICA)
       ========================================= */
    #fachada {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3rem 2.5rem;
      max-width: 900px;
      width: 100%;
    }

    .window-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 100px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      /* Para evitar highlight azul en móviles al tocar */
      -webkit-tap-highlight-color: transparent; 
    }

    .window-container:hover {
      transform: translateY(-4px);
    }

    /* =========================================
       SVG & LUCES (LÓGICA VISUAL)
       ========================================= */
    .window-svg {
      width: 100%;
      height: auto;
      /* Integraremos el SVG inline para manipular sus partes con CSS */
    }

    .window-pane {
      fill: var(--light-off);
      transition: fill 0.8s ease, filter 0.8s ease;
    }

    /* Clase dinámica que se añade con JS */
    .is-lit .window-pane {
      fill: var(--light-on);
      filter: drop-shadow(0 0 12px var(--glow));
    }

    /* Propia ventana (indicador sutil) */
    .is-mine .user-name {
      font-weight: 600;
    }
    .is-mine .user-name::after {
      content: ' *';
    }

    .user-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1rem;
      color: var(--text-color);
      transition: opacity 0.3s ease;
    }

    /* =========================================
       MODAL POÉTICO
       ========================================= */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(247, 247, 245, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    #modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 3rem 2.5rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      line-height: 1.4;
      color: var(--text-color);
    }

    .modal-book {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .close-btn {
      margin-top: 2.5rem;
      background: none;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      cursor: pointer;
      color: #888;
      transition: color 0.2s ease;
    }

    .close-btn:hover { color: var(--text-color); }
  </style>
</head>
<body>

  <header>
    <h1>gilda</h1>
    <div class="subtitle">En vela leyendo</div>
  </header>

  <!-- Contenedor donde se inyectarán las ventanas -->
  <main id="fachada"></main>

  <!-- Modal Minimalista -->
  <div id="modal-overlay">
    <div class="modal-content">
      <p class="modal-text" id="modal-poetic-text"></p>
      <p class="modal-book" id="modal-book-title"></p>
      <button class="close-btn" id="close-modal">Cerrar</button>
    </div>
  </div>

  <script>
    /* =========================================
       1. BASE DE DATOS Y CONTEXTO
       ========================================= */
    const usuariaLogueadaId = 'usr_002'; // Simula la usuaria que tiene la sesión iniciada

    // Array escalable. Si añades un objeto aquí, aparecerá automáticamente en la interfaz.
    const usuarias = [
      { id: 'usr_001', nombre: 'Carmen', leyendo: 'El año del pensamiento mágico', luzEncendida: false },
      { id: 'usr_002', nombre: 'Lucía', leyendo: 'La campana de cristal', luzEncendida: true },
      { id: 'usr_003', nombre: 'Elena', leyendo: 'Una habitación propia', luzEncendida: false },
      { id: 'usr_004', nombre: 'Marina', leyendo: 'Nada', luzEncendida: true },
      { id: 'usr_005', nombre: 'Sofía', leyendo: 'Los argonautas', luzEncendida: false },
      { id: 'usr_006', nombre: 'Julia', leyendo: 'Bluets', luzEncendida: false },
    ];

    /* =========================================
       2. PLANTILLA SVG
       ========================================= */
    // INTEGRACIÓN DE TUS SVG: Reemplaza este código por el tuyo.
    // Asegúrate de que las formas que representan el "cristal" tengan la clase class="window-pane"
    const svgTemplate = `
      <svg viewBox="0 0 100 160" class="window-svg" xmlns="http://www.w3.org/2000/svg">
        <!-- Marco / Pared exterior -->
        <path d="M10,60 C10,30 90,30 90,60 L90,150 L10,150 Z" fill="none" stroke="var(--border-color)" stroke-width="1.5"/>
        
        <!-- Cristales (Estas son las partes que se iluminan) -->
        <path class="window-pane" d="M15,60 C15,35 48,35 48,60 L48,145 L15,145 Z" />
        <path class="window-pane" d="M52,60 C52,35 85,35 85,60 L85,145 L52,145 Z" />
      </svg>
    `;

    /* =========================================
       3. LÓGICA DE RENDERIZADO (DOM)
       ========================================= */
    const fachadaContainer = document.getElementById('fachada');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalPoeticText = document.getElementById('modal-poetic-text');
    const modalBookTitle = document.getElementById('modal-book-title');
    const closeModalBtn = document.getElementById('close-modal');

    function renderWindows() {
      fachadaContainer.innerHTML = ''; // Limpiar antes de re-renderizar

      usuarias.forEach(usuaria => {
        const isMine = usuaria.id === usuariaLogueadaId;
        
        // Crear contenedor de la ventana
        const wrapper = document.createElement('div');
        wrapper.className = `window-container ${isMine ? 'is-mine' : ''} ${usuaria.luzEncendida ? 'is-lit' : ''}`;
        wrapper.dataset.userId = usuaria.id;

        // Estructura interna
        wrapper.innerHTML = `
          ${svgTemplate}
          <div class="user-name">${usuaria.nombre}</div>
        `;

        fachadaContainer.appendChild(wrapper);
      });
    }

    /* =========================================
       4. LÓGICA DE INTERACCIÓN (EVENT DELEGATION)
       ========================================= */
    fachadaContainer.addEventListener('click', (e) => {
      // Buscar el contenedor padre de la ventana clicada
      const clickedWindow = e.target.closest('.window-container');
      if (!clickedWindow) return;

      const targetId = clickedWindow.dataset.userId;
      const usuariaData = usuarias.find(u => u.id === targetId);

      if (targetId === usuariaLogueadaId) {
        // ES MI VENTANA: Efecto Toggle de luz (Manipulación de clase CSS)
        usuariaData.luzEncendida = !usuariaData.luzEncendida;
        clickedWindow.classList.toggle('is-lit');
      } else {
        // ES OTRA VENTANA: Abrir Modal Poético
        abrirModal(usuariaData);
      }
    });

    function abrirModal(usuariaData) {
      modalPoeticText.innerHTML = `En la ventana de ${usuariaData.nombre}<br>se lee...`;
      modalBookTitle.innerText = usuariaData.leyendo;
      modalOverlay.classList.add('active');
    }

    function cerrarModal() {
      modalOverlay.classList.remove('active');
    }

    closeModalBtn.addEventListener('click', cerrarModal);
    
    // Cerrar modal tocando el fondo borroso
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) cerrarModal();
    });

    // Inicializar la fachada al cargar
    renderWindows();

  </script>
</body>
</html>
