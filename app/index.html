<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4A5028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>gilda — club de lectura</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW error:', err));
        });
      }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React, ReactDOM y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      @font-face {
        font-family: 'BabyDoll';
        src: url('babydoll.ttf') format('truetype'),
             url('babydoll.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #FBF9F5;
        color: #232321;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .font-babydoll {
        font-family: 'BabyDoll', cursive, sans-serif;
        letter-spacing: 0.3px;
      }

      .editorial-card {
        background: #FFFFFF;
        color: #232321;
        border: 1px solid #E8E6DF;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }

      .editorial-input {
        background: #F8F7F3;
        border: 1px solid #E8E6DF;
        border-radius: 12px;
        color: #232321;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .editorial-input:focus {
        outline: none;
        background: #FFFFFF;
        border-color: #4A5028;
        box-shadow: 0 0 0 3px rgba(74, 80, 40, 0.12);
      }

      .editorial-btn {
        background: #232321;
        color: #FBF9F5;
        border-radius: 20px;
        font-weight: 600;
        font-family: 'BabyDoll', cursive, sans-serif;
        transition: all 0.2s ease;
      }
      .editorial-btn:hover { background: #4A5028; color: #FFFFFF; }

      .editorial-nav {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid #E8E6DF;
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }

      .fade-in { animation: fadeIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }

      .estanteria-madera {
        background: linear-gradient(to bottom, #F4F0E6 0%, #EAE4D2 100%);
        border-bottom: 14px solid #C5B99E;
        border-radius: 6px 6px 10px 10px;
        box-shadow: inset 0 3px 8px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.05);
        position: relative;
      }

      .lomo-libro {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      }
      .lomo-libro:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 16px 30px rgba(0,0,0,0.18);
      }

      @keyframes parpadeoVela {
        0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
        50% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      }
      .vela-flama { animation: parpadeoVela 1.5s infinite ease-in-out; transform-origin: bottom center; }

      @keyframes subirHumo {
        0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
        100% { transform: translateY(-12px) scaleX(1.4); opacity: 0; }
      }
      .humo-taza { animation: subirHumo 2s infinite ease-out; }

      #mapa-gilda { height: 280px; width: 100%; border-radius: 16px; border: 1px solid #E8E6DF; z-index: 1; }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D0CEB3; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root" class="w-full flex flex-col items-center"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbwjmfQLMDx1k6Tk0D1KDF1S3JCwI88x1w1HZhyyRkTbS2gsbPqMqSv9yus2CRDYbQ_S/exec';
      const URL_CSV_USUARIAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=0&single=true&output=csv';
      const URL_CSV_CAPITULOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1060479353&single=true&output=csv';
      const URL_CSV_COMENTARIOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1626426174&single=true&output=csv';
      const URL_CSV_CAFECITOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1040100079&single=true&output=csv';
      const URL_CSV_LECTURAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1676533026&single=true&output=csv';
      const URL_CSV_CHAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=456334295&single=true&output=csv';
      const URL_CSV_PROPUESTAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1701531859&single=true&output=csv';
      const URL_CSV_VOTACION_CAFE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=933058441&single=true&output=csv';
      const URL_CSV_LECTURAS_PERSONALES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjlrJeQOX8jACYNfkrjZoVxWkOXPj1AQu2dfj85057_1XeIetRvMT6hflk0ne6fCoY9_JU-qBn2xO8/pub?gid=1089788162&single=true&output=csv';

      const FRASES_INICIALES = [
        "Un lector vive mil vidas antes de morir. El que no lee vive solo una.",
        "La depresión... como la manifestación de algo que no se puede reducir a lo anecdótico porque es estructural y colectivo.",
        "No hay barrera, cerradura ni cerrojo que puedas imponer a la libertad de mi mente."
      ];

      function BuscadorLibros({ placeholder, valor, setValor, onSelectLibro }) {
        const [sugerencias, setSugerencias] = useState([]);
        const [buscando, setBuscando] = useState(false);
        const [mostrarDropdown, setMostrarDropdown] = useState(false);

        useEffect(() => {
          if (!valor || valor.trim().length < 3) {
            setSugerencias([]);
            setMostrarDropdown(false);
            return;
          }
          const timer = setTimeout(async () => {
            setBuscando(true);
            try {
              const query = encodeURIComponent(valor.trim());
              const [resGoogle, resOpenLib] = await Promise.allSettled([
                fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=5&langRestrict=es`),
                fetch(`https://openlibrary.org/search.json?q=${query}&limit=5`)
              ]);
              let listaCombinada = [];
              if (resGoogle.status === 'fulfilled' && resGoogle.value.ok) {
                const dataG = await resGoogle.value.json();
                if (dataG.items) {
                  dataG.items.forEach(item => {
                    const info = item.volumeInfo || {};
                    listaCombinada.push({ titulo: info.title || '', autora: info.authors ? info.authors.join(', ') : 'Autora desconocida', portada: info.imageLinks?.thumbnail?.replace('http:', 'https:') || '' });
                  });
                }
              }
              if (resOpenLib.status === 'fulfilled' && resOpenLib.value.ok) {
                const dataOL = await resOpenLib.value.json();
                if (dataOL.docs) {
                  dataOL.docs.forEach(doc => {
                    listaCombinada.push({ titulo: doc.title || '', autora: doc.author_name ? doc.author_name.join(', ') : 'Autora desconocida', portada: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : '' });
                  });
                }
              }
              const unicos = [];
              const titulosVistos = new Set();
              listaCombinada.forEach(item => {
                const tLimpio = item.titulo.toLowerCase().trim();
                if (tLimpio && !titulosVistos.has(tLimpio)) { titulosVistos.add(tLimpio); unicos.push(item); }
              });
              setSugerencias(unicos.slice(0, 6));
              setMostrarDropdown(unicos.length > 0);
            } catch (err) { console.error(err); } finally { setBuscando(false); }
          }, 350);
          return () => clearTimeout(timer);
        }, [valor]);

        return (
          <div className="relative w-full">
            <div className="relative flex items-center">
              <input type="text" placeholder={placeholder} value={valor} onChange={(e) => { setValor(e.target.value); setMostrarDropdown(true); }} className="w-full editorial-input p-2.5 text-xs italic pr-8" />
              {buscando && <i className="fa-solid fa-spinner animate-spin absolute right-2.5 text-xs text-[#4A5028]"></i>}
            </div>
            {mostrarDropdown && sugerencias.length > 0 && (
              <div className="absolute top-full left-0 right-0 z-50 bg-[#FFFFFF] border border-[#E8E6DF] rounded-b-lg shadow-xl max-h-56 overflow-y-auto mt-1">
                {sugerencias.map((item, idx) => (
                  <div key={idx} onClick={() => { onSelectLibro(item); setMostrarDropdown(false); }} className="flex items-center gap-2.5 p-2 hover:bg-[#FBF9F5] cursor-pointer border-b border-[#E8E6DF] last:border-0 text-left">
                    {item.portada ? <img src={item.portada} alt="" className="w-7 h-10 object-cover rounded shrink-0 shadow-xs" /> : <div className="w-7 h-10 bg-[#F8F7F3] rounded shrink-0 flex items-center justify-center text-[7px] text-gray-400 border border-[#E8E6DF]">Sin foto</div>}
                    <div className="overflow-hidden">
                      <p className="text-sm font-bold text-[#232321] truncate leading-tight font-babydoll">{item.titulo}</p>
                      <p className="text-[10px] text-gray-500 italic truncate">{item.autora}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PortadaLibro({ titulo, autora, portada, size = 'normal' }) {
        const [imgUrl, setImgUrl] = useState(portada || '');
        const [errorImg, setErrorImg] = useState(false);

        useEffect(() => {
          setImgUrl(portada || ''); setErrorImg(false);
          if ((!portada || portada.trim() === '') && titulo && titulo.trim().length > 1) {
            let cancelado = false;
            const query = encodeURIComponent(titulo.trim());
            fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1&langRestrict=es`)
              .then(res => res.json())
              .then(data => {
                if (!cancelado && data.items && data.items[0]?.volumeInfo?.imageLinks?.thumbnail) {
                  setImgUrl(data.items[0].volumeInfo.imageLinks.thumbnail.replace('http:', 'https:'));
                } else if (!cancelado) {
                  return fetch(`https://openlibrary.org/search.json?q=${query}&limit=1`)
                    .then(r => r.json())
                    .then(dataOL => {
                      if (!cancelado && dataOL.docs && dataOL.docs[0]?.cover_i) {
                        setImgUrl(`https://covers.openlibrary.org/b/id/${dataOL.docs[0].cover_i}-M.jpg`);
                      }
                    });
                }
              }).catch(() => {});
            return () => { cancelado = true; };
          }
        }, [titulo, portada]);

        const sizeClasses = size === 'large' ? 'w-24 h-36 text-xs' : size === 'grid' ? 'w-16 h-24 text-[9px]' : size === 'thumb' ? 'w-10 h-14 text-[8px]' : 'w-12 h-16 text-[8px]';

        if (imgUrl && !errorImg) return <img src={imgUrl} alt={titulo} onError={() => setErrorImg(true)} className={`${sizeClasses} object-cover rounded shadow-xs shrink-0`} />;
        return (
          <div className={`${sizeClasses} bg-[#232321] text-[#FBF9F5] p-1.5 rounded shadow-xs border border-[#E8E6DF] shrink-0 flex flex-col justify-between overflow-hidden text-left relative`}>
            <div className="absolute top-0 right-0 w-1.5 h-full bg-[#4A5028]"></div>
            <span className="font-medium tracking-tight line-clamp-3 leading-tight font-babydoll text-sm">{titulo || 'Sin título'}</span>
            <span className="text-[8px] text-[#A2A86E] uppercase tracking-wider truncate">{autora || 'gilda'}</span>
          </div>
        );
      }

      function LomoLibroEstanteria({ item, onClick }) {
        const generarColorEditorial = (texto) => {
          let hash = 0;
          for (let i = 0; i < texto.length; i++) { hash = texto.charCodeAt(i) + ((hash << 5) - hash); }
          const matices = ['#4A5028', '#3E4522', '#633B28', '#2B3027', '#7A4232', '#3C5868', '#684C3C', '#4C3C68', '#5C4033', '#405242', '#6A4E36', '#35424A', '#523A3A', '#4A3B5C', '#3F4E4F'];
          return matices[Math.abs(hash) % matices.length];
        };

        return (
          <div onClick={onClick} style={{ backgroundColor: generarColorEditorial(item.libro || 'libro') }} className="lomo-libro text-[#FBF9F5] w-12 h-36 shrink-0 cursor-pointer shadow-md relative rounded-t-sm overflow-hidden flex flex-col justify-start p-2 border-t border-white/20" title={`${item.libro} — ${item.autora || 'Autora'}`}>
            <div className="absolute top-1 left-1.5 w-1 h-2 rounded-full bg-white/20"></div>
            <div className="flex flex-col h-full justify-start pt-3">
              <span className="font-babydoll font-bold text-[9px] leading-tight text-left text-white drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)] overflow-hidden" style={{writingMode: 'vertical-rl', textOrientation: 'mixed', maxHeight: '110px'}}>
                {item.libro}
              </span>
            </div>
          </div>
        );
      }

      function IlustracionDecoracion({ tipo }) {
        if (tipo === 'monstera') return (
          <svg width="42" height="46" viewBox="0 0 42 46" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">
            <path d="M14 34H28V44H14V34Z" fill="#D29062" stroke="#232321" strokeWidth="1.5"/><path d="M12 34H30V37H12V34Z" fill="#B87343" stroke="#232321" strokeWidth="1.5"/><path d="M21 34V16" stroke="#4A5028" strokeWidth="2" strokeLinecap="round"/><path d="M21 22C14 20 8 24 6 28C11 31 16 28 21 22Z" fill="#75813C" stroke="#232321" strokeWidth="1.5"/><path d="M21 18C28 16 34 20 36 24C31 27 26 24 21 18Z" fill="#636E31" stroke="#232321" strokeWidth="1.5"/><path d="M21 14C17 6 10 6 7 9C10 13 15 14 21 14Z" fill="#8A9945" stroke="#232321" strokeWidth="1.5"/><path d="M21 14C25 6 32 6 35 9C32 13 27 14 21 14Z" fill="#75813C" stroke="#232321" strokeWidth="1.5"/>
          </svg>
        );
        if (tipo === 'maceta') return (
          <svg width="40" height="42" viewBox="0 0 40 42" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">
            <path d="M10 28H30V40H10V28Z" fill="#E2D6C5" stroke="#232321" strokeWidth="1.5"/><path d="M8 25H32V29H8V25Z" fill="#F0E8DC" stroke="#232321" strokeWidth="1.5"/><path d="M20 25C15 16 11 10 9 6C15 10 18 16 20 25Z" fill="#75813C" stroke="#232321" strokeWidth="1.5"/><path d="M20 25C25 16 29 10 31 6C25 10 22 16 20 25Z" fill="#8A9945" stroke="#232321" strokeWidth="1.5"/>
          </svg>
        );
        if (tipo === 'vela') return (
          <svg width="32" height="44" viewBox="0 0 32 44" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">
            <path d="M8 20H24V42H8V20Z" fill="#FAF6EE" stroke="#232321" strokeWidth="1.5"/><path d="M15 16H17V20H15V16Z" fill="#232321"/><path className="vela-flama" d="M16 14C19 10 18 6 16 3C14 6 13 10 16 14Z" fill="#E67E22" stroke="#232321" strokeWidth="1.2"/>
          </svg>
        );
        if (tipo === 'cafe') return (
          <svg width="40" height="38" viewBox="0 0 40 38" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">
            <path d="M8 14H28V32H8V14Z" fill="#FFFFFF" stroke="#232321" strokeWidth="1.5"/><path d="M28 17H33C35 17 35 25 33 25H28" stroke="#232321" strokeWidth="1.5"/><path d="M8 14H28V18H8V14Z" fill="#633B28" stroke="#232321" strokeWidth="1.5"/><path className="humo-taza" d="M14 10C15 7 13 5 15 2" stroke="#B8A890" strokeWidth="1.5" strokeLinecap="round"/><path className="humo-taza" style={{animationDelay: '1s'}} d="M22 11C23 8 21 6 23 3" stroke="#B8A890" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        );
        if (tipo === 'cactus') return (
          <svg width="36" height="42" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 drop-shadow-sm">
            <path d="M10 32H26V40H10V32Z" fill="#B87343" stroke="#232321" strokeWidth="1.5"/><path d="M15 12C15 8 21 8 21 12V32H15V12Z" fill="#586938" stroke="#232321" strokeWidth="1.5"/><path d="M10 18H15V22H10C8 22 8 18 10 18Z" fill="#586938" stroke="#232321" strokeWidth="1.5"/><path d="M21 16H26C28 16 28 20 26 20H21V16Z" fill="#586938" stroke="#232321" strokeWidth="1.5"/>
          </svg>
        );
        return null;
      }

      function AvatarUsuaria({ foto, nombre, sizeClass = "w-9 h-9", textClass = "text-lg" }) {
        const [errorImg, setErrorImg] = useState(false);
        if (foto && foto.trim() !== '' && !errorImg) return <img src={foto} alt={nombre || 'Socia'} onError={() => setErrorImg(true)} className={`${sizeClass} rounded-full object-cover border border-[#E8E6DF] shrink-0`} />;
        return <div className={`${sizeClass} rounded-full bg-[#F8F7F3] border border-[#E8E6DF] flex items-center justify-center font-babydoll ${textClass} text-[#4A5028] shrink-0 font-bold`}>{(nombre || 'Socia').charAt(0).toUpperCase()}</div>;
      }

      function EdificioClub({ usuarias, libroActual, onAddWantToRead }) {
        const [usuariaActivaIndice, setUsuariaActivaIndice] = useState(0);
        const listaUsuarias = usuarias.length > 0 ? usuarias : [];
        const usuariaActiva = listaUsuarias[usuariaActivaIndice] || listaUsuarias[0] || {};
        const tieneProgresoClub = Number(usuariaActiva.pagina || 0) > 0;
        const misLibrosPersonales = usuariaActiva.misLecturasPersonales || [];

        return (
          <div className="flex flex-col items-center w-full max-w-[450px] mx-auto py-2 relative">
            <h2 className="text-[48px] font-babydoll text-center mb-0 text-[#232321] leading-none">gilda</h2>
            <p className="text-[13px] text-gray-500 text-center mb-4 leading-relaxed font-babydoll italic">selecciona una ventana para asomarte a sus lecturas</p>
            <div className="grid grid-cols-3 gap-x-6 gap-y-8 w-full max-w-[220px] mx-auto mb-10">
              {listaUsuarias.map((usuaria, indice) => {
                const estaLeyendo = usuaria.estaLeyendo;
                const seleccionada = usuariaActivaIndice === indice;
                const nombreMostrar = (usuaria.nombre || 'Socia').split(' ')[0].toLowerCase();
                return (
                  <div key={indice} className="relative flex flex-col items-center">
                    <div onClick={() => setUsuariaActivaIndice(indice)} className={`w-[32px] h-[44px] rounded-[2px] cursor-pointer transition-all duration-200 hover:scale-105 relative border ${estaLeyendo ? 'bg-[#FAF6E8] border-[#DCD6BE] shadow-[0_4px_12px_rgba(230,220,180,0.3)]' : 'bg-[#E3E0D6] border-[#D0CEB3]'} ${seleccionada ? 'outline-[1.5px] outline-[#4A5028] outline-offset-[3px]' : ''}`}></div>
                    <span className="text-[13px] text-gray-700 font-bold tracking-tight mt-1.5 truncate max-w-[60px] text-center font-babydoll">{nombreMostrar}</span>
                  </div>
                );
              })}
            </div>
            <div className="editorial-card w-full max-w-md p-5 flex flex-col gap-4 fade-in">
              <div className="flex justify-between items-center w-full border-b border-[#E8E6DF] pb-2.5 gap-2">
                <div className="flex items-center gap-2 overflow-hidden">

      function MapaGilda({ usuarias }) {
        const mapRef = useRef(null);
        const markersGroupRef = useRef(null);
        const [regionSeleccionada, setRegionSeleccionada] = useState(null);

        const COORDENADAS_PREDEFINIDAS = {
          'país vasco': [42.9896, -2.6189], 'cataluña': [41.5912, 1.5209], 'comunidad de madrid': [40.4168, -3.7038],
          'andalucía': [37.3891, -5.9845], 'galicia': [42.5751, -8.1339], 'comunidad valenciana': [39.4840, -0.3526],
          'tolosa': [43.1362, -2.0735], 'donostia': [43.3183, -1.9812], 'bilbao': [43.2630, -2.9350], 'madrid': [40.4168, -3.7038], 'barcelona': [41.3851, 2.1734]
        };

        const provinciasConteo = useMemo(() => {
          const conteo = {};
          usuarias.forEach(u => {
            const loc = (u.ciudad || u.provincia_region || 'Otras').trim();
            if (loc) {
              conteo[loc] = (conteo[loc] || 0) + 1;
            }
          });
          return Object.entries(conteo).sort((a, b) => b[1] - a[1]);
        }, [usuarias]);

        const ciudadesMap = useMemo(() => {
          const map = {};
          usuarias.forEach(u => {
            const loc = u.ciudad || u.provincia_region;
            const cp = u.codigo_postal || '';
            if (loc) {
              const key = cp ? `${loc}, ${cp}` : loc;
              if (!map[key]) map[key] = { query: key, nombreLocalidad: loc, usuarias: [] };
              map[key].usuarias.push(u);
            }
          });
          return Object.values(map);
        }, [usuarias]);

        useEffect(() => {
          if (!mapRef.current) {
            const map = L.map('mapa-gilda', { zoomControl: false, attributionControl: false }).setView([40.4167, -3.7037], 5);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
            markersGroupRef.current = L.layerGroup().addTo(map);
            mapRef.current = map;
          }
          setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 200);

          const renderMarkers = async () => {
            if (!markersGroupRef.current) return;
            markersGroupRef.current.clearLayers();
            const boundsArray = [];
            for (const item of ciudadesMap) {
              const locNombre = item.nombreLocalidad.toLowerCase().trim();
              let coor = COORDENADAS_PREDEFINIDAS[locNombre] || [40.4168, -3.7038];
              boundsArray.push(coor);
              const piruletaHtml = `
                <div style="position: relative; width: 16px; height: 24px; display: flex; align-items: center; justify-content: center;">
                  <svg viewBox="0 0 16 24" width="16" height="24" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.2));">
                    <line x1="8" y1="12" x2="8" y2="23" stroke="#232321" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="8" cy="7" r="6" fill="#4A5028" stroke="#232321" stroke-width="1.5"/>
                  </svg>
                  <span style="position: absolute; top: 1.5px; width: 100%; text-align: center; color: #FFFFFF; font-weight: bold; font-size: 8px; font-family: sans-serif;">${item.usuarias.length}</span>
                </div>
              `;
              const customIcon = L.divIcon({ html: piruletaHtml, className: 'custom-piruleta-mini', iconSize: [16, 24], iconAnchor: [8, 23], popupAnchor: [0, -24] });
              const marker = L.marker(coor, { icon: customIcon });
              marker.on('click', () => setRegionSeleccionada({ region: item.nombreLocalidad, usuarias: item.usuarias }));
              markersGroupRef.current.addLayer(marker);
            }
            if (boundsArray.length > 0 && mapRef.current) mapRef.current.fitBounds(boundsArray, { padding: [25, 25], maxZoom: 6 });
          };
          renderMarkers();
        }, [ciudadesMap]);

        return (
          <div className="space-y-4">
            <div className="relative">
              <div id="mapa-gilda"></div>
              {regionSeleccionada && (
                <div className="absolute inset-0 z-[1000] bg-[#FFFFFF]/95 backdrop-blur-sm p-4 flex flex-col rounded-lg fade-in text-[#232321]">
                  <div className="flex justify-between items-center border-b border-[#E8E6DF] pb-2 mb-3">
                    <h3 className="font-babydoll text-[#232321] font-bold text-lg">{regionSeleccionada.region} ({regionSeleccionada.usuarias.length})</h3>
                    <button onClick={() => setRegionSeleccionada(null)} className="text-xs text-gray-500 bg-white border border-[#E8E6DF] px-2 py-1 rounded font-babydoll">cerrar</button>
                  </div>
                  <div className="overflow-y-auto flex-grow space-y-2">
                    {regionSeleccionada.usuarias.map((u, i) => (
                      <div key={i} className="flex justify-between items-center text-xs p-2 bg-white rounded border border-[#E8E6DF] gap-2">
                        <span className="font-bold font-babydoll text-sm">{u.nombre}</span>
                        <span className="text-gray-500 font-babydoll">{u.ciudad || 'Sin localidad'}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* CONTADOR POR PROVINCIAS / REGIONES */}
            <div className="editorial-card p-4 space-y-2.5">
              <h4 className="font-babydoll text-base font-bold text-[#232321]">Lectoras por provincia o región</h4>
              <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pr-1">
                {provinciasConteo.map(([provincia, cantidad], idx) => (
                  <div key={idx} className="flex justify-between items-center bg-[#FBF9F5] px-3 py-2 rounded-xl border border-[#E8E6DF] text-xs">
                    <span className="font-bold font-babydoll truncate pr-2">{provincia}</span>
                    <span className="bg-[#4A5028] text-white px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0">{cantidad}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

                        <div className="flex justify-between items-center">
                          <h3 className="font-babydoll text-xl font-bold">Citas y notas</h3>
                          <button onClick={() => { setBotellaAbierta(!botellaAbierta); setFraseActualBotella((prev) => (prev + 1) % FRASES_INICIALES.length); }} className="text-[10px] text-gray-400 uppercase font-babydoll">descubrir</button>
                        </div>
                        {botellaAbierta && <div className="p-3 bg-[#FBF9F5] border border-[#E8E6DF] rounded-lg text-sm italic font-babydoll text-gray-700">"{FRASES_INICIALES[fraseActualBotella]}"</div>}
                        <div className="flex gap-2 pt-2 border-t border-[#E8E6DF]">
                          <input type="text" placeholder="Guardar cita..." value={nuevaFraseBotella} onChange={(e) => setNuevaFraseBotella(e.target.value)} className="flex-grow editorial-input px-3 py-2 text-xs" />
                          <button onClick={() => { if(!nuevaFraseBotella)return; setMisCitas([nuevaFraseBotella, ...misCitas]); enviarAccion('frase', {frase: nuevaFraseBotella}); setNuevaFraseBotella(''); }} className="editorial-btn px-3 text-xs font-babydoll text-base">guardar</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'edificio' && (
                    <div className="w-full flex justify-center">
                      <EdificioClub usuarias={miembrosEdificio} libroActual={libroActual} onAddWantToRead={(t, a, p) => guardarLibroPersonal(t, 0, 'want_to_read', a, p)} />
                    </div>
                  )}

                  {seccionApp === 'habitacion' && (
                    <div className="space-y-4 fade-in">
                      <div className="editorial-card p-5 space-y-4">
                        <div className="flex justify-between items-center border-b border-[#E8E6DF] pb-2.5">
                          <h3 className="font-babydoll text-2xl font-bold">Mi Habitación</h3>
                          <button onClick={() => { const nuevo = !isReadingNow; setIsReadingNow(nuevo); localStorage.setItem('gilda_is_reading', JSON.stringify(nuevo)); enviarAccion('estado_lectura', { leyendo: nuevo }); }} className={`px-3 py-1 text-xs rounded-full font-bold font-babydoll ${isReadingNow ? 'bg-[#4A5028] text-white' : 'bg-[#FBF9F5] border border-[#E8E6DF] text-gray-500'}`}>
                            {isReadingNow ? 'Luz encendida' : 'Luz apagada'}
                          </button>
                        </div>

                        {/* SELECTOR DE DECORACIÓN DIGITAL */}
                        <div className="flex items-center justify-between bg-[#FBF9F5] p-3 rounded-xl border border-[#E8E6DF]">
                          <span className="text-xs font-bold text-gray-600 font-babydoll">Decoración de balda:</span>
                          <select value={decoracionActual} onChange={(e) => { setDecoracionActual(e.target.value); localStorage.setItem('gilda_decoracion', e.target.value); }} className="editorial-input text-xs px-2.5 py-1.5 bg-white font-babydoll font-bold">
                            <option value="monstera">Plantita Monstera</option>
                            <option value="maceta">Maceta Cerámica</option>
                            <option value="vela">Vela Aromática</option>
                            <option value="cafe">Taza de Café</option>
                            <option value="cactus">Pequeño Cactus</option>
                            <option value="ninguna">Sin decoración</option>
                          </select>
                        </div>

                        {/* ESTANTERÍA DE MADERA CON ILUSTRACIÓN DIGITAL ANIMADA */}
                        <div className="pt-4 pb-6 px-3 estanteria-madera min-h-[225px] flex items-end justify-between overflow-x-auto">
                          <div className="flex items-end justify-start gap-3.5 flex-grow">
                            {todosMisLibrosEstanteria.length === 0 ? (
                              <div className="w-full text-center py-10"><p className="text-xs text-[#7A7565] italic font-babydoll">Aún no hay libros en tu estantería...</p></div>
                            ) : (
                              todosMisLibrosEstanteria.map((item, idx) => <LomoLibroEstanteria key={idx} item={item} onClick={() => setLibroSeleccionadoDetalle(item)} />)
                            )}
                          </div>
                          {decoracionActual !== 'ninguna' && (
                            <div className="shrink-0 pl-3 pb-1 flex items-end select-none">
                              <IlustracionDecoracion tipo={decoracionActual} />
                            </div>
                          )}
                        </div>

                        {/* SELLO HORIZONTAL ABAJO PARA STORIES */}
                        <div className="text-center pt-1 pb-2">
                          <span className="text-[11px] font-bold text-gray-400 tracking-wider font-babydoll">@gilda.mailclub</span>
                        </div>

                        {/* PESTAÑAS Y LISTA CLÁSICA DE LIBROS */}
                        <div className="pt-4 border-t border-[#E8E6DF] space-y-3">
                          <div className="flex bg-[#F8F7F3] p-1 rounded-xl text-xs font-bold text-center border border-[#E8E6DF] font-babydoll">
                            <button onClick={() => setTabEstanteria('leyendo')} className={`flex-1 py-1.5 rounded-lg ${tabEstanteria === 'leyendo' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Leyendo</button>
                            <button onClick={() => setTabEstanteria('want_to_read')} className={`flex-1 py-1.5 rounded-lg ${tabEstanteria === 'want_to_read' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Quiero leer</button>
                            <button onClick={() => setTabEstanteria('leidos')} className={`flex-1 py-1.5 rounded-lg ${tabEstanteria === 'leidos' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Leídos</button>
                          </div>

                          <form onSubmit={(e) => { e.preventDefault(); if (!libroPersonal.trim()) return; guardarLibroPersonal(undefined, undefined, tabEstanteria); }} className="space-y-2 bg-[#FBF9F5] p-3 rounded-xl border border-[#E8E6DF]">
                            <BuscadorLibros placeholder="Buscar libro..." valor={libroPersonal} setValor={setLibroPersonal} onSelectLibro={(l) => { setLibroPersonal(l.titulo); guardarLibroPersonal(l.titulo, 0, tabEstanteria, l.autora, l.portada); }} />
                            {tabEstanteria === 'leyendo' && (
                              <div className="flex gap-2">
                                <input type="number" placeholder="Pág." value={paginaPersonalInput} onChange={(e) => setPaginaPersonalInput(e.target.value)} className="w-1/2 editorial-input p-1.5 text-xs" />
                                <button type="submit" className="w-1/2 editorial-btn py-1 text-xs font-babydoll">Añadir</button>
                              </div>
                            )}
                          </form>

                          <div className="space-y-2">
                            {misLibrosFiltradosLista.map((item, idx) => (
                              <div key={idx} onClick={() => setLibroSeleccionadoDetalle(item)} className="flex items-center justify-between bg-[#FBF9F5] p-2.5 rounded-xl border border-[#E8E6DF] cursor-pointer hover:bg-[#F2EFE9]">
                                <div className="flex items-center gap-3 overflow-hidden">
                                  <PortadaLibro titulo={item.libro} autora={item.autora} portada={item.portada} size="thumb" />
                                  <div className="overflow-hidden text-left">
                                    <p className="font-bold text-sm text-[#232321] truncate font-babydoll">{item.libro}</p>
                                    <p className="text-[10px] text-gray-500 italic font-babydoll">{item.autora || 'Autora'}</p>
                                  </div>
                                </div>
                                <span className="text-[10px] text-gray-400 font-babydoll">pág. {item.pagina || item.paginas || 0}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {seccionApp === 'capitulos' && (
                    <div className="space-y-4 fade-in">
                      {capitulos.map((cap, i) => {
                        const paginaMinima = Number(cap.pagina_bloqueo || cap.pagina || cap.paginaminima || 0);
                        const desbloqueado = miPagina >= paginaMinima;
                        const identificadorCap = String(cap.id || cap.titulo || '').trim().toLowerCase();
                        const comentariosCapitulo = comentarios.filter(c => {
                          const cCap = String(c.capitulo_id || c.capitulo || c.titulo || '').trim().toLowerCase();
                          return cCap === identificadorCap;
                        });

                        return (
                          <div key={i} className="editorial-card p-5 space-y-4">
                            <div className="flex justify-between items-center">
                              <h3 className="font-babydoll text-2xl font-bold">{cap.titulo}</h3>
                              <span className="text-[10px] text-gray-400 font-babydoll">pág. {paginaMinima}</span>
                            </div>
                            {desbloqueado ? (
                              <div className="space-y-4">
                                <p className="text-xs text-gray-700 leading-relaxed whitespace-pre-line font-sans">{cap.descripcion || cap.contenido}</p>

                                {/* COMENTARIOS Y RESPUESTAS EN EL CAPÍTULO */}
                                <div className="pt-4 border-t border-[#E8E6DF] space-y-3">
                                  <h4 className="font-babydoll text-sm font-bold">Comentarios de lectoras</h4>
                                  
                                  <div className="space-y-2">
                                    {comentariosCapitulo.length === 0 ? (
                                      <p className="text-[11px] text-gray-400 italic font-babydoll">Aún no hay comentarios en este capítulo. ¡Sé la primera en escribir!</p>
                                    ) : (
                                      comentariosCapitulo.map((com, cIdx) => (
                                        <div key={cIdx} className="bg-[#FBF9F5] p-3 rounded-xl border border-[#E8E6DF] text-xs space-y-1">
                                          <div className="flex justify-between items-center">
                                            <span className="font-bold font-babydoll text-[#4A5028]">{com.usuario || com.usuaria || 'Socia'}</span>
                                            <span className="text-[9px] text-gray-400">{com.fecha || ''}</span>
                                          </div>
                                          <p className="text-gray-700">{com.comentario || com.mensaje}</p>

                                          {/* Hilos de respuestas si existen */}
                                          {com.respuestas && (
                                            <div className="pl-4 mt-2 border-l-2 border-[#DCD6BE] space-y-1.5">
                                              {/* Aquí puedes mostrar respuestas si vienen estructuradas */}
                                            </div>
                                          )}
                                        </div>
                                      ))
                                    )}
                                  </div>

                                  {/* Formulario nuevo comentario */}
                                  <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const clave = cap.id || cap.titulo;
                                    const txt = textoComentario[clave];
                                    if (!txt || !txt.trim()) return;
                                    
                                    // Actualización optimista local inmediata
                                    const nuevoCom = { capitulo_id: clave, capitulo: clave, usuario: nombreUsuarioPersonalizado || sesion.nombre, comentario: txt, fecha: 'Justo ahora' };
                                    setComentarios([...comentarios, nuevoCom]);

                                    enviarAccion('comentar_capitulo', { capitulo: clave, comentario: txt });
                                    setTextoComentario({ ...textoComentario, [clave]: '' });
                                    mostrarToast('Comentario enviado');
                                  }} className="flex gap-2 pt-1">
                                    <input 
                                      type="text" 
                                      placeholder="Escribe tu reflexión sobre este capítulo..." 
                                      value={textoComentario[cap.id || cap.titulo] || ''} 
                                      onChange={(e) => setTextoComentario({ ...textoComentario, [cap.id || cap.titulo]: e.target.value })} 
                                      className="flex-grow editorial-input px-3 py-2 text-xs" 
                                    />
                                    <button type="submit" className="editorial-btn px-3 text-xs font-babydoll">Comentar</button>
                                  </form>
                                </div>
                              </div>
                            ) : (
                              <div className="p-4 bg-[#FBF9F5] border border-[#E8E6DF] rounded-xl text-center space-y-2">
                                <i className="fa-solid fa-lock text-gray-400 text-sm"></i>
                                <p className="text-xs text-gray-500 font-babydoll">Capítulo bloqueado. Necesitas llegar a la página <b>{paginaMinima}</b> (vas por la {miPagina}).</p>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {seccionApp === 'comunidad' && (
                    <div className="space-y-4 fade-in">
                      <div className="flex bg-[#F8F7F3] p-1 rounded-xl text-[10px] uppercase font-bold text-center border border-[#E8E6DF] font-babydoll">
                        <button onClick={() => setSubTabComunidad('chat')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'chat' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Chat</button>
                        <button onClick={() => setSubTabComunidad('mapa')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'mapa' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Mapa ({usuariasClub.length})</button>
                        <button onClick={() => setSubTabComunidad('archivo')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'archivo' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Archivo</button>
                        <button onClick={() => setSubTabComunidad('buzon')} className={`flex-1 py-1.5 rounded-lg ${subTabComunidad === 'buzon' ? 'bg-[#232321] text-[#FBF9F5]' : 'text-gray-400'}`}>Buzón</button>
                      </div>

                      {subTabComunidad === 'chat' && (
                        <div className="editorial-card h-[450px] flex flex-col justify-between relative overflow-hidden">
                          <div className="bg-[#FBF9F5] p-3 border-b border-[#E8E6DF] flex items-center justify-between text-xs rounded-t-xl font-babydoll font-bold">
                            <span>Chat de Lectoras</span>
                            <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                          </div>
                          <div className="flex-grow p-4 overflow-y-auto space-y-3 flex flex-col">
                            {chatMsgs.map((m, i) => {
                              const usuarioMsg = (m.usuario || m.usuaria || '').toLowerCase().trim();
                              const miNombre = (nombreUsuarioPersonalizado || sesion.nombre || '').toLowerCase().trim();
                              const esMia = usuarioMsg === miNombre;
                              return (
                                <div key={i} className={`flex flex-col max-w-[85%] ${esMia ? 'self-end items-end' : 'self-start items-start'}`}>
                                  <span className="text-[9px] text-gray-400 font-babydoll mb-0.5 px-1">{m.usuario || m.usuaria}</span>
                                  <div className={`p-3 rounded-2xl text-xs leading-relaxed shadow-xs ${esMia ? 'bg-[#4A5028] text-white rounded-br-xs' : 'bg-[#F8F7F3] border border-[#E8E6DF] text-[#232321] rounded-bl-xs'}`}>
                                    {m.mensaje}
                                  </div>
                                </div>
                              );
                            })}
                            <div ref={chatEndRef} />
                          </div>
                          <form onSubmit={(e) => { e.preventDefault(); if(!nuevoChat.trim())return; enviarAccion('enviar_chat', {mensaje: nuevoChat}); setNuevoChat(''); }} className="p-2.5 border-t border-[#E8E6DF] flex gap-2 bg-white">
                            <input type="text" value={nuevoChat} onChange={e => setNuevoChat(e.target.value)} className="flex-grow editorial-input px-3 py-2 text-xs" placeholder="Escribe un mensaje al club..." />
                            <button type="submit" className="editorial-btn px-4 py-2 text-xs"><i className="fa-solid fa-paper-plane"></i></button>
                          </form>
                        </div>
                      )}

                      {subTabComunidad === 'mapa' && (
                        <div className="editorial-card p-3 space-y-2">
                          <div className="flex justify-between items-center text-xs px-1">
                            <span className="font-babydoll text-xl font-bold">Mapa Global de Lectoras</span>
                            <span className="text-[10px] text-[#4A5028] font-bold font-babydoll">{usuariasClub.length} socia(s)</span>
                          </div>
                          <MapaGilda usuarias={usuariasClub} />
                        </div>
                      )}

                      {subTabComunidad === 'archivo' && (
                        <div className="space-y-4">
                          <div className="editorial-card p-5 space-y-3">
                            <h3 className="font-babydoll text-xl font-bold">Proponer Nueva Lectura</h3>
                            <form onSubmit={(e) => {
                              e.preventDefault();
                              const tit = nuevaPropuestaTitulo?.trim();
                              if (!tit) return;
                              const nueva = { titulo: tit, autora: nuevaPropuestaAutora?.trim() || 'Desconocida', votos: '1', votantes: sesion.email.toLowerCase(), portada: nuevaPropuestaPortada?.trim() || '' };
                              setPropuestas([...propuestas, nueva]);
                              enviarAccion('propuesta', nueva);
                              setNuevaPropuestaTitulo(''); setNuevaPropuestaAutora(''); setNuevaPropuestaPortada('');
                              mostrarToast('Propuesta añadida.');
                            }} className="space-y-2">
                              <BuscadorLibros placeholder="Título del libro o autora..." valor={nuevaPropuestaTitulo} setValor={setNuevaPropuestaTitulo} onSelectLibro={(l) => { setNuevaPropuestaTitulo(l.titulo); setNuevaPropuestaAutora(l.autora); setNuevaPropuestaPortada(l.portada); }} />
                              <input type="text" placeholder="Autora..." value={nuevaPropuestaAutora || ''} onChange={e=>setNuevaPropuestaAutora(e.target.value)} className="w-full editorial-input p-2.5 text-xs" />
                              <button type="submit" className="w-full editorial-btn py-2 text-xs font-babydoll">Añadir propuesta</button>
                            </form>
                          </div>

                          <div className="editorial-card p-5">
                            <h3 className="font-babydoll text-xl font-bold mb-3">Próximas Lecturas</h3>
                            <div className="space-y-3">
                              {propuestas.map((p,i) => (
                                <div key={i} className="flex gap-3 border border-[#E8E6DF] p-3 rounded-xl bg-[#FBF9F5]">
                                  <PortadaLibro titulo={p.titulo} autora={p.autora} portada={p.portada} size="small" />
                                  <div className="flex flex-col justify-between w-full">
                                    <div><h4 className="font-bold text-base leading-tight font-babydoll">{p.titulo}</h4><p className="text-[10px] text-gray-500 italic font-babydoll">{p.autora}</p></div>
                                    <button onClick={()=>{
                                      const clon = [...propuestas]; const item = clon.find(x => x.titulo === p.titulo); if(!item) return;
                                      let arr = (item.votantes||"").toLowerCase().split(',').map(v=>v.trim()).filter(v=>v);
                                      if(arr.includes(sesion.email.toLowerCase())){ arr = arr.filter(v=>v!==sesion.email.toLowerCase()); item.votos = Math.max(0, Number(item.votos||0) - 1); } else { arr.push(sesion.email.toLowerCase()); item.votos = Number(item.votos||0) + 1; }
                                      item.votantes = arr.join(','); setPropuestas(clon); enviarAccion('votar', { tipo: 'propuesta', id: p.titulo, email: sesion.email }); mostrarToast('Voto actualizado.');
                                    }} className="self-start mt-2 px-3 py-1 text-[10px] rounded-full font-bold bg-white text-[#232321] border border-[#E8E6DF] font-babydoll">Votar ({p.votos||0})</button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                      {subTabComunidad === 'buzon' && (
                        <div className="editorial-card p-5 space-y-3">
                          <h2 className="font-babydoll text-2xl font-bold">Buzón privado</h2>
                          <p className="text-xs text-gray-500 font-babydoll">Sugerencias y comunicación directa con la administración.</p>
                          <textarea placeholder="Escribe tu mensaje..." value={mensajeFundadora} onChange={e=>setMensajeFundadora(e.target.value)} className="w-full editorial-input p-3 text-xs h-24 resize-none"></textarea>
                          <button onClick={()=>{ enviarAccion('buzon',{mensaje:mensajeFundadora}); setMensajeFundadora(''); mostrarToast('Mensaje enviado.');}} className="w-full editorial-btn py-2 text-xs font-babydoll">Enviar mensaje</button>
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </main>

            {/* BARRA INFERIOR SIMPLIFICADA DE 5 PESTAÑAS */}
            <nav className="editorial-nav fixed bottom-0 left-0 right-0 py-3 px-4 flex justify-around items-center max-w-md mx-auto z-40 rounded-t-2xl">
              {[
                { id: 'inicio', icon: 'fa-house', label: 'inicio' },
                { id: 'edificio', icon: 'fa-building', label: 'casa' },
                { id: 'habitacion', icon: 'fa-bookmark', label: 'habitación' },
                { id: 'capitulos', icon: 'fa-book-open', label: 'capítulos' },
                { id: 'comunidad', icon: 'fa-mug-hot', label: 'comunidad' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setSeccionApp(tab.id)} className={`flex flex-col items-center gap-1 transition-all p-1 ${seccionApp === tab.id ? 'text-[#232321] font-bold bg-[#F8F7F3] px-3 py-1 rounded shadow-xs' : 'text-gray-400 hover:text-gray-600'}`}>
                  <i className={`fa-solid ${tab.icon} text-sm`}></i>
                  <span className="text-[9px] font-bold uppercase font-babydoll">{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const containerRoot = ReactDOM.createRoot(document.getElementById('root'));
      containerRoot.render(<App />);
    </script>
  </body>
</html>
